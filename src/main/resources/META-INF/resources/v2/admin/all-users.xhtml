<!DOCTYPE HTML>
<HTML xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:viewAction action="#{v2AllUsersBean.load()}"/>
</f:metadata>

<h:head>
    <title>Opentheso</title>
    <link href="../../resources/img/icon_opentheso2.png" rel="icon"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/all.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/>
</h:head>

<h:body id="page-top" onload="initMenu()" style="margin:0; padding:0; height:100%;">
    <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>

    <h:panelGroup rendered="#{menuBean.checkIfUserIsConnected() and v2UserSession.canAccessSuperAdminScreen()}"
                  id="wrapper" style="height: 100%">
        <ui:include src="../../commun/menu.xhtml"/>

        <div id="content-wrapper" style="min-height:100%; position:relative;">
            <h:form id="containerIndex">
                <h:panelGroup id="header">
                    <ui:include src="../../commun/header.xhtml"/>
                </h:panelGroup>

                <div class="container-fluid" style="padding-bottom: 70px">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin: 20px">
                        <h1 class="h3 mb-0 text-gray-800">#{langueBean.getMsg('menu.profile')} / <span
                                style="color: #f47b2a">#{langueBean.getMsg('profile.all_users')}</span></h1>
                    </div>

                    <div class="card shadow mb-4" style="margin: 20px;">
                        <p:dataTable value="#{v2AllUsersBean.users}" var="user" size="small"
                                     paginator="true" rows="20" stripedRows="true"
                                     emptyMessage="#{langueBean.getMsg('rightbody.concept.no_value')}...">
                            <f:facet name="header">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="font-weight-bold">#{langueBean.getMsg('profile.list_of_all_users')}</span>
                                    <p:commandButton icon="fas fa-user-plus"
                                                     actionListener="#{v2AllUsersBean.prepareCreateDialog()}"
                                                     oncomplete="PF('v2CreateUser').show();"
                                                     update="idV2CreateUser" process="@this"
                                                     title="#{langueBean.getMsg('profile.new_user')}"/>
                                </div>
                            </f:facet>
                            <p:column headerText="Id" width="8%">
                                <h:outputText value="#{user.userId()}"/>
                            </p:column>
                            <p:column headerText="#{langueBean.getMsg('profile.pseudo')}" sortBy="#{user.username()}">
                                <h:outputText value="#{user.username()}"/>
                            </p:column>
                            <p:column headerText="#{langueBean.getMsg('profile.role')}" sortBy="#{user.roleName()}">
                                <h:outputText value="#{user.roleName()}"/>
                            </p:column>
                            <p:column headerText="#{langueBean.getMsg('profile.project')}" sortBy="#{user.projectName()}">
                                <h:outputText value="#{user.projectName()}"/>
                            </p:column>
                            <p:column headerText="#{langueBean.getMsg('profile.action')}" width="18%">
                                <p:commandButton icon="pi pi-user-edit" styleClass="rounded-button ui-button-outlined"
                                                 actionListener="#{v2AllUsersBean.prepareEditDialog(user.userId())}"
                                                 oncomplete="PF('v2EditUser').show();" update="idV2EditUser" process="@this"/>
                                <p:commandButton icon="pi pi-key" styleClass="rounded-button ui-button-outlined"
                                                 actionListener="#{v2AllUsersBean.preparePasswordDialog(user.userId())}"
                                                 oncomplete="PF('v2ResetPassword').show();" update="idV2ResetPassword" process="@this"/>
                                <p:commandButton icon="pi pi-trash" styleClass="rounded-button ui-button-danger"
                                                 actionListener="#{v2AllUsersBean.prepareDeleteDialog(user.userId(), user.username())}"
                                                 oncomplete="PF('v2DeleteUser').show();" update="idV2DeleteUser" process="@this"/>
                            </p:column>
                            <f:facet name="footer">
                                <span class="p-text-bold">#{langueBean.getMsg('profile.totalOfUsers')}: #{v2AllUsersBean.users.size()}</span>
                            </f:facet>
                        </p:dataTable>
                    </div>
                </div>
            </h:form>

            <ui:include src="../../commun/footer.xhtml"/>
            <ui:include src="create-user-dialog.xhtml"/>
            <ui:include src="edit-user-dialog.xhtml"/>
            <ui:include src="reset-password-dialog.xhtml"/>
            <ui:include src="delete-user-dialog.xhtml"/>
            <ui:include src="../../dialog/login/logout.xhtml"/>
        </div>
    </h:panelGroup>
</h:body>
</HTML>
