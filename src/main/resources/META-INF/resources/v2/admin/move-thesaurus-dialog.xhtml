<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2MoveThesaurus" header="#{v2LocaleBean.getMsg('profile.moveThesaurus')}" widgetVar="v2MoveThesaurus"
              width="450" showEffect="fade" modal="true" resizable="false" position="top" style="margin-top: 30px">
        <h:form id="v2MoveThesaurusForm">
            <p:defaultCommand target="v2MoveThesaurusBtn"/>

            <div class="row">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.moveThesaurus')}: "/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2AllThesauriBean.selectedThesaurusTitle} (#{v2AllThesauriBean.selectedThesaurusId})"
                                  style="font-size: 13px; color: #43B572;"/>
                </div>
            </div>

            <div class="row" style="margin-top: 10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.toProject')}: "/>
                </div>
                <div class="col-7">
                    <p:autoComplete value="#{v2AllThesauriBean.targetProject}" var="project" forceSelection="true"
                                    completeMethod="#{v2AllThesauriBean.autocompleteProjects}"
                                    minQueryLength="1" itemLabel="#{project.name()}" itemValue="#{project}"
                                    converter="projectSummaryConverter"
                                    scrollHeight="600"
                                    inputStyle="font-size: 12px; width: 100%; height: 25px; box-shadow: none; border-color: #43B572"
                                    style="font-size: 13px; width: 100%">
                        <p:column>
                            <h:outputText title="#{project.id()}" value="#{project.name()}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" styleClass="ui-button-secondary button"
                                 icon="fas fa-undo-alt" style="margin-right: 10px"
                                 oncomplete="PF('v2MoveThesaurus').hide();"
                                 update=":containerIndex:idV2MoveThesaurus" process="@this"/>
                <p:commandButton id="v2MoveThesaurusBtn" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success" icon="pi pi-check"
                                 action="#{v2AllThesauriBean.moveThesaurus()}" process="@form"
                                 oncomplete="PF('v2MoveThesaurus').hide();"
                                 update="messageIndex containerIndex"/>
            </div>
            <input type="hidden" name="csrfToken" value="#{sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
