<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idLogout" header="#{v2LocaleBean.getMsg('menu.logout')}" widgetVar="logout"
              showEffect="fade" modal="true" resizable="false" position="top"
              style="margin-top: 50px; font-size: 12px;">

        <p:spacer height="20px"/>
        <h:form>
            <h:outputText value="#{v2LocaleBean.getMsg('menu.validateLogout')}"/>

            <div style="width: 100%; text-align: right; margin-top: 20px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 process="@this" ajax="true"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 style="margin-right: 10px" update="idLogout"
                                 oncomplete="PF('logout').hide();"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 process="@this" icon="pi pi-check"
                                 ajax="false" actionListener="#{v2LoginBean.logout()}"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
