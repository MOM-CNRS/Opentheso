<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
          <div class="view-panel" id="viewHyper">
            <div class="hyper">
              <div class="hyper-bar">
                <button type="button" class="hyper-up" id="hyperCenter">⊙ Recentrer</button>
                <button type="button" class="hyper-up" id="hyperOpen" disabled="disabled">Ouvrir la fiche</button>
                <label class="hyper-search-wrap">
                  <input type="search" class="hyper-search" id="hyperSearch" placeholder="Rechercher…"
                         autocomplete="off" spellcheck="false" aria-label="Rechercher un concept sur le globe"/>
                </label>
                <span class="hyper-picked" id="hyperPicked"></span>
                <span class="hyper-count" id="hyperCount"></span>
              </div>
              <div class="hyper-neighbors" id="hyperNeighbors" hidden="hidden" aria-live="polite"></div>
              <div class="hyper-stage" id="hyperStage">
                <div class="flat-loading" id="hyperLoading" hidden="hidden" aria-live="polite">
                  <div class="mg-bars-loading">
                    <span class="mg-kpi-spin" aria-hidden="true"></span>
                    <span class="flat-loading-lbl">Chargement du globe…</span>
                  </div>
                </div>
                <canvas class="hyper-globe" id="hyperGlobe" tabindex="0"
                        aria-label="Globe des concepts du thésaurus. Flèches pour tourner, Entrée pour ouvrir, recherche ci-dessus."></canvas>
                <canvas class="hyper-globe-fx" id="hyperGlobeFx" aria-hidden="true"></canvas>
                <div class="hyper-tip" id="hyperTip" hidden="hidden"></div>
                <div class="hyper-empty" id="hyperEmpty" hidden="hidden">Aucun concept à afficher dans cette langue.</div>
              </div>
            </div>
          </div>
</ui:composition>
