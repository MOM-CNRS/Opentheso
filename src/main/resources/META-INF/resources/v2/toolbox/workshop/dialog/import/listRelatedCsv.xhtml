<ui:fragment xmlns="http://www.w3.org/1999/xhtml"  
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idListRelatedCsv" header="#{v2LocaleBean.getMsg('actions.importRelated')}" widgetVar="listRelatedCsv"
              modal="true" resizable="true" position="top" width="650" style="margin-top: 50px; " >         

        <h:form id="listRelatedCsvForm">
            <div class="row">                
                <div class="col-12" >
                    <fieldset>
                        <p:scrollPanel mode="native">
                            <h:panelGrid columns="2" styleClass="customTable">
                                <h:outputText value="localId" />
                                <h:outputText value="skos:related" />

                                <h:outputText value="26678" />
                                <h:outputText value="300" />
                            </h:panelGrid>
                        </p:scrollPanel>

                        <style>
                            .customTable {
                                border-collapse: collapse;
                            }

                            .customTable td, .customTable th {
                                border: 0.5px solid black; /* Bordure de 0.5px */
                                padding: 5px; /* Espace intérieur */
                            }

                            /* Cible la première ligne du tableau (9 cellules) */
                            .customTable tr:first-child td {
                                background-color: #f0f0f0; /* Arrière-plan gris clair */
                                font-weight: bold; /* Texte en gras */
                                text-align: center; /* Texte centré */
                            }
                        </style>

                        <p:panel style="border: 1px solid #43B572; border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 12px;">
                            <p style="color: #000;">
                                Les termes doivent avoir un séparateur (virgule, point-virgule ou tabulé) dans le fichier à uploader.<br/>
                                Si l'identifiant n'existe pas dans le thésaurus, la relation sera rejetée.<br/>
                                Si le concept a déjà la même relation, elle sera rejetée  <br/>
                            </p>
                        </p:panel>
                    </fieldset>
                </div>  
            </div> 

            <!-- choix du l'identifiant Ark ou Id ou Handle -->
            <div class="row" style="margin-top: 10px; font-size: 14px;" >
                <div class="col-5">
                    <h:outputText value="L'identifiant est de type:" />
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2WorkshopImportBean.selectedIdentifierImportAlign}" 
                                     styleClass="selectOneMenu_custom" 
                                     panelStyleClass="selectOneMenu_panelStyle_custom" style="width: 100%;"
                                     title="Choix de l'identifiant pour détecter le concept">
                        <f:selectItem itemLabel="identifier" itemValue="identifier" itemDescription="L'identifiant interne du concept"/>
                        <p:ajax event="change" listener="#{v2WorkshopImportBean.actionChoiceIdentifier()}"  />
                    </p:selectOneMenu>
                </div>
            </div>                   

            <!-- délimiteur CSV -->
            <div class="row" style="font-size: 14px;" >
                <div class="col-5" offset="5">
                    <h:outputText value="Délimiteur Csv :" />
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2WorkshopImportBean.choiceDelimiter}" styleClass="selectOneMenu_custom" 
                                     panelStyleClass="selectOneMenu_panelStyle_custom" style="width: 100%;">
                        <f:selectItem itemLabel="," itemValue="0" />
                        <f:selectItem itemLabel=";" itemValue="1" />
                        <f:selectItem itemLabel="\t" itemValue="2" />
                        <p:ajax event="change" listener="#{v2WorkshopImportBean.actionChoice()}"  />
                    </p:selectOneMenu>
                </div>
            </div>

            <h:panelGroup id="panelListAlignCsv">
                <!-- Choix du fichier -->   
                <div class="row" style="margin-top: 10px; font-size: 12px;">
                    <div class="col-12" style="font-size: 12px;"> 
                        <p:fileUpload listener="#{v2WorkshopImportBean.loadFileRelatedCsv}"
                                      label="parcourir" 
                                      mode="advanced" auto="true"
                                      update="panelListAlignCsv_result"
                                      disabled="#{v2WorkshopImportBean.loadDone}"
                                      style="font-size: 12px;">
                                      <p:validateFile allowTypes="/(\.|\/)(csv|txt)$/"/>
                        </p:fileUpload>  
                    </div>
                </div>              
            </h:panelGroup>            
            <h:panelGroup id="panelListAlignCsv_result">
                <h:panelGroup rendered="#{v2WorkshopImportBean.loadDone}">
                    <div class="row" style="margin-left: 30px; margin-right: 30px;">
                        <div class="col-5">
                            <h:outputText value="URI: " />
                            <h:outputText value="#{v2WorkshopImportBean.uri}" style="color: #C63632"/>
                        </div>
                    </div>
                    <div class="row" style="margin-left: 30px; margin-right: 30px; font-size: 12px;">
                        <div class="col-5">
                            <h:outputText value="Total des concepts: " />
                            <h:outputText value="#{v2WorkshopImportBean.total}" style="color: #C63632"/>
                        </div>
                    </div>                    
                </h:panelGroup>
                <div class="row" style="margin-left: 30px; margin-right: 30px; font-size: 12px;">
                    <div class="col-11">
                        <p:messages id="messages" showDetail="true" closable="true" style="font-size: 12px;">
                            <p:autoUpdate/>
                        </p:messages>
                    </div>
                </div>                      
              
                <div class="row" style="margin-top: 10px">
                    <div class="col-12" style="text-align: right"> 
                        <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" icon="fas fa-undo-alt" styleClass="ui-button-secondary button"  
                                         actionListener="#{v2WorkshopImportBean.init()}" style="margin-right: 10px"
                                         update="listRelatedCsvForm" oncomplete="PF('listRelatedCsv').hide();"/>

                        <p:commandButton  value="#{v2LocaleBean.getMsg('candidat.import')}" styleClass="ui-button-success" icon="pi pi-check"
                                          widgetVar="buttonImportCsv"
                                          update="listRelatedCsvForm" actionListener="#{v2WorkshopImportBean.addRelatedList()}"
                                          process="@this" disabled="#{!v2WorkshopImportBean.loadDone}" />   
                    </div>
                </div>
            </h:panelGroup>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
        </h:form>
    </p:dialog> 
</ui:fragment>
