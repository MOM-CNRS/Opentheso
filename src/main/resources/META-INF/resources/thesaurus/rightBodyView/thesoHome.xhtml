<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://java.sun.com/jsf/html"  
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <div style="margin: 20px; color: #000">

        <style>
            body .ui-accordion .ui-accordion-header>.ui-icon.ui-icon-triangle-1-e {
                font-size: 12px;
            }
        </style>

        <h:panelGroup rendered="#{(currentUser.nodeUser != null) and (currentUser.hasRoleAsAdmin) and !(viewEditorThesaurusHomeBean.isInEditing())}">
            <div class="row">
                <div class="col-xl-2 col-lg-2 col-md-2 col-sm-2 offset-xl-10 offset-lg-9 offset-md-9 offset-sm-8" style="text-align: right">
                    <p:commandButton value="#{langueBean.getMsg('candidat.edit')}" 
                                     update="containerIndex:formRightTab "
                                     icon="pi pi-pencil"
                                     styleClass="ui-button-success" ajax="true" 
                                     actionListener="#{viewEditorThesaurusHomeBean.initText(selectedThesaurus.getSelectedLang(), selectedThesaurus.getCurrentIdTheso())}"/>
                </div>
            </div>    
            <p:separator />            
        </h:panelGroup>

        <!-- vue pulic non connectée -->
        <h:panelGroup id="thesoHomeData" rendered="#{!(viewEditorThesaurusHomeBean.isInEditing())}" style="border: none; margin-top: 20px">
            <div class="row" style="background-color: #F5F2F2">
                <div class="col-1"  style="margin-top: 3px">
                    <i class="fas fa-info-circle fa-2x" style="color: #43B572" />
                </div>
                <div class="col-11" style="margin-left: -10px;">
                    <div class="row">
                        <div class="col-6" style="margin-top: 3px">
                            <h:outputText value="#{selectedThesaurus.thesoName}: " style="font-size: 13px; font-weight: bold"/>
                            <h:outputText value=" #{viewEditorThesaurusHomeBean.getTotalConceptOfThesaurus(selectedThesaurus.getCurrentIdTheso())}"
                                          title="#{langueBean.getMsg('thesohome.totalConcepts')} #{selectedThesaurus.thesoName}"
                                          style="font-size: 13px; color: #F47B2A; font-weight: bold;"/>
                            <h:outputText value=" Concepts" style="font-size: 13px; color: #858796"/>
                            
                            <h:outputText value="; #{langueBean.getMsg('profile.project')}:" style="font-size: 13px;"/>
                            <h:outputText value="  #{viewEditorThesaurusHomeBean.getProjectName(selectedThesaurus.getCurrentIdTheso())}" style="font-size: 13px; color: #F47B2A;font-weight: bold"/>
                            <p:commandButton icon="fa-solid fa-circle-question" styleClass="rounded-button ui-button-flat" style="margin-left: 5px; color: #f47b2a"
                                             action="#{roleOnThesaurus.showInfosOfThesaurus(selectedThesaurus.currentIdTheso)}"/>
                        </div>
                        
                        <div class="col-6" style="text-align: right">
                            <h:outputText value="#{langueBean.getMsg('thesohome.modified')}: " style="font-size: 13px; color: #858796"/>
                            <h:outputText value=" #{viewEditorThesaurusHomeBean.getLastModifiedDate(selectedThesaurus.getCurrentIdTheso())}" style="font-size: 13px; color: #601e18;"/>
                        </div>
                    </div>
                    
                  
                    
                    <div class="row">
                        <div class="col-10" style="margin-top: 3px">
                            <h:outputText value="#{langueBean.getMsg('home.permalink')}: " style="font-size: 13px; color: #858796"/>
                            <h:panelGroup rendered="#{roleOnThesaurus.nodePreference.originalUriIsArk}">
                                <h:panelGroup rendered="#{selectedThesaurus.arkId != null}">
                                    <i class="pi pi-link" style="margin-right: 5px; color: #f47b2a; font-size: 13px;"/>
                                    <p:link href="#{not empty selectedThesaurus.getUriOfTheso(roleOnThesaurus.nodePreference) ? selectedThesaurus.getUriOfTheso(roleOnThesaurus.nodePreference) : '#'}"
                                            value="#{selectedThesaurus.getUriOfTheso(roleOnThesaurus.nodePreference)}"
                                            style="color: #164A78; font-size: 13px;color: #F47B2A;" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{selectedThesaurus.arkId == null}">
                                    <p:link href="#{request.contextPath}/?idt=#{selectedThesaurus.currentIdTheso}"
                                            value="#{request.serverName}#{request.contextPath}/?idt=#{selectedThesaurus.currentIdTheso}"
                                            style="font-size: 13px; color: #F47B2A;" >
                                        <i class="pi pi-link" style="color: #43B572;" />
                                    </p:link>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!roleOnThesaurus.nodePreference.originalUriIsArk}">
                                <p:link href="#{request.contextPath}/?idt=#{selectedThesaurus.currentIdTheso}"
                                        value="#{request.serverName}#{request.contextPath}/?idt=#{selectedThesaurus.currentIdTheso}"
                                        style="font-size: 13px; color: #F47B2A;" >
                                    <i class="pi pi-link" style="color: #43B572;" />
                                </p:link>
                            </h:panelGroup>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <h:outputText value="#{langueBean.getMsg('thesohome.lastModificationConcepts')}: " style="font-size: 13px;color: #858796"/>

                            <ui:repeat var="value1" varStatus="status1" value="#{viewEditorThesaurusHomeBean.getLastModifiedConcepts(selectedThesaurus.getCurrentIdTheso(), selectedThesaurus.getCurrentLang())}">

                                <p:commandLink rendered="#{value1.value != ''}" value="#{value1.value}"
                                               style="font-size: 13px; color: #601e18;"
                                               title="#{value1.id}"
                                               action="#{conceptView.getConcept(selectedThesaurus.selectedIdTheso, value1.id, selectedThesaurus.selectedLang, currentUser)}"
                                               update="containerIndex:formRightTab indexTitle"/>
                                <h:outputText rendered="#{!status1.last}" value=", " style="color: #FF7979"/>
                            </ui:repeat>
                        </div>                
                    </div>  
                    
                    
                    <!-- Méta-données -->
                    <div class="row" style="margin-top: 10px;">
                        <div class="col-2">
                            <img src="#{request.contextPath}/resources/img/dcmi_logo.png" style="height: 17px; " />
                        </div>
                        <div class="col-10" style="margin-top: -2px;">
                            <p:accordionPanel id="meta" widgetVar="basic" activeIndex="-2" style="font-size: 12px;" >
                                <p:tab title="#{langueBean.getMsg('thesohome.metadata')}" titleStyle="color: #858796; background-color: #F5F2F2; font-size: 12px; border: none">
                                    <p:dataTable id="metadataTheso" widgetVar="metadataTheso" var="dcElement" value="#{viewEditorThesaurusHomeBean.meta(selectedThesaurus.getCurrentIdTheso())}"
                                                 editable="false" scrollHeight="250" scrollable="true" showGridlines="true" lazy="false">

                                        <p:column width="20%" headerText="#{langueBean.getMsg('toolbox.metadata_property')}">
                                            <h:outputText value="#{dcElement.name}" />
                                        </p:column>

                                        <p:column width="60%" headerText="#{langueBean.getMsg('candidat.value')}">
                                            <h:outputText value="#{dcElement.value}" />
                                        </p:column>
                                        <p:column width="10%" headerText="#{langueBean.getMsg('rightbody.conceptdialog.language')}">
                                            <h:outputText value="#{dcElement.language}" />
                                        </p:column>                                        
                                        <p:column width="10%" headerText="#{langueBean.getMsg('statistique.type')}">
                                            <h:outputText value="#{dcElement.type}" />
                                        </p:column>  
                                    </p:dataTable>                                    
                                </p:tab>
                            </p:accordionPanel>                     
                        </div>                
                    </div>                      
                </div>   
            </div>
           
            
            <p:separator style="color: #F47B2A" />

            <div class="row">
                <div class="col-12">
                    <h:outputText escape="false" style="font-size: 14px;" value="#{viewEditorThesaurusHomeBean.getThesaurusHomePage(selectedThesaurus.getSelectedLang(), selectedThesaurus.getCurrentIdTheso())}" />
                </div>                
            </div>
        </h:panelGroup>

        <!-- vue connectée pour édition -->


        <h:panelGroup id="thesoHomePageEdition" rendered="#{(viewEditorThesaurusHomeBean.isInEditing())}" >

            <div class="row">
                <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6" >
                    <p:commandButton value="#{langueBean.getMsg('thesohome.interpretedHTMLView')}"
                                     update="containerIndex" styleClass="ui-button-success"
                                     action="#{viewEditorThesaurusHomeBean.setViewPlainTextTo(false)}"/>
                </div>
                
                <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 offset-xl-4 offset-lg-4 offset-md-0 offset-sm-0"
                     style="font-size: 12px; text-align: right">
                    <p:commandButton value="#{langueBean.getMsg('thesohome.rawHTMLView')}"
                                     styleClass="ui-button-success" update="containerIndex"
                                     action="#{viewEditorThesaurusHomeBean.setViewPlainTextTo(true)}"
                                     style="font-size: 12px;"/>
                </div>
            </div>

            <h:panelGroup rendered="#{!viewEditorThesaurusHomeBean.isViewPlainText()}">
                <div class="row" style="margin-top: 10px">
                    <div class="col-12">
                        <p:textEditor widgetVar="editor1" value="#{viewEditorThesaurusHomeBean.text}" secure="false" height="300" style="margin-bottom:5px; margin-right: 5px"/>
                    </div>
                </div>
            </h:panelGroup>                    
            <h:panelGroup rendered="#{viewEditorThesaurusHomeBean.isViewPlainText()}">
                <div class="row">
                    <div class="col-12">
                        <p:inputTextarea value="#{viewEditorThesaurusHomeBean.text}" style="width: 100%; margin-bottom:5px; margin-right: 5px"/>
                    </div>
                </div>
            </h:panelGroup>
            <div class="row">
                <div class="col-12" style="text-align: right">
                    <p:commandButton id="buttonCancel" value="#{langueBean.getMsg('btnCancel')}" 
                                     style=" margin-right: 20px" update="containerIndex"
                                     styleClass="ui-button-secondary button" icon="fas fa-undo-alt"
                                     actionListener="#{viewEditorThesaurusHomeBean.reset()}"/>

                    <p:commandButton value="#{langueBean.getMsg('candidat.save')}" 
                                     update="containerIndex messageIndex"
                                     styleClass="ui-button-success" icon="pi pi-check"
                                     action="#{viewEditorThesaurusHomeBean.updateThesaurusHomePage(selectedThesaurus.getSelectedLang(), selectedThesaurus.getCurrentIdTheso())}" />
                </div>
            </div>
        </h:panelGroup>
    </div>       
</ui:fragment>
