<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                template="/v2/includes/layout.xhtml">
  <ui:param name="v2Page" value="thesauri"/>
  <ui:define name="viewActions">
    <f:viewAction action="#{v2ConsultationShellBean.clearThesaurusAccessDenied}" onPostback="false"/>
  </ui:define>
  <ui:define name="title">OpenTheso — Sélection de thésaurus</ui:define>
  <ui:define name="detail"/>
  <ui:define name="main">
    <h:panelGroup id="tpPage" layout="block" styleClass="tp-page">
    <h:form id="thesaurusPickerForm" prependId="false" styleClass="tp-form-root">
      <h:panelGroup id="tpRoot" layout="block"
                    styleClass="tp#{v2ThesaurusPickerBean.createMode or v2ThesaurusPickerBean.editMode ? ' tp--create' : ''}#{v2ThesaurusPickerBean.editMode ? ' tp--edit' : ''}#{v2ThesaurusPickerBean.importMode or v2ThesaurusPickerBean.exportMode ? ' tp--dormant' : ''}"
                    pt:data-flash="#{v2ThesaurusPickerBean.listFlashMessage}"
                    pt:data-flash-token="#{v2ThesaurusPickerBean.listFlashToken}"
                    pt:data-flash-error="#{v2ThesaurusPickerBean.listFlashError}">
        <ui:include src="/v2/thesauri/includes/list.xhtml"/>
        <ui:include src="/v2/thesauri/includes/create.xhtml"/>
        <ui:include src="/v2/thesauri/includes/edit.xhtml"/>
      </h:panelGroup>
      <ui:include src="/v2/thesauri/includes/overlays.xhtml"/>
    </h:form>

    <ui:include src="/v2/thesauri/includes/import.xhtml"/>
    <ui:include src="/v2/thesauri/includes/export.xhtml"/>
    </h:panelGroup>

    <ui:include src="/v2/thesauri/includes/scripts.xhtml"/>
  </ui:define>
</ui:composition>
