<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

    <div class="row mb-3">
        <div class="col-12 text-center">
            <p:commandButton value="#{v2LocaleBean.getMsg('candidat.export')}"
                             icon="fas fa-download"
                             ajax="false"
                             styleClass="ui-button-success"
                             actionListener="#{v2ThesaurusExportBean.prepare(
                                 v2EditionBean.selectedThesaurusForAction.id,
                                 v2EditionBean.selectedThesaurusForAction.title,
                                 downloadMode)}"
                             onclick="PrimeFaces.monitorDownload(startExport, stopExport);">
                <p:fileDownload value="#{v2ThesaurusExportBean.downloadFile}"/>
            </p:commandButton>
        </div>
    </div>
</ui:fragment>
