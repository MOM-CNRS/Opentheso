<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

    <div class="card mb-4 py-3 border-left-success" style="margin:20px;">
        <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
            <div class="list-group-item list-group-item-action" style="margin-top:-5px;">
                <div class="row" style="margin-left:0;">
                    <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.export_concept')}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                    <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7">
                        <i class="pi pi-download" style="color:#f47b2a; margin-right:10px;"/>

                        <p:commandButton value="RDF/XML"
                                         ajax="false"
                                         process="@this"
                                         actionListener="#{v2ConceptSkosExportBean.prepare(
                                             v2ConceptSelectionContext.thesaurusId,
                                             v2ConceptSelectionContext.conceptId)}"
                                         style="font-size:13px; color:#164A78; background:none; border:none; box-shadow:none;">
                            <p:fileDownload value="#{v2ConceptSkosExportBean.downloadConcept('skos')}"/>
                        </p:commandButton>

                        <p:commandButton value="Json"
                                         ajax="false"
                                         process="@this"
                                         actionListener="#{v2ConceptSkosExportBean.prepare(
                                             v2ConceptSelectionContext.thesaurusId,
                                             v2ConceptSelectionContext.conceptId)}"
                                         style="font-size:13px; color:#164A78; background:none; border:none; box-shadow:none;">
                            <p:fileDownload value="#{v2ConceptSkosExportBean.downloadConcept('json')}"/>
                        </p:commandButton>

                        <p:commandButton value="JsonLd"
                                         ajax="false"
                                         process="@this"
                                         actionListener="#{v2ConceptSkosExportBean.prepare(
                                             v2ConceptSelectionContext.thesaurusId,
                                             v2ConceptSelectionContext.conceptId)}"
                                         style="font-size:13px; color:#164A78; background:none; border:none; box-shadow:none;">
                            <p:fileDownload value="#{v2ConceptSkosExportBean.downloadConcept('jsonld')}"/>
                        </p:commandButton>

                        <p:commandButton value="Turtle"
                                         ajax="false"
                                         process="@this"
                                         actionListener="#{v2ConceptSkosExportBean.prepare(
                                             v2ConceptSelectionContext.thesaurusId,
                                             v2ConceptSelectionContext.conceptId)}"
                                         style="font-size:13px; color:#164A78; background:none; border:none; box-shadow:none;">
                            <p:fileDownload value="#{v2ConceptSkosExportBean.downloadConcept('turtle')}"/>
                        </p:commandButton>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ui:fragment>
