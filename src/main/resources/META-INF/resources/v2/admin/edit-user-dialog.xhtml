<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2EditUser" header="#{v2LocaleBean.getMsg('profile.modify_user')}" widgetVar="v2EditUser"
              width="500" modal="true" resizable="false" position="top">
        <h:form id="v2EditUserForm">
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.pseudo')}"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.editUsername}"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.email')}"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.editEmail}"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.alert_by_email')}"/></div>
                <div class="col-8"><p:toggleSwitch value="#{v2AllUsersBean.editAlertMail}"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('apply')}" icon="pi pi-check"
                                 actionListener="#{v2AllUsersBean.updateUser()}"
                                 process="@form" update=":containerIndex :messageIndex"/>
            </div>

            <p:separator/>

            <h:panelGroup id="v2EditUserApiKey">
                <div class="row mb-2">
                    <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.apiKeyAuthorize')}"/></div>
                    <div class="col-8">
                        <p:toggleSwitch value="#{v2AllUsersBean.editHasApiKey}">
                            <p:ajax listener="#{v2AllUsersBean.onEditHasApiKeyChange()}"
                                    update="v2EditUserApiKey"/>
                        </p:toggleSwitch>
                    </div>
                </div>
                <h:panelGroup rendered="#{v2AllUsersBean.editHasApiKey}">
                    <div class="row mb-2">
                        <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.defApiKey')}"/></div>
                        <div class="col-8">
                            <p:toggleSwitch value="#{v2AllUsersBean.editKeyNeverExpire}">
                                <p:ajax update="v2EditUserApiKey"/>
                            </p:toggleSwitch>
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.apiKeyExpireDate')}"/></div>
                        <div class="col-8">
                            <p:datePicker value="#{v2AllUsersBean.editApiKeyExpiresAt}"
                                          disabled="#{v2AllUsersBean.editKeyNeverExpire}"/>
                        </div>
                    </div>
                </h:panelGroup>
                <div class="text-right mt-3">
                    <p:commandButton value="#{v2LocaleBean.getMsg('apply')}" icon="pi pi-check"
                                     actionListener="#{v2AllUsersBean.updateApiKey()}"
                                     process="@form" update=":containerIndex :messageIndex"/>
                </div>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:fragment>
