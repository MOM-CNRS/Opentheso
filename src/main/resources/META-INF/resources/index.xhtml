<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/includes/layout.xhtml">
  <ui:param name="page" value="accueil"/>
  <ui:define name="viewActions">
    <f:viewParam name="idt" value="#{thesaurusContext.idThesoFromUri}"/>
    <f:viewAction action="#{consultationShellBean.applyThesaurusFromUrl}" onPostback="false"/>
    <f:viewAction action="#{thesaurusViewBean.showThesaurusHome}" onPostback="false"/>
    <f:viewAction action="#{thesaurusViewBean.restoreOpenedConcept}" onPostback="false"/>
    <f:viewAction action="#{propositionBean.restoreFromRequest}" onPostback="false"/>
  </ui:define>
  <ui:define name="title">OpenTheso — #{consultationShellBean.thesaurusAccessDenied ? localeBean.getMsg('thesaurus.accessDenied.title') : thesaurusViewBean.title}</ui:define>
  <ui:define name="detail">
    <ui:fragment rendered="#{not consultationShellBean.thesaurusAccessDenied}">
      <ui:include src="/includes/detail.xhtml"/>
    </ui:fragment>
  </ui:define>
  <ui:define name="main">
          <ui:fragment rendered="#{consultationShellBean.thesaurusAccessDenied}">
            <h:form id="thesaurusAccessDeniedForm" prependId="false">
              <ui:include src="/includes/access-denied.xhtml">
                <ui:param name="deniedKicker" value="#{localeBean.getMsg('thesaurus.accessDenied.kicker')}"/>
                <ui:param name="deniedTitle" value="#{localeBean.getMsg('thesaurus.accessDenied.title')}"/>
                <ui:param name="deniedSub" value="#{localeBean.getMsg('thesaurus.accessDenied.sub')}"/>
                <ui:param name="deniedBackLabel" value="#{localeBean.getMsg('thesaurus.accessDenied.back')}"/>
              </ui:include>
            </h:form>
          </ui:fragment>
          <ui:fragment rendered="#{not consultationShellBean.thesaurusAccessDenied and empty thesaurusViewBean.id}">
            <div class="empty">
              <div class="empty-ico">◆</div>
              <p class="empty-t">Aucun thésaurus sélectionné</p>
              <p class="empty-s"><a href="#{request.contextPath}/thesauri">Choisir un thésaurus</a></p>
            </div>
          </ui:fragment>
          <ui:fragment rendered="#{not consultationShellBean.thesaurusAccessDenied and not empty thesaurusViewBean.id}">
            <ui:include src="/includes/home.xhtml"/>
          </ui:fragment>
  </ui:define>
</ui:composition>
