<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

    <p:scrollTop/>

    <button type="button" onclick="hideResultSearchBar()">Fermer →</button>

    <p:scrollPanel style="border:none; padding-left:10px; padding-right:10px; padding-top:-5px;
                   max-height:995px; overflow:scroll; overflow-x:hidden;" mode="native">

        <h:panelGroup rendered="#{not v2ConceptSearchBean.singleResultSelected}" style="margin-bottom:5px">
            <div class="row" style="background-color:#ecf8f1; height:25px">
                <div class="col-12">
                    <h:outputText value="#{v2ConceptSearchBean.results.size()}"
                                  style="color:#8C8C8C; font-style:italic; font-weight:bold;"/>
                    <h:outputText value=" #{v2LocaleBean.getMsg('search.result_found')} #{v2LocaleBean.getMsg('search.for')} '#{v2ConceptSearchBean.searchValue}'"
                                  style="color:#8C8C8C; font-style:italic;"/>
                </div>
            </div>
        </h:panelGroup>

        <h:form>
            <ui:repeat var="result" value="#{v2ConceptSearchBean.results}">
                <div class="card py-3" style="margin-top:10px;">
                    <div class="row">
                        <div class="col-12" style="margin-left:7px; margin-right:7px">

                            <h:panelGroup rendered="#{result.deprecated}">
                                <i class="fa fa-solid fa-ban" style="font-size:12px; color:#C63632"/>
                                <p:commandLink rendered="#{not empty result.preferredLabel}"
                                               value=" #{result.preferredLabel}"
                                               title="#{result.conceptId}"
                                               style="color:#C63632; font-weight:bold; font-style:italic; font-size:12px;"
                                               actionListener="#{v2ConceptSearchBean.selectResult(result)}"
                                               update="resultSearchBar :formRightTab :formLeftTab:tabTree messageIndex"
                                               process="@form"/>
                                <p:commandLink rendered="#{empty result.preferredLabel}"
                                               value=" (#{result.conceptId})"
                                               style="color:#601e18; font-size:12px; font-weight:bold;"
                                               actionListener="#{v2ConceptSearchBean.selectResult(result)}"
                                               update="resultSearchBar :formRightTab :formLeftTab:tabTree messageIndex"
                                               process="@form"/>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{not result.deprecated}">
                                <p:commandLink rendered="#{not empty result.preferredLabel}"
                                               value="#{result.preferredLabel}"
                                               title="#{result.conceptId}"
                                               style="color:#601e18; font-size:12px; font-weight:bold;"
                                               actionListener="#{v2ConceptSearchBean.selectResult(result)}"
                                               update="resultSearchBar :formRightTab :formLeftTab:tabTree messageIndex"
                                               process="@form"/>
                                <p:commandLink rendered="#{empty result.preferredLabel}"
                                               value=" (#{result.conceptId})"
                                               style="color:#601e18; font-size:12px; font-weight:bold;"
                                               actionListener="#{v2ConceptSearchBean.selectResult(result)}"
                                               update="resultSearchBar :formRightTab :formLeftTab:tabTree messageIndex"
                                               process="@form"/>
                            </h:panelGroup>
                        </div>
                    </div>

                    <h:panelGroup rendered="#{not empty result.synonyms}">
                        <div class="row">
                            <div class="col-12" style="margin-left:7px; margin-right:7px">
                                <h:outputText value="SYN : "
                                              title="#{v2LocaleBean.getMsg('rightbody.concept.synonym')}"
                                              style="color:#8C8C8C; font-size:12px; font-weight:bold;"/>
                                <ui:repeat var="synonym" value="#{result.synonyms}">
                                    <h:outputText value="#{synonym}, " style="color:#8C8C8C; font-size:12px"/>
                                </ui:repeat>
                            </div>
                        </div>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not empty result.broaderTerms}">
                        <div class="row">
                            <div class="col-12" style="margin-left:7px; margin-right:7px">
                                <h:outputText value="BT : "
                                              title="#{v2LocaleBean.getMsg('rightbody.conceptdialog.generic_term')}"
                                              style="color:#8C8C8C; font-size:12px; font-weight:bold;"/>
                                <ui:repeat var="bt" value="#{result.broaderTerms}">
                                    <h:outputText value="#{bt}, " style="color:#8C8C8C; font-size:12px"/>
                                </ui:repeat>
                            </div>
                        </div>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not empty result.relatedTerms}">
                        <div class="row">
                            <div class="col-12" style="margin-left:7px; margin-right:7px">
                                <h:outputText value="RT : "
                                              title="Terme associé"
                                              style="color:#8C8C8C; font-size:12px; font-weight:bold;"/>
                                <ui:repeat var="rt" value="#{result.relatedTerms}">
                                    <h:outputText value="#{rt}, " style="color:#8C8C8C; font-size:12px"/>
                                </ui:repeat>
                            </div>
                        </div>
                    </h:panelGroup>
                </div>
            </ui:repeat>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:scrollPanel>

    <p:scrollTop target="parent" threshold="100" styleClass="custom-scrolltop" icon="pi pi-arrow-up"/>
</ui:fragment>
