<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://java.sun.com/jsf/html"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:p="http://primefaces.org/ui">

    <h:panelGroup styleClass="notification-bar" id="v2PropositionListBar">
        <button type="button" onclick="hideV2PropositionListBar()">Fermer →</button>

        <h:form id="v2ListPropositionsPanel">
            <p:scrollPanel style="border:none; padding-left:10px; max-height:90vh; overflow-y:auto;" mode="native">

                <div style="width:100%; text-align:center;">
                    <p:selectOneButton value="#{v2PropositionBean.showAll}" style="margin-bottom:5px;">
                        <p:ajax update="v2ListPropositionsPanel" event="change"
                                listener="#{v2PropositionBean.toggleShowAll()}"/>
                        <f:selectItem itemLabel="#{v2LocaleBean.getMsg('proposal.news')}" itemValue="#{false}"/>
                        <f:selectItem itemLabel="#{v2LocaleBean.getMsg('proposal.all')}" itemValue="#{true}"/>
                    </p:selectOneButton>
                </div>

                <p:panel rendered="#{empty v2PropositionBean.propositions}"
                         style="width:100%; margin-top:100px; text-align:center; color:#43B572;">
                    #{v2LocaleBean.getMsg('proposition.aucune_proposition')}
                </p:panel>

                <ui:repeat var="proposition" value="#{v2PropositionBean.propositions}"
                           rendered="#{not empty v2PropositionBean.propositions}">
                    <div class="card py-3 border-left-success"
                         style="vertical-align:central; margin-top:5px; margin-bottom:0.2rem;">
                        <div class="list-group" style="margin-top:-10px; margin-bottom:-5px; margin-left:10px;">
                            <div class="row">
                                <div class="col-12">
                                    <p:tag styleClass="p-mr-1" severity="success"
                                           value="#{proposition.thesaurusId}" style="margin-right:5px;"/>

                                    <h:panelGroup>
                                        <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(proposition.flagCode)}"
                                             width="20" height="15" style="margin-right:7px;" alt=""/>
                                    </h:panelGroup>

                                    <p:commandLink value="#{proposition.conceptLabel}"
                                                   rendered="#{proposition.envoyer}"
                                                   style="font-size:14px; font-weight:bold; color:#8f8f8f;"
                                                   process="@this"
                                                   actionListener="#{v2ThesaurusBrowseBean.openPropositionConsultation(proposition)}"
                                                   update=":containerIndex:formRightTab @([id$=v2NotificationProp]) v2ListPropositionsPanel"
                                                   oncomplete="hideV2PropositionListBar();"/>

                                    <p:commandLink value="#{proposition.conceptLabel}"
                                                   rendered="#{not proposition.envoyer}"
                                                   style="font-size:14px; color:#8f8f8f;"
                                                   process="@this"
                                                   actionListener="#{v2ThesaurusBrowseBean.openPropositionConsultation(proposition)}"
                                                   update=":containerIndex:formRightTab @([id$=v2NotificationProp]) v2ListPropositionsPanel"
                                                   oncomplete="hideV2PropositionListBar();"/>
                                </div>
                            </div>
                            <div class="row" style="margin-bottom:-4px;">
                                <div class="col-10">
                                    <h:outputText value="#{proposition.publishedAt} - #{proposition.authorName}"
                                                  rendered="#{proposition.envoyer}"
                                                  style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                                    <h:outputText value="#{proposition.publishedAt} - #{proposition.authorName}"
                                                  rendered="#{not proposition.envoyer}"
                                                  style="font-size:14px; color:#8f8f8f;"/>
                                </div>
                                <div class="col-2">
                                    <h:panelGroup rendered="#{proposition.envoyer}">
                                        <i class="fa-solid fa-envelope" style="color:orange;"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{proposition.lu}">
                                        <i class="fa-solid fa-envelope-open-text"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{proposition.approuver}">
                                        <i class="fa-solid fa-thumbs-up" style="color:green;"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{proposition.refuser}">
                                        <i class="fa-solid fa-thumbs-down" style="color:red;"/>
                                    </h:panelGroup>
                                </div>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </p:scrollPanel>
        </h:form>
    </h:panelGroup>
</ui:fragment>
