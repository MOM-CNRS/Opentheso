<ui:composition template="/templates/public.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets">


    <f:metadata>
        <f:viewParam name="token" value="#{resetPasswordBean.token}"/>
        <f:viewAction action="#{resetPasswordBean.init}"/>
    </f:metadata>

    <ui:define name="title">Opentheso - Réinitialisation du mot de passe</ui:define>
    <ui:define name="content">
        <!-- CSS spécifique au panel reset-password -->
        <style>
            body .ui-panel .ui-panel-titlebar {
                background: #f47b2a !important;
                color: #fff;
                padding: 12px 20px;
                font-weight: 600;
                border-radius: 8px 8px 0 0;
                border: none;
            }
            body .ui-panel .ui-panel-content {
                padding: 20px; /* espace intérieur du panel */
            }
        </style>

        <h:form>
            <p:messages autoUpdate="true" />

            <!-- Formulaire uniquement si le token est valide -->
            <h:panelGroup rendered="#{resetPasswordBean.tokenValid}">
                <p:panel header="Réinitialisation du mot de passe"
                         style="max-width:450px; margin:80px auto; padding:25px 20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);">

                    <div class="row" style="margin-top: 10px; ">
                        <div class="col-6" style="width: 100%;">
                            <p:outputLabel value="Nouveau mot de passe" style="width: 100%"/>
                        </div>
                        <div class="col-6" style="width: 100%; margin-top: 10px;">
                            <p:password value="#{resetPasswordBean.newPassword}" feedback="true" style="width: 100%; height: 30px;"/>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 10px;">
                        <div class="col-6" style="width: 100%">
                            <p:outputLabel value="Confirmation" style="width: 100%"/>
                        </div>
                        <div class="col-6" style="width: 100% ; margin-top: 10px;">
                            <p:password value="#{resetPasswordBean.confirmPassword}" style="width: 100%; height: 30px;"/>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 20px;">
                        <div class="col-1 offset-5">
                            <p:commandButton value="Valider"
                                             style="width: 100%"
                                             action="#{resetPasswordBean.resetPassword}"
                                             styleClass="ui-button-success"
                                             update="@form"/>
                        </div>
                    </div>

                </p:panel>
            </h:panelGroup>

            <!-- Message et lien vers l'accueil si token invalide -->
            <h:panelGroup rendered="#{!resetPasswordBean.tokenValid}" style="text-align:center;margin-top:50px;">
                <p:outputLabel value="Lien invalide ou expiré." style="color:red; font-weight:bold;" />
                <br/><br/>
                <h:commandLink value="Retour à l'accueil" action="#{resetPasswordBean.redirectToHome}"/>
            </h:panelGroup>

            <!-- Redirection automatique avec JavaScript après 3s si token invalide -->
            <h:outputScript rendered="#{!resetPasswordBean.tokenValid}">
                setTimeout(function() {
                window.location.href='#{request.contextPath}/index.xhtml';
                }, 6000);
            </h:outputScript>

            <!-- Redirection automatique après reset réussi -->
            <h:outputScript rendered="#{resetPasswordBean.redirectAfterReset}">
                setTimeout(function() {
                window.location.href='#{request.contextPath}/index.xhtml';
                }, 3000);
            </h:outputScript>

        </h:form>

    </ui:define>
</ui:composition>
