<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2ResetMemberPassword"
              header="#{v2LocaleBean.getMsg('password.reset')}"
              widgetVar="v2ResetMemberPassword"
              width="550" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top: 30px">

        <h:form id="v2ResetMemberPasswordForm">
            <div class="row">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.pseudo')} : "/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2MyProjectsBean.resetMemberPasswordUsername}" style="font-weight: bold"/>
                </div>
            </div>
            <div class="row" style="margin-top: 30px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.new_password')} : "/>
                </div>
                <div class="col-7">
                    <p:password id="v2ResetPasswordUpdate1" value="#{v2MyProjectsBean.memberResetPassword1}"
                                style="width:100%" autocomplete="off" redisplay="true"
                                feedback="true"
                                promptLabel="#{v2LocaleBean.getMsg('password.prompt')}"
                                weakLabel="#{v2LocaleBean.getMsg('password.weak')}"
                                goodLabel="#{v2LocaleBean.getMsg('password.good')}"
                                strongLabel="#{v2LocaleBean.getMsg('password.strong')}">
                        <f:validator validatorId="passwordValidator"/>
                    </p:password>
                    <p:message for="v2ResetPasswordUpdate1"/>
                </div>
            </div>
            <div class="row" style="margin-top: 5px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.confirmation')} : "/>
                </div>
                <div class="col-7">
                    <p:password value="#{v2MyProjectsBean.memberResetPassword2}" style="width: 100%" redisplay="true"/>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 ajax="true" oncomplete="PF('v2ResetMemberPassword').hide();" update="idV2ResetMemberPassword"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('apply')}"
                                 icon="fa-regular fa-floppy-disk"
                                 styleClass="ui-button-success"
                                 update="messageIndex v2ResetMemberPasswordForm"
                                 action="#{v2MyProjectsBean.submitResetMemberPassword()}"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
