<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:panelGroup rendered="#{not v2ThesaurusBrowseBean.conceptPanel}">
        <p:panel style="margin:20px;">
            <h:outputText value="Sélectionnez un concept pour ouvrir l'atelier d'alignement."
                          style="font-size:14px; color:#777;"/>
        </p:panel>
    </h:panelGroup>

    <h:panelGroup rendered="#{v2ThesaurusBrowseBean.conceptPanel}">
        <p:toolbar style="margin-left:20px; margin-right:20px;">
            <p:toolbarGroup align="left">
                <p:commandButton value="#{v2LocaleBean.getMsg('alignment.automaticSearch')}"
                                 icon="fa-solid fa-magnifying-glass"
                                 styleClass="ui-button-success"
                                 style="margin-left:10px;"
                                 process="@this"
                                 disabled="#{v2ConceptAlignmentAdminBean.manageSourcesMode}"
                                 actionListener="#{v2ConceptAlignmentAdminBean.initAutomaticSearch()}"
                                 update=":containerIndex:formRightTab :messageIndex :containerIndex:v2SelectAlignmentSourceDlg"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('rightbody.concept.alignement.comparison')}"
                                 icon="pi pi-megaphone"
                                 styleClass="ui-button-success"
                                 style="margin-left:10px;"
                                 process="@this"
                                 disabled="#{v2ConceptAlignmentAdminBean.manageSourcesMode}"
                                 actionListener="#{v2ConceptAlignmentAdminBean.initComparisonSearch()}"
                                 update=":containerIndex:formRightTab :messageIndex :containerIndex:v2SelectAlignmentSourceDlg"/>
            </p:toolbarGroup>

            <p:toolbarGroup align="center">
                <p:commandButton value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.manage_alignment_sources')}"
                                 icon="fa-solid fa-gear"
                                 styleClass="ui-button-success"
                                 process="@this"
                                 actionListener="#{v2ConceptAlignmentAdminBean.openManageSources()}"
                                 update=":containerIndex:formRightTab"/>
            </p:toolbarGroup>
        </p:toolbar>

        <h:panelGroup rendered="#{v2ConceptAlignmentAdminBean.summaryMode}">
            <ui:include src="alignment/alignment-summary.xhtml"/>
        </h:panelGroup>

        <h:panelGroup rendered="#{v2ConceptAlignmentAdminBean.propositionsMode}">
            <ui:include src="alignment/alignment-propositions.xhtml"/>
        </h:panelGroup>

        <h:panelGroup rendered="#{v2ConceptAlignmentAdminBean.comparisonMode}">
            <ui:include src="alignment/alignment-comparison.xhtml"/>
        </h:panelGroup>

        <h:panelGroup rendered="#{v2ConceptAlignmentAdminBean.manageSourcesMode}">
            <ui:include src="alignment/alignment-sources.xhtml"/>
        </h:panelGroup>
    </h:panelGroup>
</ui:fragment>
