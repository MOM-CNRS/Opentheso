<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2AddBroaderRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_generic_relationship')}"
              widgetVar="v2AddBroaderRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2AddBroaderRelationForm">
            <p:defaultCommand target="v2AddBroaderRelationSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.broader')} : "/>
                </div>
                <div class="col-8">
                    <p:autoComplete value="#{v2ConceptRelationEditorBean.searchSelected}"
                                    var="values" style="width:100%;"
                                    forceSelection="true"
                                    completeMethod="#{v2ConceptRelationEditorBean.autocompleteRelationTarget}"
                                    minQueryLength="1" itemLabel="#{values.prefLabel}" itemValue="#{values}"
                                    converter="v2ConceptSearchConverter" scrollHeight="400"
                                    inputStyle="width:100%;">
                        <p:column rendered="#{values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.altLabel}" style="font-style:italic;"/>
                            <h:outputText title="#{values.idConcept}" value=" -&gt; #{values.prefLabel}" style="color:blue;"/>
                        </p:column>
                        <p:column rendered="#{not values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.prefLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddBroaderRelationDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddBroaderRelationSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptRelationEditorBean.submitAddBroader()}"
                                 update="v2AddBroaderRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteBroaderRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.delete_generic_relationship')}"
              widgetVar="v2DeleteBroaderRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2DeleteBroaderRelationForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:dataTable var="broader" value="#{v2ThesaurusBrowseBean.selectedConcept.broaderTerms}"
                         size="small" styleClass="products-table" lazy="false">
                <f:facet name="header">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.broaderLists')}" style="font-weight:bold;"/>
                </f:facet>
                <p:column headerText="Label">
                    <h:outputText value="#{broader.displayLabel} (#{broader.conceptId})" style="color:#43B572;"/>
                </p:column>
                <p:column width="80" headerText="#{v2LocaleBean.getMsg('btnDelete')}">
                    <p:commandLink style="color:#FF7979;" process="@form" ajax="true"
                                   action="#{v2ConceptRelationEditorBean.submitDeleteBroader(broader.conceptId)}"
                                   update="v2DeleteBroaderRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex">
                        <i class="pi pi-trash"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddNarrowerRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_specific_relationship')}"
              widgetVar="v2AddNarrowerRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2AddNarrowerRelationForm">
            <p:defaultCommand target="v2AddNarrowerRelationSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.narrower')} : "/>
                </div>
                <div class="col-8">
                    <p:autoComplete value="#{v2ConceptRelationEditorBean.searchSelected}"
                                    var="values" style="width:100%;"
                                    forceSelection="true"
                                    completeMethod="#{v2ConceptRelationEditorBean.autocompleteRelationTarget}"
                                    minQueryLength="1" itemLabel="#{values.prefLabel}" itemValue="#{values}"
                                    converter="v2ConceptSearchConverter" scrollHeight="400"
                                    inputStyle="width:100%;">
                        <p:column rendered="#{values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.altLabel}" style="font-style:italic;"/>
                            <h:outputText title="#{values.idConcept}" value=" -&gt; #{values.prefLabel}" style="color:blue;"/>
                        </p:column>
                        <p:column rendered="#{not values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.prefLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddNarrowerRelationDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddNarrowerRelationSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptRelationEditorBean.submitAddNarrower()}"
                                 update="v2AddNarrowerRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteNarrowerRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.delete_specific_relationship')}"
              widgetVar="v2DeleteNarrowerRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2DeleteNarrowerRelationForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.term')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:dataTable var="narrower" value="#{v2ThesaurusBrowseBean.selectedConcept.narrowerTerms}"
                         size="small" styleClass="products-table" lazy="false">
                <f:facet name="header">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.NarrowerLists')}" style="font-weight:bold;"/>
                </f:facet>
                <p:column headerText="Label">
                    <h:outputText value="#{narrower.displayLabel} (#{narrower.conceptId})" style="color:#43B572;"/>
                </p:column>
                <p:column width="80" headerText="#{v2LocaleBean.getMsg('btnDelete')}">
                    <p:commandLink style="color:#FF7979;" process="@form" ajax="true"
                                   action="#{v2ConceptRelationEditorBean.submitDeleteNarrower(narrower.conceptId)}"
                                   update="v2DeleteNarrowerRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex">
                        <i class="pi pi-trash"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
        </h:form>
    </p:dialog>

    <p:dialog id="v2ChangeNarrowerRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.modify_specific_relationships')}"
              widgetVar="v2ChangeNarrowerRelationDlg" width="560" modal="true" resizable="true">
        <h:form id="v2ChangeNarrowerRelationForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.term')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2 align-items-center">
                <div class="col-9">
                    <h:outputText value="Appliquer à toute la branche"/>
                </div>
                <div class="col-3 text-right">
                    <p:toggleSwitch value="#{v2ConceptRelationEditorBean.applyToBranch}">
                        <p:ajax event="change" update="v2ChangeNarrowerRelationForm"/>
                    </p:toggleSwitch>
                </div>
            </div>
            <h:panelGroup rendered="#{v2ConceptRelationEditorBean.applyToBranch}">
                <p:selectOneMenu value="#{v2ConceptRelationEditorBean.selectedRelationRole}" style="width:100%;">
                    <f:selectItems value="#{v2ConceptRelationEditorBean.ntRelationTypes}" var="typesNT"
                                   itemLabel="#{typesNT.descriptionFr} (#{typesNT.relationType})"
                                   itemValue="#{typesNT.relationType}"/>
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup rendered="#{not v2ConceptRelationEditorBean.applyToBranch}">
                <p:dataTable var="narrowerEdit" value="#{v2ConceptRelationEditorBean.narrowerEdits}"
                             size="small" scrollable="true" scrollHeight="250" lazy="false">
                    <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.has_relationship')}">
                        <p:selectOneMenu value="#{narrowerEdit.role}" style="width:100%;">
                            <f:selectItems value="#{v2ConceptRelationEditorBean.ntRelationTypes}" var="typesNT"
                                           itemLabel="#{typesNT.descriptionFr} (#{typesNT.relationType})"
                                           itemValue="#{typesNT.relationType}"/>
                        </p:selectOneMenu>
                    </p:column>
                    <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.with_concept')}">
                        <p:inputText disabled="true" value="#{narrowerEdit.label}" style="width:100%;"/>
                    </p:column>
                    <p:column width="40">
                        <p:commandLink style="color:#F7A269;"
                                       actionListener="#{v2ConceptRelationEditorBean.submitUpdateNarrowerType(narrowerEdit)}"
                                       process="@form" ajax="true"
                                       update="v2ChangeNarrowerRelationForm :containerIndex:formRightTab :messageIndex">
                            <i class="pi pi-check-circle"/>
                        </p:commandLink>
                    </p:column>
                </p:dataTable>
            </h:panelGroup>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2ChangeNarrowerRelationDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton rendered="#{v2ConceptRelationEditorBean.applyToBranch}"
                                 value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptRelationEditorBean.submitApplyNarrowerTypeToBranch()}"
                                 process="@form"
                                 update="v2ChangeNarrowerRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddRelatedRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_association_relationship')}"
              widgetVar="v2AddRelatedRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2AddRelatedRelationForm">
            <p:defaultCommand target="v2AddRelatedRelationSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.related')} : "/>
                </div>
                <div class="col-8">
                    <p:autoComplete value="#{v2ConceptRelationEditorBean.searchSelected}"
                                    var="values" style="width:100%;"
                                    forceSelection="true"
                                    completeMethod="#{v2ConceptRelationEditorBean.autocompleteRelationTarget}"
                                    minQueryLength="1" itemLabel="#{values.prefLabel}" itemValue="#{values}"
                                    converter="v2ConceptSearchConverter" scrollHeight="400"
                                    inputStyle="width:100%;">
                        <p:column rendered="#{values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.altLabel}" style="font-style:italic;"/>
                            <h:outputText title="#{values.idConcept}" value=" -&gt; #{values.prefLabel}" style="color:blue;"/>
                        </p:column>
                        <p:column rendered="#{not values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.prefLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-12">
                    <p:selectBooleanCheckbox value="#{v2ConceptRelationEditorBean.tagPrefLabel}"
                                             itemLabel="#{v2LocaleBean.getMsg('rightbody.conceptdialog.tagPrefLabel')}"
                                             title="#{v2LocaleBean.getMsg('rightbody.conceptdialog.tagPrefLabelToolTip')}"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddRelatedRelationDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddRelatedRelationSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptRelationEditorBean.submitAddRelated()}"
                                 update="v2AddRelatedRelationForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteRelatedRelationDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.delete_association_relationship')}"
              widgetVar="v2DeleteRelatedRelationDlg" width="520" modal="true" resizable="false">
        <h:form id="v2DeleteRelatedRelationForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.term')} : "/>
                    <h:outputText value="#{v2ConceptRelationEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:dataTable var="related" value="#{v2ThesaurusBrowseBean.selectedConcept.relatedTerms}"
                         size="small" styleClass="products-table" lazy="false">
                <p:column headerText="#{v2LocaleBean.getMsg('statistique.label')}">
                    <h:outputText value="#{related.displayLabel} (#{related.conceptId})"/>
                </p:column>
                <p:column width="80" headerText="#{v2LocaleBean.getMsg('btnDelete')}">
                    <p:commandLink style="color:#FF7979;" process="@form" ajax="true"
                                   action="#{v2ConceptRelationEditorBean.submitDeleteRelated(related.conceptId)}"
                                   update="v2DeleteRelatedRelationForm :containerIndex:formRightTab :messageIndex">
                        <i class="pi pi-trash"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
        </h:form>
    </p:dialog>
</ui:fragment>
