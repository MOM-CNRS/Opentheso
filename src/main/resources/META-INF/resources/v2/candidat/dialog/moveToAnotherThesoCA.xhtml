<ui:fragment xmlns="http://www.w3.org/1999/xhtml"  
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idMoveToAnotherThesoCA" header="#{v2LocaleBean.getMsg('concept.moveToAnotherThesoTooltip')}" widgetVar="moveToAnotherThesoCA" 
              modal="true" resizable="true" position="top" width="650"  style="margin-top: 50px;" > 

        <h:form id="moveToAnotherThesoCAForm">

            <div class="row">
                <div class="col-4" style="margin-top: 3px; text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('concept.candidatesToMove')} : "/>
                </div>
                <div class="col-8" style="margin-top: 3px; font-weight: bold">
                    <ui:repeat var="listConcept" value="#{v2CandidatTransferBean.conceptIdsToMove}" varStatus="status">
                        <h:outputText value="#{listConcept}"/>
                        <h:outputText rendered="#{!status.last}" value="; "/>
                    </ui:repeat>
                </div>
            </div>

            <div class="row">
                <div class="col-4" style="margin-top: 3px; text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('concept.fromTheso')} : "/>
                </div>
                <div class="col-4" style="margin-top: 3px; font-weight: bold">
                    <h:outputText value="#{v2CandidatTransferBean.sourceThesaurusTitle} (#{v2CandidatTransferBean.sourceThesaurusId})"/>
                </div>                    
            </div>     

            <div class="row">
                <div class="col-4" style="margin-top: 3px; text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('concept.toTheso')}  : "/>
                </div>
                <div class="col-8" style="margin-top: 3px">
                    <p:selectOneMenu id="thesoToSelect" value="#{v2CandidatTransferBean.targetThesaurusId}" 
                                     style="color: #000; height: 28px; max-width: 400px">
                        <p:ajax event="valueChange" listener="#{v2CandidatTransferBean.onTargetThesaurusChange()}" />
                        <f:selectItems value="#{v2CandidatTransferBean.availableThesauri}" var="th" itemLabel="#{th.title} (#{th.id})" itemValue="#{th.id}"/>
                    </p:selectOneMenu>
                </div>                
            </div> 
            <div style="width: 100%; text-align: right; margin-top: 5px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary button" icon="fas fa-undo-alt" 
                                 style="margin-right: 10px" process="@this"
                                 oncomplete="PF('moveToAnotherThesoCA').hide();" update="idMoveToAnotherThesoCA"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success" icon="pi pi-check"
                                 update="moveToAnotherThesoCAForm tabViewCandidat messageIndex" 
                                 oncomplete="PF('moveToAnotherThesoCA').hide();" process="@form"
                                 actionListener="#{v2CandidatTransferBean.moveCandidates()}" />
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
        </h:form>
    </p:dialog>   
</ui:fragment>
