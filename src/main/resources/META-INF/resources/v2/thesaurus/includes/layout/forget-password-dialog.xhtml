<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="idForgetPass"
              header="#{v2LocaleBean.getMsg('menu.forgotten_pass')}"
              widgetVar="forgetPass"
              width="450"
              showEffect="fade"
              modal="true"
              resizable="false"
              position="top"
              style="margin-top: 50px">

        <h:form id="forgetPassForm">
            <div class="row" style="margin-top: 20px; margin-bottom: 20px;">
                <div class="col-2" style="text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.email')}"/>
                </div>
                <div class="col-10">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('profile.yourEmail')}"
                                 value="#{v2ForgotPasswordBean.sendTo}"
                                 style="width: 100%"/>
                </div>
            </div>

            <h:panelGroup rendered="#{not empty v2ForgotPasswordBean.message}">
                <p:messages id="forgetPassMessages"
                            showDetail="true"
                            showSummary="false"
                            autoUpdate="true"
                            styleClass="text-success"/>
            </h:panelGroup>

            <div style="width: 100%; text-align: right; margin-top: 5px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 styleClass="ui-button-secondary button"
                                 icon="fas fa-undo-alt"
                                 style="margin-right: 10px"
                                 onclick="PF('forgetPass').hide(); return false;" type="button"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.send')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check"
                                 actionListener="#{v2ForgotPasswordBean.sendMail}"
                                 update="forgetPassMessages messageIndex"
                                 oncomplete="PF('forgetPass').hide();"/>
            </div>

            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
