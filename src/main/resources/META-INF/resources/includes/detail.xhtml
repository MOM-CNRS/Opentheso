<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
  <h:form id="previewOpenForm" styleClass="preview-open-form">
    <h:inputHidden id="openId" value="#{thesaurusViewBean.openId}"/>
    <h:inputHidden id="openType" value="#{thesaurusViewBean.openType}"/>
    <h:commandButton id="openBtn" value="Ouvrir" styleClass="preview-open-btn"
                     action="#{thesaurusViewBean.openSelectedNode}">
      <f:ajax execute="@form" render=":previewDetailForm:previewDetail :previewPropBadge"/>
    </h:commandButton>
    <h:commandButton id="createConceptChildGo" value="+" styleClass="preview-open-btn"
                     pt:data-create="concept-child"
                     action="#{conceptFicheMenuBean.prepareAddChild}">
      <f:ajax execute="@this" render=":previewDetailForm:previewDetail" onevent="onCvMenuAjax"/>
    </h:commandButton>
    <h:commandButton id="createConceptTopGo" value="+" styleClass="preview-open-btn"
                     pt:data-create="concept-top"
                     action="#{conceptFicheMenuBean.prepareAddTopConcept}">
      <f:ajax execute="@this" render=":previewDetailForm:previewDetail" onevent="onCvMenuAjax"/>
    </h:commandButton>
    <h:commandButton id="createFacetGo" value="+" styleClass="preview-open-btn"
                     pt:data-create="facet"
                     action="#{conceptFicheMenuBean.prepareCreateFacet}">
      <f:ajax execute="@this" render=":previewDetailForm:previewDetail" onevent="onCvMenuAjax"/>
    </h:commandButton>
  </h:form>
  <h:form id="previewTreeDropForm" styleClass="preview-open-form">
    <h:inputHidden id="htmlDragId" value="#{conceptTreeDragDropBean.htmlDragId}"/>
    <h:inputHidden id="htmlDropId" value="#{conceptTreeDragDropBean.htmlDropId}"/>
    <h:inputHidden id="htmlDragType" value="#{conceptTreeDragDropBean.htmlDragType}"/>
    <h:inputHidden id="htmlDropType" value="#{conceptTreeDragDropBean.htmlDropType}"/>
    <h:inputHidden id="htmlParentId" value="#{conceptTreeDragDropBean.htmlParentId}"/>
    <h:inputHidden id="htmlDropRoot" value="#{conceptTreeDragDropBean.htmlDropRoot}"/>
    <h:commandButton id="dropBtn" value="Déposer" styleClass="preview-open-btn"
                     action="#{conceptFicheMenuBean.dropFromTree}">
      <f:ajax execute="@form" render=":previewDetailForm:previewDetail :previewTree" onevent="onCvMenuAjax"/>
    </h:commandButton>
  </h:form>

  <div class="view-panel" id="viewLive">
    <div class="cv-progress" id="liveProgress" aria-hidden="true"></div>
    <a class="cv-back-graph" id="liveBackList" hidden="hidden"
       href="candidat/candidats.xhtml" data-act="back-cand-list"
       title="Retour à la liste des candidats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Retour à la liste
    </a>
    <a class="cv-back-graph" id="liveBackPropList" hidden="hidden"
       href="#{propositionBean.boardHref}" data-act="back-prop-list"
       title="#{localeBean.getMsg('proposition.review.backBoard')}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      #{localeBean.getMsg('proposition.review.backBoard')}
    </a>
    <button type="button" class="cv-back-graph" id="liveBackGraph" hidden="hidden"
            data-act="back-graph" title="Retour au graphe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Retour au graphe
    </button>
    <h:form id="previewDetailForm" enctype="multipart/form-data" acceptcharset="UTF-8">
      <h:panelGroup id="previewDetail" layout="block">
        <div id="previewDetailState"
             data-open="#{thesaurusViewBean.detailVisible ? '1' : '0'}"
             data-requested="#{thesaurusViewBean.detailRequested ? '1' : '0'}"
             data-id="#{thesaurusViewBean.selectedId}"
             data-kind="#{thesaurusViewBean.selectedKind}"
             data-pref="#{thesaurusViewBean.conceptSelected ? thesaurusViewBean.selectedConcept.summary.preferredLabel : ''}"
             data-flash-dnd="#{conceptTreeDragDropBean.flashMessage}"
             data-flash-dnd-token="#{conceptTreeDragDropBean.flashToken}"
             data-flash-copy="#{conceptCopyBetweenThesaurusBean.flashMessage}"
             data-flash-copy-token="#{conceptCopyBetweenThesaurusBean.flashToken}"
             data-flash-move="#{conceptTransferEditorBean.flashMessage}"
             data-flash-move-token="#{conceptTransferEditorBean.flashToken}"
             data-flash-ark="#{conceptIdentifierEditorBean.flashMessage}"
             data-flash-ark-token="#{conceptIdentifierEditorBean.flashToken}"
             data-flash-csv="#{conceptListCsvImportBean.flashMessage}"
             data-flash-csv-token="#{conceptListCsvImportBean.flashToken}"
             data-flash-loop="#{conceptMaintenanceEditorBean.flashMessage}"
             data-flash-loop-token="#{conceptMaintenanceEditorBean.flashToken}"
             data-flash-del="#{conceptLifecycleEditorBean.deleteFlashMessage}"
             data-flash-del-token="#{conceptLifecycleEditorBean.deleteFlashToken}"
             data-flash-facet="#{not empty facetCardDeleteBean.flashMessage ? facetCardDeleteBean.flashMessage : facetDetailEditorBean.createFlashMessage}"
             data-flash-facet-token="#{not empty facetCardDeleteBean.flashToken ? facetCardDeleteBean.flashToken : facetDetailEditorBean.createFlashToken}"
             data-flash-type="#{conceptTypeManagerBean.flashMessage}"
             data-flash-type-token="#{conceptTypeManagerBean.flashToken}"
             data-flash-ctype="#{conceptAttributeEditorBean.typeFlashMessage}"
             data-flash-ctype-token="#{conceptAttributeEditorBean.typeFlashToken}"
             data-flash-nt="#{conceptLifecycleEditorBean.createFlashMessage}"
             data-flash-nt-token="#{conceptLifecycleEditorBean.createFlashToken}"
             data-cut-id="#{conceptTreeDragDropBean.cutOn ? conceptTreeDragDropBean.cutConceptId : ''}">
          <ui:fragment rendered="#{thesaurusViewBean.conceptSelected or thesaurusViewBean.candidateSelected}">
            <ui:include src="/includes/concept-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{thesaurusViewBean.facetSelected}">
            <ui:include src="/includes/facet-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{thesaurusViewBean.detailRequested and not thesaurusViewBean.detailVisible}">
            <div class="empty">
              <div class="empty-ico">◆</div>
              <p class="empty-t">Élément introuvable</p>
              <p class="empty-s">Ce concept, candidat ou cette facette n'est pas disponible dans la langue courante.</p>
            </div>
          </ui:fragment>
          <ui:fragment rendered="#{not empty conceptFicheMenuBean.dialogToReopen}">
            <span hidden="hidden" data-cv-dlg="#{conceptFicheMenuBean.dialogToReopen}"></span>
          </ui:fragment>
        </div>
        <ui:include src="/includes/concept-actions-dialogs.xhtml"/>
      </h:panelGroup>
    </h:form>
  </div>
</ui:composition>
