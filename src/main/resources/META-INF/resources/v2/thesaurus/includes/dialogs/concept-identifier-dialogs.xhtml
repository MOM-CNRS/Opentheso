<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="v2GenerateArkDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.generate_ark')}"
              widgetVar="v2GenerateArkDlg" width="480" modal="true" resizable="false">
        <h:form id="v2GenerateArkForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('search.for')} : "/>
                    <h:outputText value="#{v2ConceptIdentifierEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2GenerateArkDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('service.generate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitGenerateArk()}"
                                 update="v2GenerateArkForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteArkDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.delete_ark')}"
              widgetVar="v2DeleteArkDlg" width="480" modal="true" resizable="false">
        <h:form id="v2DeleteArkForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('search.for')} : "/>
                    <h:outputText value="#{v2ConceptIdentifierEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2DeleteArkDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-danger"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitDeleteArk()}"
                                 update="v2DeleteArkForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2GenerateArkBranchDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.generate_ark_for_branch')}"
              widgetVar="v2GenerateArkBranchDlg" width="520" modal="true" resizable="false">
        <h:form id="v2GenerateArkBranchForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('search.for')} : "/>
                    <h:outputText value="#{v2ConceptIdentifierEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:scrollPanel mode="native" style="max-height:120px; margin-bottom:10px;">
                <ui:repeat value="#{v2ConceptIdentifierEditorBean.branchConceptIds}" var="branchConcept" varStatus="status">
                    <h:outputText value="#{branchConcept}"/>
                    <h:outputText rendered="#{not status.last}" value="; "/>
                </ui:repeat>
            </p:scrollPanel>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2GenerateArkBranchDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('service.generate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitGenerateArkForBranch()}"
                                 update="v2GenerateArkBranchForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2GenerateHandleDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('service.generate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitGenerateHandle()}"
                                 update="v2GenerateHandleForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteHandleDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.delete_handle')}"
              widgetVar="v2DeleteHandleDlg" width="480" modal="true" resizable="false">

            </div>
            <div class="text-right mt-3">

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-danger"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitDeleteHandle()}"
                                 update="v2DeleteHandleForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2GenerateHandleBranchDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.generate_handle_for_branch')}"
              widgetVar="v2GenerateHandleBranchDlg" width="520" modal="true" resizable="false">
        <h:form id="v2GenerateHandleBranchForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('search.for')} : "/>
                    <h:outputText value="#{v2ConceptIdentifierEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:scrollPanel mode="native" style="max-height:120px; margin-bottom:10px;">
                <ui:repeat value="#{v2ConceptIdentifierEditorBean.branchConceptIds}" var="branchConcept" varStatus="status">
                    <h:outputText value="#{branchConcept}"/>
                    <h:outputText rendered="#{not status.last}" value="; "/>
                </ui:repeat>
            </p:scrollPanel>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2GenerateHandleBranchDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('service.generate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptIdentifierEditorBean.submitGenerateHandleForBranch()}"
                                 update="v2GenerateHandleBranchForm :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
