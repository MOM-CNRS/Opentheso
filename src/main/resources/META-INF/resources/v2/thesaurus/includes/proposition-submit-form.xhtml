<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <h:panelGroup id="v2PropositionSubmitPanel" styleClass="textOpentheso" style="margin:0;">

        <div class="row">
            <div class="col-11" style="margin-top:-10px;">
                <p:staticMessage severity="warn" summary="Info"
                                 detail="#{v2LocaleBean.getMsg('rightbody.proposal.info1')}"
                                 style="width:100%;"/>
            </div>
        </div>

        <ui:include src="proposition/term-proposition.xhtml"/>
        <ui:include src="proposition/traduction-proposition.xhtml"/>
        <ui:include src="proposition/note-proposition.xhtml"/>

        <!-- Auteur / commentaire (comme legacy) -->
        <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
            <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
                <div class="row" style="margin-left:15px; margin-right:15px;">
                    <div class="col-3">
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.name')} * : "
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                    <div class="col-9">
                        <h:inputText value="#{v2PropositionSubmitBean.authorName}"
                                     rendered="#{v2PropositionSubmitBean.authorNameEditable}"/>
                        <h:outputText value="#{v2PropositionSubmitBean.authorName}"
                                      rendered="#{not v2PropositionSubmitBean.authorNameEditable}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                </div>

                <div class="row" style="margin-left:15px; margin-right:15px; margin-top:10px;">
                    <div class="col-3">
                        <h:outputText value="#{v2LocaleBean.getMsg('profile.email')} * : "
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                    <div class="col-9">
                        <h:inputText value="#{v2PropositionSubmitBean.authorEmail}"
                                     rendered="#{v2PropositionSubmitBean.authorEmailEditable}"/>
                        <h:outputText value="#{v2PropositionSubmitBean.authorEmail}"
                                      rendered="#{not v2PropositionSubmitBean.authorEmailEditable}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                </div>

                <div class="row" style="margin-left:15px; margin-right:15px; margin-top:10px;">
                    <div class="col-12">
                        <h:outputText value="#{v2LocaleBean.getMsg('proposition.commentaire')} : "
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                    </div>
                </div>
                <div class="row" style="margin-left:15px; margin-right:15px;">
                    <div class="col-12">
                        <p:textEditor secure="false" value="#{v2PropositionSubmitBean.comment}" height="300"/>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-11">
                <p:staticMessage severity="warn" summary="Info"
                                 detail="#{v2LocaleBean.getMsg('rightbody.proposal.info2')}"
                                 style="width:100%; font-size:14px;"/>
            </div>
        </div>

        <p:spacer height="10"/>

        <div class="row">
            <div class="col-12" style="text-align:right; margin-left:-10px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                 style="margin-right:10px; background-color:#8f8f8f; border-color:#8f8f8f;"
                                 icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary"
                                 process="@this"
                                 actionListener="#{v2ThesaurusBrowseBean.closeProposition()}"
                                 update=":containerIndex:formRightTab"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('rightbody.sendProposal')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check-circle"
                                 process="@form"
                                 actionListener="#{v2ThesaurusBrowseBean.submitNouvelleProposition()}"
                                 update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </div>
    </h:panelGroup>
</ui:fragment>
