<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<p:dialog id="idV2RenameProject" header="#{langueBean.getMsg('profile.change_label_projects')}"
          widgetVar="v2RenameProject" modal="true" resizable="false" width="450">
    <h:form id="v2RenameProjectForm">
        <div class="row" style="margin-top: 10px">
            <div class="col-4">
                <h:outputText value="#{langueBean.getMsg('profile.name')} : "/>
            </div>
            <div class="col-8">
                <p:inputText value="#{v2MyProjectsBean.renameProjectLabel}" style="width: 100%"/>
            </div>
        </div>
        <div class="row" style="margin-top: 15px">
            <div class="col-12" style="text-align: right">
                <p:commandButton value="#{langueBean.getMsg('apply')}"
                                 action="#{v2MyProjectsBean.renameProject()}"
                                 process="@form" update="containerIndex idV2RenameProject"/>
            </div>
        </div>
    </h:form>
</p:dialog>

</html>
