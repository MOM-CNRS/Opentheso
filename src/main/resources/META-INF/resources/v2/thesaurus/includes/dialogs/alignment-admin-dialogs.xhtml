<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2SelectAlignmentSourceDlg"
              header="#{v2LocaleBean.getMsg('alignment.source')}"
              widgetVar="v2SelectAlignmentSource"
              modal="true"
              width="520"
              resizable="false"
              appendTo="@(body)">
        <h:form id="v2SelectAlignmentSourceForm">
            <p:selectOneMenu value="#{v2ConceptAlignmentAdminBean.selectedSourceIdForSearch}"
                             style="width:100%; margin-bottom:16px;">
                <f:selectItem itemLabel="-- #{v2LocaleBean.getMsg('alignment.source')} --" itemValue="#{null}"/>
                <f:selectItems value="#{v2ConceptAlignmentAdminBean.selectableSources}"
                               var="source"
                               itemLabel="#{source.label}"
                               itemValue="#{source.sourceId}"/>
            </p:selectOneMenu>

            <div style="text-align:right;">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 process="@form"
                                 actionListener="#{v2ConceptAlignmentAdminBean.confirmSelectedSourceAndSearch()}"
                                 update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddAlignmentSourceDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_source')} Opentheso"
              widgetVar="v2AddAlignmentSource"
              modal="true"
              width="520"
              resizable="false"
              appendTo="@(body)">
        <h:form id="v2AddAlignmentSourceForm">
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('statistique.label')} *"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptAlignmentAdminBean.newSourceName}" style="width:100%;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.uri')} *"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptAlignmentAdminBean.newSourceUri}" style="width:100%;"
                                 title="https://opentheso2.mom.fr/opentheso2"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.id_thesaurus')} *"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptAlignmentAdminBean.newSourceThesaurusId}" style="width:100%;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.description')}"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptAlignmentAdminBean.newSourceDescription}" style="width:100%;"/>
                </div>
            </div>
            <div style="text-align:right; margin-top:12px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                 type="button"
                                 styleClass="ui-button-secondary"
                                 style="margin-right:8px;"
                                 onclick="PF('v2AddAlignmentSource').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnAdd')}"
                                 styleClass="ui-button-success"
                                 process="@form"
                                 actionListener="#{v2ConceptAlignmentAdminBean.addOpenthesoSource()}"
                                 update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2ValidateAlignmentPropositionDlg"
              header="#{v2LocaleBean.getMsg('rightbody.concept.alignment.replace')}"
              widgetVar="v2ValidateAlignmentProposition"
              modal="true"
              resizable="true"
              width="640"
              appendTo="@(body)"
              style="margin-top:50px;">
        <h:form id="v2ValidateAlignmentPropositionForm">
            <h:panelGroup rendered="#{v2ConceptAlignmentAdminBean.propositionToValidate != null}">
                <div class="row mb-2">
                    <div class="col-12">
                        <h:outputText value="Veuillez sélectionner les données de l'alignement : "/>
                        <h:outputText value="#{v2ConceptAlignmentAdminBean.propositionToValidate.targetLabel}"
                                      style="color:#f47b2a; font-weight:bold;"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-3">
                        <h:outputText value="Type d'alignement :"/>
                    </div>
                    <div class="col-9">
                        <p:selectOneMenu value="#{v2ConceptAlignmentAdminBean.propositionToValidate.alignmentTypeId}"
                                         style="width:100%; font-size:12px;">
                            <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                           itemLabel="#{type.label}" itemValue="#{type.id}"/>
                        </p:selectOneMenu>
                    </div>
                </div>

                <p:accordionPanel multiple="true" activeIndex="0,1,2" style="margin-top:10px;">
                    <p:tab title="#{v2LocaleBean.getMsg('candidat.traductions')}"
                           disabled="#{empty v2ConceptAlignmentAdminBean.propositionToValidate.traductions}">
                        <p:dataTable var="traduction"
                                     value="#{v2ConceptAlignmentAdminBean.propositionToValidate.traductions}"
                                     style="overflow:auto; max-height:320px;"
                                     lazy="false">
                            <p:column width="20">
                                <p:selectBooleanCheckbox value="#{traduction.selected}"/>
                            </p:column>
                            <p:column width="40" headerText="#{v2LocaleBean.getMsg('candidat.language')}">
                                <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(traduction.idLang)}"
                                     width="27" height="22" alt=""/>
                            </p:column>
                            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.local_value')}">
                                <h:outputText value="#{traduction.localValue}"/>
                            </p:column>
                            <p:column headerText="#{v2LocaleBean.getMsg('statistique.label')}">
                                <h:outputText value="#{traduction.gettedValue}"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>

                    <p:tab title="#{v2LocaleBean.getMsg('rightbody.concept.definition')}"
                           disabled="#{empty v2ConceptAlignmentAdminBean.propositionToValidate.definitions}">
                        <p:dataTable var="definition"
                                     value="#{v2ConceptAlignmentAdminBean.propositionToValidate.definitions}"
                                     style="overflow:auto; max-height:320px;"
                                     lazy="false">
                            <p:column width="20">
                                <p:selectBooleanCheckbox value="#{definition.selected}"/>
                            </p:column>
                            <p:column width="40">
                                <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(definition.idLang)}"
                                     width="27" height="22" alt=""/>
                            </p:column>
                            <p:column headerText="#{v2LocaleBean.getMsg('candidat.value')}">
                                <h:outputText value="#{definition.gettedValue}"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>

                    <p:tab title="#{v2LocaleBean.getMsg('rightbody.concept.images')}"
                           disabled="#{empty v2ConceptAlignmentAdminBean.propositionToValidate.images}">
                        <p:dataTable var="image"
                                     value="#{v2ConceptAlignmentAdminBean.propositionToValidate.images}"
                                     style="overflow:auto; max-height:320px;"
                                     lazy="false">
                            <p:column width="20">
                                <p:selectBooleanCheckbox value="#{image.selected}"/>
                            </p:column>
                            <p:column headerText="#{v2LocaleBean.getMsg('candidat.value')}">
                                <h:outputText value="#{image.gettedValue}"/>
                            </p:column>
                            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.concept.image')}">
                                <p:graphicImage value="#{image.gettedValue}" width="100" height="100"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>
                </p:accordionPanel>
            </h:panelGroup>

            <div style="width:100%; text-align:right; margin-top:15px; margin-bottom:5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                 style="margin-right:10px;"
                                 icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary"
                                 process="@this"
                                 actionListener="#{v2ConceptAlignmentAdminBean.cancelValidateProposition()}"
                                 update="@none"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check"
                                 process="@form"
                                 actionListener="#{v2ConceptAlignmentAdminBean.confirmValidateProposition()}"
                                 update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
