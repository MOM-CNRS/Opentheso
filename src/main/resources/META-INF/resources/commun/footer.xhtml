<ui:composition 
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:idleMonitor timeout="#{sessionConfig.getSessionTimeoutInMilliseconds()}" onidle="handleSessionTimeout()" />
    <h:outputScript>
        function handleSessionTimeout() {
            window.location.href = '#{request.contextPath}/index.xhtml';
        }
    </h:outputScript>

    <footer class="sticky-footer bg-white" style="position:absolute; margin-top: 10px; width:100%;">
        <div class="container my-auto">
            <div class="copyright text-center my-auto">
                <center>
                    <h:outputText value="Copyright ©CNRS _ version: #{connect.getOpenthesoVersion()}" style="font-size: 12px;"/>
                </center>
            </div>
        </div>
    </footer>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="pi pi-angle-up" />
    </a>
    <script src="#{request.contextPath}/resources/js/bootstrap.bundle.min.js"></script>
    <script src="#{request.contextPath}/resources/js/jquery.easing.min.js"></script>
    <script src="#{request.contextPath}/resources/js/sb-admin-2.js"></script>

    <p:ajaxStatus onstart="PF('waitDialog').show()" onsuccess="PF('waitDialog').hide()"/>
    <p:dialog widgetVar="waitDialog" modal="false" draggable="false" width="80"  closable="false" resizable="false" showHeader="false" position="top" 
              style="margin-top: 250px; border: none;">
        <p:graphicImage value="#{request.contextPath}/resources/img/wait.gif" width="100%" style="margin-top: 15px;" />
    </p:dialog>

<!-- déscativer par Miled (pose problème pour le travail en alignement et récupération d'images)
    quand on quitte la fenêtre pour réchercher une image et on revient, on perd la boite de dialogue)
    <h:outputScript>
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                location.reload();
            }
        });
    </h:outputScript>
-->

</ui:composition>
