<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:ui="jakarta.faces.facelets">

<h:head>

    <title>Test - Dashboard statistique Opentheso</title>

    <style>

        .word-cloud-container {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: center;
            gap: 8px 16px;
            padding: 20px;
            line-height: 1.3;
        }

        .word-cloud-item {
            font-weight: 600;
            white-space: nowrap;
            cursor: default;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .word-cloud-item:hover {
            transform: scale(1.08);
            opacity: 0.85;
        }

        /* Palette simple, cyclée sur 5 couleurs pour différencier visuellement
           les mots sans dépendre du nombre de vues (qui pilote déjà la taille). */
        .word-cloud-color-0 { color: #4b82b4; }
        .word-cloud-color-1 { color: #5aa05a; }
        .word-cloud-color-2 { color: #dc963c; }
        .word-cloud-color-3 { color: #b45a5a; }
        .word-cloud-color-4 { color: #8264b4; }

        body {
            margin: 0;
            padding: 0;
            background-color: #f5f6f8;
            font-family: Arial, sans-serif;
        }

        .dashboard-container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dashboard-title {
            margin: 0;
            font-size: 26px;
            font-weight: 500;
        }

        .dashboard-filters {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Grille */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /*
         * Très important :
         * empêche le contenu d'un bloc de déborder
         * dans la cellule suivante.
         */
        .dashboard-card {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .dashboard-card-full {
            width: 100%;
        }

        /*
         * Conteneurs des graphiques
         */
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
        }

        .chart-container-small {
            position: relative;
            width: 100%;
            height: 350px;
        }

        /*
         * Le canvas Chart.js doit rester
         * dans les limites du conteneur.
         */
        .chart-container canvas,
        .chart-container-small canvas {
            max-width: 100% !important;
            max-height: 100% !important;
        }

        /*
         * Table
         */
        .concepts-container {
            width: 100%;
        }

        /*
         * Debug
         */
        .debug-container {
            background-color: #fafafa;
            padding: 15px;
            border-radius: 4px;
            overflow: auto;
        }

        .json-debug {
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
        }

        @media (max-width: 900px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-card-full {
                grid-column: auto;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .dashboard-filters {
                flex-wrap: wrap;
            }
        }
        .chart-container-pie {
            position: relative;
            width: 80%;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>

</h:head>


<h:body>

    <h:form id="testForm">

        <div class="dashboard-filters">

            <p:outputLabel value="Thésaurus :" for="thesaurusMenu"/>

            <p:selectOneMenu id="thesaurusMenu" value="#{dashboardBean.selectedThesaurusId}">
                <f:selectItem itemLabel="Tous les thésaurus" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{dashboardBean.availableThesaurusList}"
                               var="t" itemLabel="#{t.thesaurusLabel}" itemValue="#{t.thesaurusId}"/>
                <p:ajax listener="#{dashboardBean.onThesaurusChange}" update="dashboardContent"/>
            </p:selectOneMenu>

            <p:outputLabel value="Langue :" for="languageMenu"/>

            <p:selectOneMenu id="languageMenu" value="#{dashboardBean.selectedLanguage}">
                <f:selectItem itemLabel="Dernière langue connue" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{dashboardBean.availableLanguages}"
                               var="l" itemLabel="#{l.label}" itemValue="#{l.code}"/>
                <p:ajax listener="#{dashboardBean.onLanguageChange}" update="dashboardContent"/>
            </p:selectOneMenu>

            <p:outputLabel value="Période :" for="periodMenu1"/>

            <p:selectOneMenu id="periodMenu1" value="#{dashboardBean.selectedPeriod}">
                <f:selectItems value="#{dashboardBean.availablePeriods}"
                               var="p" itemLabel="#{p.label}" itemValue="#{p}"/>
                <p:ajax listener="#{dashboardBean.onPeriodChange}" update="dashboardContent"/>
            </p:selectOneMenu>

            <p:commandButton value="Rafraîchir" icon="pi pi-refresh"
                             actionListener="#{dashboardBean.refreshNow}"
                             update="dashboardContent"/>

        </div>

        <div class="dashboard-container">
            <!-- ===================================================== -->
            <!-- EN-TÊTE -->
            <!-- ===================================================== -->
            <div class="dashboard-header">
                <h1 class="dashboard-title">
                    Tableau de bord statistique
                </h1>
            </div>


            <!-- ===================================================== -->
            <!-- CONTENU DU DASHBOARD -->
            <!-- ===================================================== -->

            <h:panelGroup
                    id="dashboardContent"
                    layout="block">
                <div class="dashboard-grid">

                    <!-- ================================================= -->
                    <!-- TRAFIC -->
                    <!-- ================================================= -->
                    <div class="dashboard-card">
                        <p:panel
                                header="Évolution des consultations"
                                toggleable="true"
                                collapsed="false">

                            <div class="chart-container">

                                <p:chart
                                        type="line"
                                        value="#{dashboardBean.dailyTrafficChartJson}"
                                        style="width:100%; height:100%;"/>

                            </div>

                        </p:panel>

                    </div>


                    <!-- ================================================= -->
                    <!-- THESAURUS -->
                    <!-- ================================================= -->

                    <div class="dashboard-card" style="#{dashboardBean.thesaurusFilterActive ? 'display:none;' : ''}">

                        <p:panel
                                header="Répartition par thésaurus"
                                toggleable="true"
                                collapsed="false"
                                style="width:100%;">

                            <div class="chart-container-pie">

                                <p:chart
                                        type="pie"
                                        value="#{dashboardBean.thesaurusPieChartJson}"
                                        style="width:100%; height:100%;"/>

                            </div>

                        </p:panel>

                    </div>


                    <!-- ================================================= -->
                    <!-- API -->
                    <!-- ================================================= -->
                    <div class="dashboard-card">
                        <p:panel
                                header="Endpoints API les plus appelés"
                                toggleable="true"
                                collapsed="false">
                            <div class="concepts-container">
                                <p:dataTable
                                        id="apiRequests"
                                        value="#{dashboardBean.apiUsageStats}"
                                        var="api"
                                        rows="10"
                                        paginator="true"
                                        responsiveLayout="scroll"
                                        emptyMessage="Aucune utilisation API sur cette période">
                                    <p:column
                                            headerText="Méthode"
                                            style="width:120px;">
                                        <h:outputText
                                                value="#{api.httpMethod}"/>
                                    </p:column>
                                    <p:column
                                            headerText="Endpoint">
                                        <h:outputText
                                                value="#{api.url}"/>
                                    </p:column>
                                    <p:column
                                            headerText="Nb appels"
                                            style="width:150px; text-align:right;">
                                        <h:outputText
                                                value="#{api.nbAppels}"/>
                                    </p:column>
                                </p:dataTable>
                                <p:commandButton value="Exporter en CSV" ajax="false" icon="pi pi-download"
                                                 style="margin-top:10px;">
                                    <p:dataExporter type="csv" target="apiRequests"
                                                    fileName="requetes_api_resultat"/>
                                </p:commandButton>
                            </div>
                        </p:panel>
                    </div>


                    <!-- ================================================= -->
                    <!-- CONCEPTS -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Concepts les plus consultés"
                                toggleable="true"
                                collapsed="false">

                            <p:dataTable
                                    id="mostViewedConcepts"
                                    value="#{dashboardBean.topConcepts}"
                                    var="c"
                                    rows="10"
                                    paginator="true"
                                    responsiveLayout="scroll">

                                <p:column headerText="Concept">
                                    <h:outputText value="#{c.conceptLabel}"/>
                                </p:column>
                                <p:column headerText="IdC">
                                    <h:outputText value="#{c.conceptId}"/>
                                </p:column>

                                <p:column headerText="Thésaurus">
                                    <h:outputText value="#{c.thesaurusLabel}"/>
                                </p:column>
                                <p:column headerText="IdT">
                                    <h:outputText value="#{c.thesaurusId}"/>
                                </p:column>

                                <p:column headerText="Nb vues">
                                    <h:outputText value="#{c.totalVues}"/>
                                </p:column>

                            </p:dataTable>
                            <p:commandButton value="Exporter en CSV" ajax="false" icon="pi pi-download"
                                             style="margin-top:10px;">
                                <p:dataExporter type="csv" target="mostViewedConcepts"
                                                fileName="concepts_consultes_resultat"/>
                            </p:commandButton>
                        </p:panel>

                    </div>

                    <!-- ================================================= -->
                    <!-- NUAGE DE MOTS (pur CSS, sans dépendance JS) -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Concepts les plus consultés"
                                toggleable="true"
                                collapsed="false">

                            <div class="word-cloud-container">

                                <ui:repeat value="#{dashboardBean.wordCloudEntries}" var="w" varStatus="status">
                                    <span class="word-cloud-item word-cloud-color-#{status.index mod 5}"
                                          style="font-size:#{w.fontSizePx}px;"
                                          title="#{w.totalVues} vue(s)">
                                        #{w.label}
                                    </span>
                                </ui:repeat>

                            </div>

                        </p:panel>

                    </div>



                    <!-- ================================================= -->
                    <!-- RECHERCHES SANS RÉSULTAT -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Recherches sans résultat"
                                toggleable="true"
                                collapsed="false">

                            <div class="concepts-container">

                                <p:dataTable id="failedSearchesTable"
                                             value="#{dashboardBean.topFailedSearches}"
                                             var="s"
                                             rows="10"
                                             paginator="true"
                                             responsiveLayout="scroll"
                                             sortBy="#{s.nbOccurrences}"
                                             sortOrder="descending"
                                             emptyMessage="Aucune recherche sans résultat sur cette période.">

                                    <p:column headerText="Terme recherché" sortBy="#{s.searchTerm}">
                                        <h:outputText value="#{s.searchTerm}"/>
                                    </p:column>
                                    <p:column headerText="Thésaurus" sortBy="#{s.thesaurusLabel}">
                                        <h:outputText value="#{s.thesaurusLabel}"/>
                                    </p:column>
                                    <p:column headerText="IdT" sortBy="#{s.thesaurusId}">
                                        <h:outputText value="#{s.thesaurusId}"/>
                                    </p:column>

                                    <p:column headerText="Occurrences" style="width:150px; text-align:right;" sortBy="#{s.nbOccurrences}">
                                        <h:outputText value="#{s.nbOccurrences}"/>
                                    </p:column>

                                </p:dataTable>
                                <p:commandButton value="Exporter en CSV" ajax="false" icon="pi pi-download"
                                                 style="margin-top:10px;">
                                    <p:dataExporter type="csv" target="failedSearchesTable"
                                                    fileName="recherches_sans_resultat"/>
                                </p:commandButton>

                            </div>

                        </p:panel>

                    </div>

                    <!-- ================================================= -->
                    <!-- EFFICACITÉ DES SYNONYMES -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Recherches trouvées via un synonyme"
                                toggleable="true"
                                collapsed="false">

                            <div class="concepts-container">

                                <p:dataTable
                                        id="searchesSelected"
                                        value="#{dashboardBean.topSynonymUsage}"
                                        var="s"
                                        rows="10"
                                        paginator="true"
                                        responsiveLayout="scroll"
                                        sortBy="#{s.nbOccurrences}"
                                        sortOrder="descending"
                                        emptyMessage="Aucune donnée sur cette période.">

                                    <p:column headerText="Terme tapé" sortBy="#{s.searchTerm}">
                                        <h:outputText value="#{s.searchTerm}"/>
                                    </p:column>
                                    <p:column headerText="Concept trouvé" sortBy="#{s.selectedTerm}">
                                        <i class="pi pi-arrow-right" style="margin-right:6px; color:#888;"/>
                                        <h:outputText value="#{s.selectedTerm}"/>
                                    </p:column>

                                    <p:column headerText="Thesaurus label" sortBy="#{s.thesaurusLabel}">
                                        <h:outputText value="#{s.thesaurusLabel}"/>
                                    </p:column>
                                    <p:column headerText="IdT" sortBy="#{s.thesaurusId}">
                                        <h:outputText value="#{s.thesaurusId}"/>
                                    </p:column>

                                    <p:column headerText="Occurrences" style="width:150px; text-align:right;" sortBy="#{s.nbOccurrences}">
                                        <h:outputText value="#{s.nbOccurrences}"/>
                                    </p:column>

                                </p:dataTable>
                                <p:commandButton value="Exporter en CSV" ajax="false" icon="pi pi-download"
                                                 style="margin-top:10px;">
                                    <p:dataExporter type="csv" target="searchesSelected"
                                                    fileName="recherches_sélectionnées_resultat"/>
                                </p:commandButton>
                            </div>

                        </p:panel>

                    </div>

                    <!-- ================================================= -->
                    <!-- RECHERCHES GLOBALES (bouton "Rechercher") -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Recherches globales les plus fréquentes"
                                toggleable="true"
                                collapsed="false">

                            <div class="concepts-container">

                                <p:dataTable
                                        id="globalSearch"
                                        value="#{dashboardBean.topGlobalSearches}"
                                        var="s"
                                        rows="10"
                                        paginator="true"
                                        responsiveLayout="scroll"
                                        sortBy="#{s.nbOccurrences}"
                                        sortOrder="descending"
                                        emptyMessage="Aucune recherche globale sur cette période.">

                                    <p:column headerText="Terme recherché" sortBy="#{s.searchTerm}">
                                        <h:outputText value="#{s.searchTerm}"/>
                                    </p:column>
                                    <p:column headerText="Thésaurus" sortBy="#{s.thesaurusLabel}">
                                        <h:outputText value="#{s.thesaurusLabel}"/>
                                    </p:column>
                                    <p:column headerText="IdT" sortBy="#{s.thesaurusId}">
                                        <h:outputText value="#{s.thesaurusId}"/>
                                    </p:column>

                                    <p:column headerText="Occurrences" style="width:130px; text-align:right;" sortBy="#{s.nbOccurrences}">
                                        <h:outputText value="#{s.nbOccurrences}"/>
                                    </p:column>

                                </p:dataTable>

                                <p:commandButton value="Exporter en CSV" ajax="false" icon="pi pi-download"
                                                 style="margin-top:10px;">
                                    <p:dataExporter type="csv" target="globalSearch"
                                                    fileName="recherches_globale_resultat"/>
                                </p:commandButton>

                            </div>

                        </p:panel>

                    </div>


                    <!-- ================================================= -->
                    <!-- Stat by language -->
                    <!-- ================================================= -->


                    <p:dataTable
                            id="conceptsTable"
                            value="#{dashboardBean.topConcepts}"
                            var="concept"
                            rowKey="#{concept.thesaurusId}_#{concept.conceptId}"
                            expandableRows="true"
                            rowExpandMode="single"
                            paginator="true"
                            rows="10"
                            emptyMessage="Aucun concept consulté sur cette période">

                        <!-- ====================================================== -->
                        <!-- Colonne pour ouvrir / fermer le détail                 -->
                        <!-- ====================================================== -->
                        <p:column
                                style="width:50px; text-align:center">

                            <p:rowToggler/>

                        </p:column>


                        <!-- ====================================================== -->
                        <!-- Concept                                                 -->
                        <!-- ====================================================== -->
                        <p:column headerText="Concept">

                            <h:outputText
                                    value="#{concept.conceptLabel}"/>

                        </p:column>


                        <!-- ====================================================== -->
                        <!-- Thésaurus                                               -->
                        <!-- ====================================================== -->
                        <p:column headerText="Thésaurus">

                            <h:outputText
                                    value="#{concept.thesaurusLabel}"/>

                        </p:column>


                        <!-- ====================================================== -->
                        <!-- Nombre total de consultations                           -->
                        <!-- ====================================================== -->
                        <p:column
                                headerText="Consultations"
                                style="text-align:center; width:150px">

                            <h:outputText
                                    value="#{concept.totalVues}"/>

                        </p:column>


                        <!-- ====================================================== -->
                        <!-- DETAIL DU CONCEPT                                       -->
                        <!-- ====================================================== -->
                        <p:rowExpansion>

                            <p:panel
                                    header="Consultations par langue"
                                    style="margin:10px 20px">

                                <p:dataTable
                                        value="#{concept.languageStats}"
                                        var="lang"
                                        emptyMessage="Aucune information de langue disponible">

                                    <!-- Langue -->
                                    <p:column
                                            headerText="Langue"
                                            style="width:100px">

                                        <h:outputText
                                                value="#{lang.language}"/>

                                    </p:column>


                                    <!-- Label réellement enregistré dans le log -->
                                    <p:column headerText="Label consulté">

                                        <h:outputText
                                                value="#{lang.conceptLabel}"/>

                                    </p:column>


                                    <!-- Nombre de consultations -->
                                    <p:column
                                            headerText="Consultations"
                                            style="text-align:center; width:150px">

                                        <h:outputText
                                                value="#{lang.nbVues}"/>

                                    </p:column>

                                </p:dataTable>

                            </p:panel>

                        </p:rowExpansion>

                    </p:dataTable>



                    <!-- ================================================= -->
                    <!-- Multilingue repartition -->
                    <!-- ================================================= -->
                    <p:rowExpansion>

                        <p:panel
                                header="🌍 Répartition linguistique"
                                toggleable="true"
                                collapsed="false"
                                style="margin:10px 20px">

                            <div style="margin-bottom:15px">

                                <strong>Total :</strong>

                                <h:outputText
                                        value="#{concept.languageTotal}"/>

                            </div>

                            <p:dataTable
                                    value="#{concept.languageDistribution}"
                                    var="lang"
                                    styleClass="language-stats-table"
                                    emptyMessage="Aucune statistique linguistique">

                                <p:column
                                        headerText="Langue"
                                        style="width:80px">

                                    <strong>
                                        <h:outputText
                                                value="#{lang.language}"/>
                                    </strong>

                                </p:column>

                                <p:column
                                        headerText="Consultations"
                                        style="width:120px; text-align:center">

                                    <h:outputText
                                            value="#{lang.nbVues}"/>

                                </p:column>

                                <p:column headerText="Répartition">

                                    <div style="
                    display:flex;
                    align-items:center;
                    gap:10px;">

                                        <p:progressBar
                                                value="#{lang.percentage}"
                                                style="flex:1; height:18px"
                                                displayOnly="true"/>

                                        <h:outputText
                                                value="#{lang.percentage}">
                                            <f:convertNumber
                                                    maxFractionDigits="1"/>
                                        </h:outputText>

                                        <h:outputText value=" %"/>

                                    </div>

                                </p:column>

                            </p:dataTable>

                        </p:panel>

                    </p:rowExpansion>

                    <!-- ================================================= -->
                    <!-- concepts consultés dans plusieurs langues  -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="🌐 Concepts consultés dans plusieurs langues"
                                toggleable="true"
                                collapsed="false">

                            <p:dataTable
                                    value="#{dashboardBean.multiLanguageConcepts}"
                                    var="concept"
                                    paginator="true"
                                    rows="10"
                                    emptyMessage="Aucun concept consulté dans plusieurs langues">

                                <p:column headerText="Concept">

                                    <h:outputText
                                            value="#{concept.conceptLabel}"/>

                                </p:column>

                                <p:column headerText="Langues utilisées">

                                    <h:outputText
                                            value="#{concept.languages}"/>

                                </p:column>

                                <p:column
                                        headerText="Total"
                                        style="text-align:center">

                                    <h:outputText
                                            value="#{concept.totalVues}"/>

                                </p:column>

                            </p:dataTable>

                        </p:panel>

                    </div>


                    <!-- ================================================= -->
                    <!-- DEBUG -->
                    <!-- ================================================= -->

                    <div class="dashboard-card">

                        <p:panel
                                header="Debug : JSON des graphiques"
                                toggleable="true"
                                collapsed="true">

                            <div class="debug-container">

                                <p>
                                    <b>Trafic quotidien :</b>
                                </p>

                                <div class="json-debug">
                                    <h:outputText
                                            value="#{dashboardBean.dailyTrafficChartJson}"/>
                                </div>

                                <p>
                                    <b>Répartition thésaurus :</b>
                                </p>

                                <div class="json-debug">
                                    <h:outputText
                                            value="#{dashboardBean.thesaurusPieChartJson}"/>
                                </div>

                                <p>
                                    <b>API :</b>
                                </p>

                                <div class="json-debug">
                                    <h:outputText
                                            value="#{dashboardBean.apiUsageChartJson}"/>
                                </div>

                            </div>

                        </p:panel>

                    </div>

                </div>

            </h:panelGroup>

        </div>

    </h:form>

</h:body>

</html>
