<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

  <h:panelGroup id="v2CorpusView">
    <h:panelGroup rendered="#{v2ThesaurusBrowseBean.haveActiveCorpus}">
      <div class="list-group-item list-group-item-action" style="padding-top: 5px; margin-bottom: -5px;">
        <div class="row" style="vertical-align: central; margin-left: 0;">
          <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
            <p:commandButton styleClass="mr-2"
                             value="#{v2LocaleBean.getMsg('rightbody.concept.showLinked_corpus')}"
                             style="background-color: #f47b2a; border-color: #f47b2a; color: #fff;"
                             actionListener="#{v2ThesaurusBrowseBean.searchCorpusLinks()}"
                             process="@this"
                             update="v2CorpusView"/>
          </div>
          <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left: -10px;">
            <h:panelGroup rendered="#{v2ThesaurusBrowseBean.hasDisplayedCorpusLinks()}">
              <ui:repeat value="#{v2ThesaurusBrowseBean.displayedCorpusLinks}" var="corpus">
                <div class="row">
                  <div class="col-12">
                    <i class="pi pi-link" style="margin-right: 5px; color: #f47b2a; font-size: 13px;"/>
                    <p:link href="#{not empty corpus.uriLink ? corpus.uriLink : '#'}"
                            target="_blank"
                            style="font-size: 14px; color: #164A78;">
                      <h:outputText value="#{corpus.corpusName}" rendered="#{corpus.onlyUriLink}"/>
                      <h:outputText value="#{corpus.corpusName} (#{corpus.noticeCount} #{v2LocaleBean.getMsg('rightbody.concept.notices')})"
                                    rendered="#{not corpus.onlyUriLink}"/>
                    </p:link>
                  </div>
                </div>
              </ui:repeat>
            </h:panelGroup>
            <h:panelGroup rendered="#{v2ThesaurusBrowseBean.corpusNoResult}">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.no_value')}"
                            style="font-size: 14px; color: grey; font-style: italic;"/>
            </h:panelGroup>
          </div>
        </div>
      </div>
    </h:panelGroup>
  </h:panelGroup>
</ui:fragment>
