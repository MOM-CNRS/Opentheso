<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

  <h:panelGroup rendered="#{v2ThesaurusBrowseBean.hasNotesOfType(noteType)}">
    <div class="list-group-item list-group-item-action">
      <div class="row" style="margin-left:0; margin-bottom:5px;">
        <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
          <h:outputText value="#{v2LocaleBean.getMsg(noteMessageKey)}"
                        title="#{v2LocaleBean.getMsg(noteMessageKey)}"
                        style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
        </div>
        <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
          <ui:repeat value="#{v2ThesaurusBrowseBean.notesOfType(noteType)}" var="note">
            <div class="row" style="margin-left:0; margin-bottom:2px;">
              <div class="col-auto" style="padding-right:0; padding-left:0; min-width:56px;">
                <p:commandLink title="#{v2LocaleBean.getMsg('deepl.translate')}"
                               rendered="#{v2ThesaurusBrowseBean.deeplTranslationEnabled and v2ConceptNoteEditorBean.noteActionsAvailable}"
                               process="@this"
                               actionListener="#{v2ConceptDeeplTranslateBean.prepareFromNote(note)}"
                               update="@([id$=v2DeeplTranslateForm])"
                               oncomplete="PF('v2DeeplTranslateDlg').show();">
                  <img src="#{request.contextPath}/resources/img/deepl.png" height="25" style="margin-right:7px;" alt="DeepL"/>
                </p:commandLink>
                <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(note.lang)}"
                     width="20" height="15" style="margin-right:7px;" alt=""/>
              </div>
              <div class="col" style="padding-left:0;">
                <h:outputText value="#{note.value}#{note.sourceDisplay}" escape="false"
                              style="font-size:14px; white-space:pre-wrap;"/>
                <h:outputText value=" (#{note.lang}) "
                              style="font-size:14px; font-weight:300;"/>
              </div>
            </div>
          </ui:repeat>
        </div>
      </div>
    </div>
  </h:panelGroup>
</ui:fragment>
