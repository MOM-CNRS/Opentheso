<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2RemoveMember"
              header="#{v2LocaleBean.getMsg('profile.removeUserFromProjet')}"
              widgetVar="v2RemoveMember"
              width="450" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top: 30px">

        <h:form id="v2RemoveMemberForm">
            <div class="row">
                <div class="col-12" style="font-size: 14px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('candidat.remove')}: "/>
                    <h:outputText value="#{v2MyProjectsBean.memberToRemoveName}" style="color: #f47b2a"/>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 ajax="true" oncomplete="PF('v2RemoveMember').hide();" update="idV2RemoveMember"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 icon="pi pi-check" oncomplete="PF('v2RemoveMember').hide();"
                                 styleClass="ui-button-success"
                                 update="messageIndex containerIndex"
                                 action="#{v2MyProjectsBean.submitRemoveMember()}"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
