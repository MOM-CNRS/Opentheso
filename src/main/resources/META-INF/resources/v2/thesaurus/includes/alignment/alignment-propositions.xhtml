<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <div class="card mb-4 py-3 border-left-success" style="margin:20px; border-color:#43B572;">
        <p:dataTable id="v2AlignmentPropositionsTable"
                     var="alignement"
                     value="#{v2ConceptAlignmentAdminBean.propositions}"
                     selection="#{v2ConceptAlignmentAdminBean.selectedPropositions}"
                     rowKey="#{alignement.conceptId}_#{alignement.targetUri}"
                     style="margin-bottom:-17px; margin-top:-16px; font-size:13px;"
                     lazy="false">
            <f:facet name="header">
                <span style="font-weight:bold;">#{v2LocaleBean.getMsg('rightbody.alignmentList')}</span>
            </f:facet>

            <p:headerRow field="conceptId" expandable="true" expanded="true">
                <p:column colspan="4"
                          style="background-color:#ecf8f1; border-top:1px solid #43B572; border-bottom:1px solid #43B572; color:#143a1e;">
                    <h:outputText value="#{alignement.localLabel} (#{alignement.conceptId})"/>
                </p:column>
                <p:column style="background-color:#ecf8f1; border-top:1px solid #43B572; border-bottom:1px solid #43B572; text-align:right;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                     process="@this"
                                     actionListener="#{v2ConceptAlignmentAdminBean.closePropositionsForConcept(alignement.conceptId)}"
                                     update=":containerIndex:formRightTab"
                                     styleClass="rounded-button ui-button-outlined"
                                     style="color:white; background-color:#617D8B; margin-right:6px;"/>
                    <p:commandButton value="#{v2LocaleBean.getMsg('statistique.validate')}"
                                     process="@this @form"
                                     actionListener="#{v2ConceptAlignmentAdminBean.acceptPropositionsForConcept(alignement.conceptId)}"
                                     update=":containerIndex:formRightTab :messageIndex"
                                     styleClass="rounded-button ui-button-outlined"
                                     style="color:white; background-color:#f47b2a;"/>
                </p:column>
            </p:headerRow>

            <p:column selectionBox="true" style="width:16px; text-align:center;"/>

            <p:column headerText="#{v2LocaleBean.getMsg('statistique.label')}" width="20">
                <h:outputText value="#{alignement.targetLabel}"/>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.uriTarget')}" width="60">
                <h:outputLink value="#{alignement.targetUri}" target="_blank">
                    <h:outputText value="#{alignement.targetUri}"/>
                </h:outputLink>
            </p:column>

            <p:column headerText="Définition" width="60">
                <h:outputText value="#{alignement.targetDefinition}" escape="false"/>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_of_alignmnent')}" width="20">
                <p:selectOneMenu value="#{alignement.alignmentTypeId}" style="width:100%; font-size:12px;">
                    <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                   itemLabel="#{type.label}" itemValue="#{type.id}"/>
                </p:selectOneMenu>
            </p:column>

            <f:facet name="footer">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.alignmentNumber')} : " style="font-size:14px;"/>
                <h:outputText value="#{v2ConceptAlignmentAdminBean.propositions.size()}" style="font-size:16px; color:#f47b2a;"/>
            </f:facet>
        </p:dataTable>
    </div>

    <p:toolbar style="margin:20px; margin-top:10px;">
        <p:toolbarGroup align="right">
            <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}"
                             icon="fas fa-undo-alt"
                             styleClass="ui-button-secondary"
                             style="margin-right:10px;"
                             process="@this"
                             actionListener="#{v2ConceptAlignmentAdminBean.backToSummary()}"
                             update=":containerIndex:formRightTab"/>
            <p:commandButton value="#{v2LocaleBean.getMsg('statistique.validate')}"
                             styleClass="ui-button-success"
                             process="@this @form"
                             actionListener="#{v2ConceptAlignmentAdminBean.acceptSelectedPropositions()}"
                             update=":containerIndex:formRightTab :messageIndex"/>
        </p:toolbarGroup>
    </p:toolbar>
</ui:fragment>
