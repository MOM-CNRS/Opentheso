<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://java.sun.com/jsf/html"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <div class="card shadow mb-4" style="height: 100%;">
        <div class="card mb-4 py-3 border-left-success" style="margin: 30px; border-color: #43B572;">

            <div class="row mb-4">
                <div class="col-12" style="padding-left: 30px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('csvImport.formatStructuredCsv')}"
                                  styleClass="h5 mb-0 text-gray-800"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('statistique.thesaurus.name')}"/>
                </div>
                <div class="col-5">
                    <p:inputText value="#{v2ThesaurusEditionCsvStructuredImportBean.thesaurusName}" style="width: 100%;"/>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"/>
                </div>
                <div class="col-5">
                    <p:selectOneMenu value="#{v2ThesaurusEditionCsvStructuredImportBean.selectedLang}" style="width: 100%;">
                        <f:selectItems value="#{v2ThesaurusEditionCsvStructuredImportBean.allLangs}" var="lang"
                                       itemLabel="#{lang.code} _ #{lang.frenchName}" itemValue="#{lang.code}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('csvExport.delimiter')}"/>
                </div>
                <div class="col-5">
                    <p:selectOneMenu value="#{v2ThesaurusEditionCsvStructuredImportBean.choiceDelimiter}" style="width: 100%;">
                        <f:selectItem itemLabel="," itemValue="0"/>
                        <f:selectItem itemLabel=";" itemValue="1"/>
                        <f:selectItem itemLabel="Tab" itemValue="2"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.project')}"/>
                </div>
                <div class="col-5">
                    <p:selectOneMenu value="#{v2ThesaurusEditionCsvStructuredImportBean.selectedProjectId}"
                                     rendered="#{v2ThesaurusEditionCsvStructuredImportBean.superAdmin}"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2ThesaurusEditionCsvStructuredImportBean.projects}" var="project"
                                       itemLabel="#{project.name}" itemValue="#{project.id}"/>
                    </p:selectOneMenu>
                    <p:selectOneMenu value="#{v2ThesaurusEditionCsvStructuredImportBean.selectedProjectId}"
                                     rendered="#{not v2ThesaurusEditionCsvStructuredImportBean.superAdmin}"
                                     style="width: 100%;">
                        <f:selectItems value="#{v2ThesaurusEditionCsvStructuredImportBean.projects}" var="project"
                                       itemLabel="#{project.name}" itemValue="#{project.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('candidat.parcourir')}"/>
                </div>
                <div class="col-8">
                    <p:fileUpload listener="#{v2ThesaurusEditionCsvStructuredImportBean.loadFileCsvStructured}"
                                  label="#{v2LocaleBean.getMsg('candidat.parcourir')}"
                                  mode="advanced"
                                  auto="true"
                                  process="@form"
                                  update="importCsvStructuredResume messageIndex"
                                  onstart="PF('waitDialog').show();"
                                  oncomplete="PF('waitDialog').hide();"
                                  styleClass="browserbutton">
                                      <p:validateFile allowTypes="/(\.|\/)(csv|txt)$/"/>
                        </p:fileUpload>
                </div>
            </div>

            <h:panelGroup id="importCsvStructuredResume" layout="block">
                <h:panelGroup rendered="#{v2ThesaurusEditionCsvStructuredImportBean.loadDone}" layout="block">
                    <div class="row mb-2 align-items-center">
                        <div class="col-3 text-right">
                            <h:outputText value="#{v2LocaleBean.getMsg('toolbox.totalOfTheso')}"/>
                        </div>
                        <div class="col-8">
                            <h:outputText value="#{v2ThesaurusEditionCsvStructuredImportBean.total}"
                                          style="color: #C63632;"/>
                        </div>
                    </div>
                    <h:panelGroup rendered="#{v2ThesaurusEditionCsvStructuredImportBean.total gt 0}" layout="block">
                        <div class="row mb-3">
                            <div class="col-12 text-center">
                                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.import')}"
                                                 icon="fas fa-file-import"
                                                 styleClass="ui-button-success"
                                                 actionListener="#{v2ThesaurusEditionCsvStructuredImportBean.importThesaurus()}"
                                                 update="importCsvStructuredResume containerIndex messageIndex"
                                                 onstart="PF('waitDialog').show();"
                                                 oncomplete="PF('waitDialog').hide();"/>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>

            <div class="row" style="margin-top: 30px;">
                <div class="col-12 text-center">
                    <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}"
                                     styleClass="ui-button-secondary button"
                                     icon="fas fa-undo-alt"
                                     update="containerIndex"
                                     action="#{v2EditionBean.showList()}"/>
                </div>
            </div>
        </div>
    </div>
</ui:fragment>
