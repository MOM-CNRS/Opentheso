<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/includes/layout.xhtml">
  <ui:param name="page" value="consultation"/>
  <ui:define name="viewActions">
    <f:viewAction action="#{thesaurusViewBean.restoreOpenedConcept}" onPostback="false"/>
  </ui:define>
  <ui:define name="title">OpenTheso — Consultation</ui:define>
  <ui:define name="main">

          <ui:include src="/includes/home.xhtml"/>
          <ui:include src="/includes/hyper.xhtml"/>

          <!-- Conteneur conservé pour les scripts. Les 3 942 fiches de démonstration de la maquette
               (4,4 Mo envoyés à chaque ouverture) ont été retirées : la fiche réelle est dans #viewLive. -->
          <div class="view-panel" id="viewConcept"></div>

          <!-- Aucun résultat -->
          <div class="view-panel" id="viewNoResults">
            <div class="empty">
              <div class="empty-ico">⌕</div>
              <p class="empty-t">Aucun concept ne correspond à « <span id="nrQuery"></span> » dans ce thésaurus.</p>
              <p class="empty-s">Vérifiez l'orthographe ou essayez un terme plus général.</p>
            </div>
          </div>

          <!-- Vide concept -->
          <div class="view-panel" id="viewEmpty">
            <div class="empty">
              <div class="empty-ico">◆</div>
              <p class="empty-t">Sélectionnez un concept dans l'arborescence</p>
              <p class="empty-s">
                ouvrez l'<a class="empty-link" href="index.xhtml">accueil du thésaurus</a>,
                ou <button type="button" class="empty-link" data-act="set-view" data-view="recherche">revenez à la recherche</button>.
              </p>
            </div>
          </div>


  </ui:define>
</ui:composition>
