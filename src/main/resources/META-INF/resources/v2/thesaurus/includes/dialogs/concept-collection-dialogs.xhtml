<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2AddToCollectionDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_concept_to_group')}"
              widgetVar="v2AddToCollectionDlg" width="500" modal="true" resizable="false" position="top"
              appendTo="@(body)">
        <h:form id="v2AddToCollectionForm">
            <p:defaultCommand target="v2AddToCollectionSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptCollectionEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4" style="margin-top:6px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.group')} :"/>
                </div>
                <div class="col-8">
                    <p:autoComplete id="v2AddToCollectionAutocomplete"
                                    value="#{v2ConceptCollectionEditorBean.selectedCollection}"
                                    completeMethod="#{v2ConceptCollectionEditorBean.autocompleteCollection}"
                                    var="collection"
                                    itemLabel="#{collection.label}"
                                    itemValue="#{collection}"
                                    forceSelection="true"
                                    minQueryLength="1"
                                    scrollHeight="300"
                                    converter="v2ConceptCollectionConverter"
                                    style="width:100%;"
                                    inputStyle="width:100%;">
                        <p:column>
                            <h:outputText value="#{collection.label}"/>
                        </p:column>
                        <p:column>
                            <h:outputText value="#{collection.id}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddToCollectionDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddToCollectionSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptCollectionEditorBean.submitAddToCollection()}"
                                 update="@form :containerIndex:formRightTab :messageIndex" ajax="true"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddBranchToCollectionDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_all_to_group')}"
              widgetVar="v2AddBranchToCollectionDlg" width="500" modal="true" resizable="false" position="top"
              appendTo="@(body)">
        <h:form id="v2AddBranchToCollectionForm">
            <p:defaultCommand target="v2AddBranchToCollectionSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptCollectionEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_to_display_all')}"
                                  style="font-size:12px;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-12">
                    <p:autoComplete id="v2AddBranchToCollectionAutocomplete"
                                    value="#{v2ConceptCollectionEditorBean.selectedCollection}"
                                    completeMethod="#{v2ConceptCollectionEditorBean.autocompleteCollection}"
                                    var="collection"
                                    itemLabel="#{collection.label}"
                                    itemValue="#{collection}"
                                    forceSelection="true"
                                    minQueryLength="1"
                                    scrollHeight="300"
                                    dropdown="true"
                                    converter="v2ConceptCollectionConverter"
                                    style="width:100%;"
                                    inputStyle="width:100%;">
                        <p:column>
                            <h:outputText value="#{collection.label}"/>
                        </p:column>
                        <p:column>
                            <h:outputText value="#{collection.id}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddBranchToCollectionDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddBranchToCollectionSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptCollectionEditorBean.submitAddToCollection()}"
                                 update="@form :containerIndex:formRightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2RemoveFromCollectionDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.delete_concept_from_group')}"
              widgetVar="v2RemoveFromCollectionDlg" width="500" modal="true" resizable="false" position="top"
              appendTo="@(body)">
        <h:form id="v2RemoveFromCollectionForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptCollectionEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:dataTable var="collection" value="#{v2ConceptCollectionEditorBean.collectionsToRemove}"
                         lazy="false" size="small" style="margin-top:10px;">
                <f:facet name="header">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.listOfCollections')}"
                                  style="font-weight:bold;"/>
                </f:facet>
                <p:column headerText="Label">
                    <h:outputText value="#{collection.displayLabel}" title="#{collection.conceptId}"/>
                </p:column>
                <p:column width="80" headerText="#{v2LocaleBean.getMsg('btnDelete')}">
                    <p:commandLink style="color:#FF7979;" process="@this"
                                   actionListener="#{v2ConceptCollectionEditorBean.submitRemoveFromCollection(collection)}"
                                   update="@form :containerIndex:formRightTab :messageIndex">
                        <i class="pi pi-trash"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2RemoveFromCollectionDlg').hide();"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2RemoveBranchFromCollectionDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.remove_all_from_group')}"
              widgetVar="v2RemoveBranchFromCollectionDlg" width="500" modal="true" resizable="false" position="top"
              appendTo="@(body)">
        <h:form id="v2RemoveBranchFromCollectionForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptCollectionEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <p:dataTable var="collection" value="#{v2ConceptCollectionEditorBean.collectionsToRemove}"
                         lazy="false" size="small" style="margin-top:10px;">
                <f:facet name="header">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.listOfCollections')}"
                                  style="font-weight:bold;"/>
                </f:facet>
                <p:column headerText="Label">
                    <h:outputText value="#{collection.displayLabel}" title="#{collection.conceptId}"/>
                </p:column>
                <p:column width="80" headerText="#{v2LocaleBean.getMsg('btnDelete')}">
                    <p:commandLink style="color:#FF7979;" process="@this"
                                   actionListener="#{v2ConceptCollectionEditorBean.submitRemoveFromCollection(collection)}"
                                   update="@form :containerIndex:formRightTab :messageIndex">
                        <i class="pi pi-trash"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2RemoveBranchFromCollectionDlg').hide();"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
