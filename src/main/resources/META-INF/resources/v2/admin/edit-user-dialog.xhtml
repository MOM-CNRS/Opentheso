<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2EditUser" header="#{langueBean.getMsg('profile.modify_user')}" widgetVar="v2EditUser"
              width="500" modal="true" resizable="false" position="top">
        <h:form id="v2EditUserForm">
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{langueBean.getMsg('profile.pseudo')}"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.editUsername}"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{langueBean.getMsg('profile.email')}"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.editEmail}"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{langueBean.getMsg('profile.alert_by_email')}"/></div>
                <div class="col-8"><p:toggleSwitch value="#{v2AllUsersBean.editAlertMail}"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{langueBean.getMsg('apply')}" icon="pi pi-check"
                                 action="#{v2AllUsersBean.updateUser()}" update=":containerIndex :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
