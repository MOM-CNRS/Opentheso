<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:pe="http://primefaces.org/ui/extensions">

  <h:panelGroup rendered="#{v2ThesaurusBrowseBean.selectedConcept.identifiers != null}">
    <div class="card mb-4 py-3 border-left-success" style="margin:20px;">
      <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">

        <h:panelGroup rendered="#{v2ThesaurusBrowseBean.notationVisible or v2ConceptAttributeEditorBean.notationEditAvailable}">
          <div class="list-group-item list-group-item-action">
            <div class="row" style="margin-left:0;">
              <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notation')}"
                              style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
              </div>
              <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                <p:commandButton rendered="#{v2ConceptAttributeEditorBean.notationEditAvailable}"
                                 title="#{v2LocaleBean.getMsg('rightbody.concept.notation')}"
                                 icon="fas fa-edit" styleClass="rounded-button ui-button-flat"
                                 style="color:#f47b2a; margin-right:6px;"
                                 process="@this"
                                 actionListener="#{v2ConceptAttributeEditorBean.prepareEditNotation()}"
                                 update="v2EditNotationForm"
                                 oncomplete="PF('v2EditNotationDlg').show();"/>
                <h:panelGroup rendered="#{empty v2ThesaurusBrowseBean.selectedConcept.summary.notation}">
                  <h:outputText value="....." style="font-size:14px; color:grey; font-style:italic;"/>
                </h:panelGroup>
                <h:outputText rendered="#{not empty v2ThesaurusBrowseBean.selectedConcept.summary.notation}"
                              value="#{v2ThesaurusBrowseBean.selectedConcept.summary.notation}"
                              style="font-size:14px;"/>
              </div>
            </div>
          </div>
        </h:panelGroup>

        <div class="list-group-item list-group-item-action">
          <div class="row" style="margin-left:0;">
            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.internal_id')}"
                            style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-6px;">
              <i class="pi pi-link" style="margin-right:5px; color:#f47b2a; font-size:13px;"/>
              <p:link href="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.internalPermalinkUrl}"
                      value="#{v2ThesaurusBrowseBean.selectedConcept.summary.conceptId}"
                      style="color:#164A78; font-size:13px;"/>
            </div>
          </div>
        </div>

        <h:panelGroup rendered="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.showOriginalUri}">
          <div class="list-group-item list-group-item-action">
            <div class="row" style="margin-left:0;">
              <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.original_uri')}"
                              style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
              </div>
              <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-6px;">
                <h:panelGroup rendered="#{not empty v2ThesaurusBrowseBean.selectedConcept.identifiers.originalUri}">
                  <i class="pi pi-link" style="margin-right:5px; color:#f47b2a; font-size:13px;"/>
                  <p:link href="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.originalUri}"
                          value="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.originalUri}"
                          target="_blank" style="color:#164A78; font-size:13px;"/>
                </h:panelGroup>
              </div>
            </div>
          </div>
        </h:panelGroup>

        <div class="list-group-item list-group-item-action">
          <div class="row">
            <div class="col-xl-10 col-lg-10 col-md-10 col-sm-9">
              <h:panelGroup rendered="#{not empty v2ThesaurusBrowseBean.selectedConcept.identifiers.permanentId}">
                <div class="row" style="margin-left:0;">
                  <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('persistentIdentifier')}"
                                  style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                  </div>
                  <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-6px;">
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.permanentId}" style="font-size:12px;"/>
                    <p:commandButton id="v2BtnCopyArk" icon="fa-solid fa-copy"
                                     styleClass="rounded-button ui-button-flat"
                                     style="color:#f47b2a; background-color:transparent;"
                                     onclick="return false;"/>
                    <pe:clipboard trigger="v2BtnCopyArk" action="copy"
                                  text="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.permanentId}">
                      <p:ajax event="success" listener="#{clipboardFeedbackBean.onSuccess}" update="messageIndex"/>
                      <p:ajax event="error" listener="#{clipboardFeedbackBean.onError}" update="messageIndex"/>
                    </pe:clipboard>
                  </div>
                </div>
              </h:panelGroup>
            </div>
            <div class="col-xl-2 col-lg-2 col-md-2 col-sm-3" style="text-align:right;">
              <p:barcode rendered="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.showQrCode}"
                         value="#{v2ThesaurusBrowseBean.selectedConcept.identifiers.qrCodeValue}"
                         type="qr" height="75px;"/>
            </div>
          </div>
        </div>

        <ui:include src="concept-detail-text-row.xhtml">
          <ui:param name="rowLabel" value="#{v2LocaleBean.getMsg('rightbody.concept.status')}"/>
          <ui:param name="rowValue" value="#{v2ThesaurusBrowseBean.selectedConcept.summary.status}"/>
        </ui:include>

        <h:panelGroup rendered="#{v2ThesaurusBrowseBean.kohaLink and not empty v2ThesaurusBrowseBean.selectedConcept.identifiers.permanentId}">
          <div class="list-group-item list-group-item-action">
            <p:link href="https://pro.frantiq.fr/cgi-bin/koha/catalogue/search.pl?q=an:#{v2ThesaurusBrowseBean.selectedConcept.identifiers.permanentId}"
                    target="_blank" value="Lien vers KohaPro" style="color:#164A78; font-size:14px; margin-left:10px;"/>
          </div>
        </h:panelGroup>
      </div>
    </div>
  </h:panelGroup>
</ui:fragment>
