<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <f:view>
        <f:metadata>
    <f:viewAction action="#{v2ConsultationShellBean.load()}"/>
            <f:viewAction action="#{v2PreferenceSettingsBean.load()}"/>
            <f:viewParam name="idc" value="#{v2ThesaurusContext.idConceptFromUri}"/>
            <f:viewParam name="idg" value="#{v2ThesaurusContext.idGroupFromUri}"/>
            <f:viewParam name="idt" value="#{v2ThesaurusContext.idThesoFromUri}"/>
        </f:metadata>
    </f:view>
    <h:head>
        <title>Opentheso</title>

        <link href="../../resources/img/icon_opentheso2.png" rel="icon" />

        <link rel="stylesheet" type="text/css" href="../../resources/css/all.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css" />

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/> 
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/v4-shims.css"/>
    </h:head>

    <h:body id="page-top" onload="initMenu()">

        <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>

        <h:panelGroup rendered="#{v2UserSession.isLoggedIn() and v2PreferenceSettingsBean.screenAvailable}" id="wrapper" style="height: 100%" >

            <ui:include src="../thesaurus/includes/layout/menu.xhtml" />

            <div id="content-wrapper" style="width: 100%">

                <h:form id="containerIndex" style="min-height:100%; position:relative;">

                    <h:panelGroup id="header">
                        <ui:include src="../thesaurus/includes/layout/header.xhtml" />
                    </h:panelGroup>

                    <div class="container-fluid" style="padding-bottom: 70px">

                        <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin: 20px">
                            <h1 class="h3 mb-0 text-gray-800">#{v2LocaleBean.getMsg('menu.setting')} / <span style="color: #f47b2a">#{v2LocaleBean.getMsg('menu.identifier')}</span></h1>
                        </div>

                        <div class="col-12" style="height: 100%">
                            <div class="card shadow mb-4" style="height: 100%;">

                                <div class="row" style="text-align: right; margin-right: 20px">
                                    <div class="col-1 offset-11"  >
                                        <p:linkButton  href="https://opentheso.hypotheses.org/76" target="_blank" icon="fa-solid fa-circle-question" styleClass="rounded-button ui-button-outlined" />                                         
                                    </div>
                                </div>

                                <!-- Ark -->
                                <div class="card mb-4 py-3 border-left-success" style="margin-left: 30px; margin-right: 30px; margin-top: 10px;">
                                    <p:panel style="border-color: transparent">
                                        <div class="row" style="height: 32px; background: #ECF8F1 !important; margin-left: 5px; margin-right: 5px">
                                            <div class="col-6" style="padding-top: 3px">
                                                <h:outputText value="#{v2LocaleBean.getMsg('setting.arkServer')}" style="font-weight: bold; color: #f47b2a !important;" />
                                            </div>
                                            <div class="col-6" style="text-align: right; padding-top: 3px">
                                                <p:toggleSwitch  value="#{v2PreferenceSettingsBean.editor.useArk}" 
                                                                 onIcon="pi pi-times" offIcon="pi pi-check"
                                                                 style="height: 25px; width: 50px;">
                                                    <p:ajax event="change" listener="#{v2PreferenceSettingsBean.updateSelectedServer('ark')}" update="containerIndex menuBar" />
                                                </p:toggleSwitch>  
                                            </div>
                                        </div>

                                        <h:panelGroup rendered="#{v2PreferenceSettingsBean.editor.useArk}" >
                                            <div class="list-group" >

                                                <!-- Serveur Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.arkServer')}" style="font-size: 14px; font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.serverArk}" style="width: 100%;">
                                                                <p:tooltip value="#{v2LocaleBean.getMsg('setting.arkServerTooltip')}" showDelay="500" />
                                                            </p:inputText>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Uri Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.uriArk')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.uriArk}" style="width: 100%;">
                                                                <p:tooltip value="#{v2LocaleBean.getMsg('setting.uriArkTooltip')}" showDelay="500" />
                                                            </p:inputText>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Naan Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.yourNaan')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.idNaan}" style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Prefixe Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.arkPrefix')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.prefixArk}" style="width: 100%; font-size: 12px;"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- User Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.userArk')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.userArk}"  style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- pass Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.passArk')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:password value="#{v2PreferenceSettingsBean.editor.newPassArk}" style="width: 100%;" placeholder="••••••••••" feedback="false" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="row" style="padding: 3px;">
                                                    <div class="col-11" style="text-align: right; margin-top: 2px;">
                                                        <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success" icon="pi pi-check" 
                                                                         update="containerIndex messageIndex menuBar"
                                                                         action="#{v2PreferenceSettingsBean.save()}" >
                                                            <p:tooltip value="#{v2LocaleBean.getMsg('candidat.save')}" showDelay="500" />
                                                        </p:commandButton>
                                                    </div>
                                                </div>
                                            </div>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>

                                <!-- Serveur Ark Local -->
                                <div class="card mb-4 py-3 border-left-success" style="margin-left: 30px; margin-right: 30px;margin-top: 5px;">
                                    <p:panel style="border-color: transparent">
                                        <div class="row" style="height: 32px; background: #ECF8F1 !important; margin-left: 5px; margin-right: 5px">
                                            <div class="col-6" style="padding-top: 3px">
                                                <h:outputText value="#{v2LocaleBean.getMsg('setting.localArkServer')} *" style="font-size: 14px; font-weight: bold; color: #f47b2a !important;"
                                                              title="#{v2LocaleBean.getMsg('setting.localArkServerTooltip')}"/>
                                            </div>
                                            <div class="col-6" style="text-align: right; padding-top: 3px">
                                                <p:toggleSwitch  value="#{v2PreferenceSettingsBean.editor.useArkLocal}" 
                                                                 onIcon="pi pi-times" offIcon="pi pi-check"
                                                                 style="height: 25px; width: 50px;">
                                                    <p:ajax event="change" listener="#{v2PreferenceSettingsBean.updateSelectedServer('arklocal')}" update="containerIndex menuBar" />
                                                </p:toggleSwitch>  
                                            </div>
                                        </div>
                                        <h:panelGroup rendered="#{v2PreferenceSettingsBean.editor.useArkLocal}" >
                                            <div class="list-group" style="margin-bottom: -10px">

                                                <!-- Naan Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.yourNaan')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.naanArkLocal}" style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Prefixe Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.arkPrefix')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.prefixArkLocal}" style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- size of Id Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.sizeOfArkIdentifier')}"
                                                                          title="#{v2LocaleBean.getMsg('setting.sizeOfArkIdentifierTooltip')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.sizeIdArkLocal}" style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- size of Id Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.isUpperCaseForArk')}"
                                                                          title="#{v2LocaleBean.getMsg('setting.isUpperCaseForArkTooltip')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:toggleSwitch value="#{v2PreferenceSettingsBean.editor.uppercaseForArk}" style="font-size: 12px;" />
                                                        </div>
                                                    </div>
                                                </div>            
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-9 offset-3" style=" margin-top: 2px;">
                                                            <h:outputText value="(*) #{v2LocaleBean.getMsg('setting.localArkInfo')}"
                                                                          style="font-style: italic" />
                                                        </div>
                                                    </div>
                                                </div>    
                                                <div class="row" style="padding: 3px;">
                                                    <div class="col-9 offset-3" style="text-align: left;">
                                                        <p:graphicImage value="/resources/img/local_ark_info.png" alt="/resources/img/local_ark_info.png"  
                                                                        style="height: 150px; " />
                                                    </div>                                              
                                                </div>
                                                <!-- size of Id Ark -->
                                                <div class="row" style="padding: 3px;">
                                                    <div class="col-11" style="text-align: right; margin-top: 2px;">
                                                        <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success" icon="pi pi-check"
                                                                         action="#{v2PreferenceSettingsBean.save()}"
                                                                         update="containerIndex messageIndex menuBar"/>
                                                    </div>
                                                </div>
                                            </div>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>

                                <!--Serveur Handle-->
                                <div class="card mb-4 py-3 border-left-success" style="margin-left: 30px; margin-right: 30px; margin-top: 5px;">
                                    <p:panel style="border-color: transparent">
                                        <div class="row" style="height: 32px; background: #ECF8F1 !important; margin-left: 5px; margin-right: 5px">
                                            <div class="col-6" style="padding-top: 3px">
                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleServer')}" style="font-size: 14px; font-weight: bold; color:#f47b2a  !important;" />
                                            </div>
                                            <div class="col-6" style="text-align: right; padding-top: 3px">
                                                <p:toggleSwitch  value="#{v2PreferenceSettingsBean.editor.useHandle}" 
                                                                 onIcon="pi pi-times" offIcon="pi pi-check"
                                                                 style="height: 25px; width: 50px;">
                                                    <p:ajax event="change" listener="#{v2PreferenceSettingsBean.updateSelectedServer('handle')}" update="containerIndex menuBar" />
                                                </p:toggleSwitch>                                                    
                                            </div>
                                        </div>


                                        <h:panelGroup rendered="#{v2PreferenceSettingsBean.editor.useHandle}" >
                                            <div class="list-group" style="margin-bottom: -10px">

                                                <!-- Activer / désactiver Handle avec certificat  -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px; margin-top: 10px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('identifier.useHandleWithCertificate')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputSwitch value="#{v2PreferenceSettingsBean.editor.useHandleWithCertificat}" style="color: #f47b2a" onLabel="OUI" offLabel="NON" >
                                                                <p:ajax event="change" update="containerIndex menuBar" />
                                                            </p:inputSwitch>
                                                        </div>
                                                    </div>
                                                </div>                                                       
                                                <p:spacer/>                                                
                                                


                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleServer')}" style="font-weight: bold;" title="exemple: https://handle.mondomaine.fr:8000/api/handles/"/>
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.urlApiHandle}" title="exemple: https://handle.mondomaine.fr:8000/api/handles/" 
                                                                         style="width: 100%;" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Prefixe Handle -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('identifier.handlePrefix')}" style="font-weight: bold;" title="exemple: 20.500.11111"/>
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.prefixIdHandle}" style="width: 100%;" 
                                                                         title="exemple: 20.500.11111"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <h:panelGroup rendered="#{!v2PreferenceSettingsBean.editor.useHandleWithCertificat}" style="background-color: #ECF8F1;">
                                                    <!-- Index Handle -->
                                                    <div class="list-group-item list-group-item-action">
                                                        <div class="row" style="padding: 3px;">
                                                            <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleIndex')}" style="font-weight: bold;"  title="exemple: 300"/>
                                                            </div>
                                                            <div class="col-8">
                                                                <p:inputText value="#{v2PreferenceSettingsBean.editor.indexHandle}" title="exemple: 300" style="width: 100%;" />
                                                            </div>
                                                        </div>
                                                    </div>  

                                                    <!-- Admin Handle -->
                                                    <div class="list-group-item list-group-item-action">
                                                        <div class="row" style="padding: 3px;">
                                                            <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleAdmin')}" style="font-weight: bold;" title="exemple: 0.NA/20.500.11111"/>
                                                            </div>
                                                            <div class="col-8">
                                                                <p:inputText value="#{v2PreferenceSettingsBean.editor.adminHandle}" style="width: 100%;" title="exemple: 0.NA/20.500.11111"/>
                                                            </div>
                                                        </div>
                                                    </div>         
                                                </h:panelGroup>

                                                <!-- Prefixe privé -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('identifier.handlePrivatePrefix')}" title="#{v2LocaleBean.getMsg('identifier.handlePrivatePrefixTooltip')}"
                                                                          style="font-size: 14px; font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:inputText value="#{v2PreferenceSettingsBean.editor.privatePrefixHandle}" style="width: 100%;"/>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- pass Handle -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('identifier.handlePass')}" style="font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
                                                            <p:password value="#{v2PreferenceSettingsBean.editor.newPassHandle}" placeholder="••••••••••" style="width: 100%;" feedback="false"/>
                                                        </div>
                                                    </div>
                                                </div>                                                    

                                                <p:spacer/>


                                                <!-- Serveur Handle standard -->
                                                <h:panelGroup rendered="#{!v2PreferenceSettingsBean.editor.useHandleWithCertificat}" style="background-color: #ECF8F1;">                                                   

                                                    <!-- fichier adminpriv -->
                                                    <div class="list-group-item list-group-item-action">
                                                        <div class="row" style="padding: 3px;">
                                                            <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handlePathToKey')}" style="font-weight: bold;" 
                                                                              title="#{v2LocaleBean.getMsg('identifier.handlePathToKeyTooltip')}"/>
                                                            </div>
                                                            <div class="col-8">
                                                                <h:outputText value="./certificats/admpriv.bin" style="width: 100%; color: #C34A2C; font-weight: bold"
                                                                              title="#{v2LocaleBean.getMsg('identifier.handlePathToKeyTooltip')}"/>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </h:panelGroup> 


                                                <!-- Serveur Handle chez Huma-Num -->                                                
                                                <h:panelGroup rendered="#{v2PreferenceSettingsBean.editor.useHandleWithCertificat}">
                                                    <!-- Path Clé Handle -->
                                                    <div class="list-group-item list-group-item-action">
                                                        <div class="row" style="padding: 3px;">
                                                            <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleKey')}" style="font-weight: bold;"
                                                                              title="#{v2LocaleBean.getMsg('identifier.handleKeyTooltip')}"/>
                                                            </div>
                                                            <div class="col-8">
                                                                <p:inputText value="#{v2PreferenceSettingsBean.editor.pathKeyHandle}" style="width: 100%;"/>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- Path certificat Handle -->
                                                    <div class="list-group-item list-group-item-action">
                                                        <div class="row" style="padding: 3px;">
                                                            <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                                <h:outputText value="#{v2LocaleBean.getMsg('identifier.handleCertificate')}" style="font-weight: bold;"
                                                                              title="#{v2LocaleBean.getMsg('identifier.handleCertificateTooltip')}"/>
                                                            </div>
                                                            <div class="col-8">
                                                                <p:inputText value="#{v2PreferenceSettingsBean.editor.pathCertHandle}" style="width: 100%;" />
                                                            </div>
                                                        </div>
                                                    </div>

                                                </h:panelGroup>                                                


                                                <!-- enregistrer les changements -->
                                                <div class="row" style="padding: 3px;">
                                                    <div class="col-11" style="text-align: right; margin-top: 2px;">
                                                        <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success" icon="pi pi-check"
                                                                         action="#{v2PreferenceSettingsBean.save()}"
                                                                         update="containerIndex messageIndex menuBar"/>
                                                    </div>
                                                </div>

                                            </div>
                                        </h:panelGroup>                                            
                                    </p:panel>
                                </div>

                                <!-- OpenArk -->
                                <div class="card mb-4 py-3 border-left-success" style="margin-left: 30px; margin-right: 30px; margin-top: 10px;">
                                    <p:panel style="border-color: transparent">
                                        <div class="row" style="height: 32px; background: #ECF8F1 !important; margin-left: 5px; margin-right: 5px">
                                            <div class="col-6" style="padding-top: 3px">
                                                <h:outputText value="#{v2LocaleBean.getMsg('setting.openArkServer')}" style="font-weight: bold; color: #f47b2a !important;" />
                                            </div>
                                            <div class="col-6" style="text-align: right; padding-top: 3px">
                                                <p:toggleSwitch  value="#{v2PreferenceSettingsBean.editor.useOpenArk}"
                                                                 onIcon="pi pi-times" offIcon="pi pi-check"
                                                                 style="height: 25px; width: 50px;">
                                                    <p:ajax event="change" listener="#{v2PreferenceSettingsBean.updateSelectedServer('openark')}" update="containerIndex menuBar" />
                                                </p:toggleSwitch>
                                            </div>
                                        </div>

                                        <h:panelGroup rendered="#{v2PreferenceSettingsBean.editor.useOpenArk}" >
                                            <div class="list-group" >

                                                <!-- Serveur Ark -->
                                                <div class="list-group-item list-group-item-action">
                                                    <div class="row" style="padding: 3px;">
                                                        <div class="col-3" style="text-align: right; margin-top: 2px;">
                                                            <h:outputText value="#{v2LocaleBean.getMsg('setting.arkServer')}" style="font-size: 14px; font-weight: bold;" />
                                                        </div>
                                                        <div class="col-8">
