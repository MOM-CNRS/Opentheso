<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2DeeplTranslateDlg"
              header="#{v2LocaleBean.getMsg('deepl.translateNote')}"
              widgetVar="v2DeeplTranslateDlg"
              width="750" showEffect="fade" modal="true" resizable="true"
              position="top" style="margin-top:30px;">
        <h:form id="v2DeeplTranslateForm">
            <h:panelGroup rendered="#{not empty v2ConceptDeeplTranslateBean.textToTranslate}">
                <div class="row">
                    <div class="col-12" style="text-align:left;">
                        <h:outputText value="#{v2LocaleBean.getMsg('deepl.selectedConcept')} : #{v2ConceptDeeplTranslateBean.conceptLabel}"
                                      style="font-size:14px;"/>
                    </div>
                </div>

                <div class="row" style="margin-top:10px;">
                    <div class="col-5" style="text-align:right;">
                        <h:outputText value="#{v2ConceptDeeplTranslateBean.fromLangLabel} (#{v2ConceptDeeplTranslateBean.fromLang})"
                                      style="font-size:14px; color:#C63632;"/>
                    </div>
                    <div class="col-1" style="text-align:center;">
                        <i class="fa-solid fa-arrow-right"/>
                    </div>
                    <div class="col-5">
                        <p:selectOneMenu value="#{v2ConceptDeeplTranslateBean.toLang}">
                            <p:ajax event="valueChange" update="v2DeeplTranslateBody"
                                    listener="#{v2ConceptDeeplTranslateBean.retrieveExistingTranslatedText()}"/>
                            <f:selectItems value="#{v2ConceptDeeplTranslateBean.targetLangs}" var="targetLang"
                                           itemLabel="#{targetLang.name} (#{targetLang.code})"
                                           itemValue="#{targetLang.code}"/>
                        </p:selectOneMenu>
                    </div>
                </div>

                <h:panelGroup id="v2DeeplTranslateBody">
                    <div class="row">
                        <div class="col-10" style="margin-top:3px;">
                            <h:outputText value="#{v2LocaleBean.getMsg('deepl.selectedText')}"/>
                        </div>
                        <div class="col-10" style="margin-top:3px;">
                            <p:inputTextarea value="#{v2ConceptDeeplTranslateBean.textToTranslate}"
                                             style="width:100%; font-size:13px;"/>
                        </div>
                    </div>

                    <div class="row" style="margin-top:10px;">
                        <div class="col-10" style="margin-top:3px;">
                            <h:outputText value="#{v2LocaleBean.getMsg('deepl.existingTranslation')}"
                                          style="color:#164A78; font-size:13px;"/>
                            <h:outputText value=" (#{v2ConceptDeeplTranslateBean.sourceTranslatedText})"
                                          rendered="#{not empty v2ConceptDeeplTranslateBean.sourceTranslatedText}"
                                          style="color:#78261f; font-size:13px; font-weight:bold; font-style:italic;"/>
                        </div>
                        <div class="col-10" style="margin-top:3px;">
                            <p:inputTextarea value="#{v2ConceptDeeplTranslateBean.existingTranslatedText}"
                                             style="width:100%; font-size:13px; color:#C63632;"/>
                        </div>
                        <div class="col-2" style="margin-top:20px;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('statistique.validate')}"
                                             icon="pi pi-save"
                                             styleClass="rounded-button ui-button-success"
                                             style="font-size:13px;"
                                             process="@form"
                                             actionListener="#{v2ConceptDeeplTranslateBean.saveExistingTranslatedText()}"
                                             update="v2DeeplTranslateBody :containerIndex:formRightTab :messageIndex"/>
                        </div>
                    </div>

                    <div class="col-12" style="text-align:center; margin-top:10px;">
                        <p:graphicImage value="/resources/img/deepl.png" width="40"/>
                        <p:commandButton value="#{v2LocaleBean.getMsg('deepl.translate')}"
                                         icon="fa-solid fa-language"
                                         styleClass="rounded-button ui-button-success"
                                         style="background-color:#0F2A46; color:white; font-size:13px; margin-left:8px;"
                                         process="@form"
                                         actionListener="#{v2ConceptDeeplTranslateBean.translate()}"
                                         update="v2DeeplTranslateBody :messageIndex"/>
                    </div>

                    <div class="row" style="margin-top:10px;">
                        <div class="col-10" style="margin-top:3px;">
                            <h:outputText value="#{v2LocaleBean.getMsg('deepl.translationResult')}"/>
                        </div>
                        <div class="col-10" style="margin-top:3px;">
                            <p:inputTextarea value="#{v2ConceptDeeplTranslateBean.translatingText}"
                                             style="width:100%; font-size:13px;"/>
                        </div>
                        <div class="col-2" style="margin-top:20px;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('statistique.validate')}"
                                             icon="pi pi-save"
                                             styleClass="rounded-button ui-button-success"
                                             style="font-size:13px;"
                                             process="@form"
                                             actionListener="#{v2ConceptDeeplTranslateBean.saveTranslatedText()}"
                                             update="v2DeeplTranslateBody :containerIndex:formRightTab :messageIndex"/>
                        </div>
                    </div>

                    <div class="col-12" style="margin-top:20px; text-align:center;">
                        <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                         styleClass="ui-button-secondary"
                                         icon="fas fa-undo-alt"
                                         type="button"
                                         onclick="PF('v2DeeplTranslateDlg').hide();"/>
                    </div>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:fragment>
