<!DOCTYPE HTML>
<HTML xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <f:view>
        <f:metadata>
    <f:viewAction action="#{v2ConsultationShellBean.load()}"/>
            <f:viewAction action="#{v2EditionBean.load()}"/>
            <f:viewParam name="idc" value="#{v2ThesaurusContext.idConceptFromUri}"/>
            <f:viewParam name="idg" value="#{v2ThesaurusContext.idGroupFromUri}"/>
            <f:viewParam name="idt" value="#{v2ThesaurusContext.idThesoFromUri}"/>
        </f:metadata>
    </f:view>
    <h:head>
        <title>Opentheso</title>

        <link href="../../resources/img/icon_opentheso2.png" rel="icon" />

        <link rel="stylesheet" type="text/css" href="../../resources/css/all.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css" />

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/>
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/v4-shims.css"/>
    </h:head>

    <h:body id="page-top" onload="initMenu()">

        <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>

        <h:panelGroup rendered="#{v2UserSession.isLoggedIn() and v2EditionBean.screenAvailable}" id="wrapper" style="height: 100%">

            <ui:include src="../thesaurus/includes/layout/menu.xhtml" />

            <div id="content-wrapper" style="min-height:100%; position:relative;">

                <h:form id="containerIndex" style="min-height:100%; position:relative;">

                    <h:panelGroup id="header">
                        <ui:include src="../thesaurus/includes/layout/header.xhtml" />
                    </h:panelGroup>

                    <div class="container-fluid">

                        <div class="d-sm-flex align-items-center justify-content-between mb-4"
                             style="margin-top: 20px; margin-bottom: 15px">
                            <h1 class="h3 mb-0 text-gray-800">#{v2LocaleBean.getMsg('menu.toolbox')} / <span style="color: #f47b2a">#{v2LocaleBean.getMsg('menu.edition')}</span></h1>
                        </div>

                        <p:panel rendered="#{v2EditionBean.listView}">
                            <ui:include src="edition/view-list-theso.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.newView}">
                            <ui:include src="edition/view-new-theso.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.modifyView}">
                            <ui:include src="edition/view-modify-theso.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.importSkosView}">
                            <ui:include src="edition/view-import-skos.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.importCsvView}">
                            <ui:include src="edition/view-import-csv.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.importCsvStructureView}">
                            <ui:include src="edition/view-import-csv-structured.xhtml" />
                        </p:panel>

                        <p:panel rendered="#{v2EditionBean.exportView}">
                            <ui:include src="edition/view-export-thesaurus.xhtml" />
                        </p:panel>
                    </div>
                    <ui:include src="../thesaurus/includes/layout/footer.xhtml" />
                    <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
                </h:form>
                <ui:include src="edition/confirm-delete-thesaurus-dialog.xhtml" />
                <ui:include src="edition/add-language-dialog.xhtml" />
                <ui:include src="edition/edit-language-dialog.xhtml" />
                <ui:include src="edition/change-id-dialog.xhtml" />
                <ui:include src="../thesaurus/includes/layout/logout-dialog.xhtml" />
            </div>
        </h:panelGroup>

        <p:dialog widgetVar="waitDialog" modal="false" draggable="false" width="80"
                  closable="false" resizable="false" showHeader="false" position="top"
                  style="margin-top:250px; border:none;">
            <p:graphicImage value="../../resources/img/wait.gif" width="100%" style="margin-top:15px;"/>
        </p:dialog>
    </h:body>
</HTML>
