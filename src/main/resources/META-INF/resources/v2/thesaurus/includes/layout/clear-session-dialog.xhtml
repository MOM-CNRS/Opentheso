<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idClearSession" header="#{v2LocaleBean.getMsg('menu.cleanSession')}" widgetVar="clearSession"
              width="450" showEffect="fade" modal="true" resizable="false" position="top" style="margin-top: 30px">

        <h:outputText value="#{v2LocaleBean.getMsg('menu.confirm_cleanSession')}"
                      style="font-size: 13px; color: black;"/>

        <f:facet name="footer">
            <div style="width: 100%; text-align: right; margin-top: 5px; margin-bottom: 5px;">
                <p:commandButton title="Fermer" styleClass="ui-button-secondary" style="margin-right: 10px"
                                 onclick="PF('clearSession').hide(); return false;" type="button"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('menu.delete_session')}"
                                 actionListener="#{v2ConsultationShellBean.clearSession()}" ajax="false"/>
            </div>
        </f:facet>
    </p:dialog>
</ui:fragment>
