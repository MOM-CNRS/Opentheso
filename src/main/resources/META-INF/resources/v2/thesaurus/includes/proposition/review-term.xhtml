<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
        <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">

            <div class="list-group-item list-group-item-action">
                <div class="row" style="margin-left:0;">
                    <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                        <p:selectBooleanCheckbox value="#{v2PropositionBean.prefTermeAccepted}"
                                                 title="Accepter cette proposition"
                                                 rendered="#{v2PropositionBean.showButtonDecision and v2PropositionBean.canMakeAction}"/>
                        <h:outputText value=" #{v2LocaleBean.getMsg('rightbody.concept.preferred_term')}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f; margin-left:5px;"/>
                    </div>
                    <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                        <h:panelGroup rendered="#{v2PropositionBean.selectedDraft.preferredLabelChange == null}">
                            <h:outputText value="#{v2PropositionBean.selectedProposition.conceptLabel}"
                                          style="font-size:1.1rem; color:#666; font-weight:bold;"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{v2PropositionBean.selectedDraft.preferredLabelChange != null}">
                            <h:outputText value="#{v2PropositionBean.selectedDraft.preferredLabelChange.oldValue}"
                                          rendered="#{not empty v2PropositionBean.selectedDraft.preferredLabelChange.oldValue}"
                                          style="font-size:0.8rem; text-decoration:line-through; color:#666;"/>
                            <h:outputText value=" #{v2PropositionBean.selectedDraft.preferredLabelChange.value}"
                                          style="font-size:1.1rem; margin-left:10px; color:#43B572; font-weight:bold;"/>
                        </h:panelGroup>
                    </div>
                </div>
            </div>

            <div class="list-group-item list-group-item-action">
                <div class="row" style="margin-left:0;">
                    <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                        <p:selectBooleanCheckbox value="#{v2PropositionBean.varianteAccepted}"
                                                 title="Accepter cette proposition"
                                                 rendered="#{v2PropositionBean.showButtonDecision and v2PropositionBean.canMakeAction}"/>
                        <h:outputText value=" #{v2LocaleBean.getMsg('rightbody.concept.synonym')}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f; margin-left:5px;"/>
                    </div>
                    <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                        <h:panelGroup rendered="#{empty v2PropositionBean.selectedDraft.synonymChanges}">
                            <h:outputText value="....." style="font-size:14px;"/>
                        </h:panelGroup>
                        <ui:repeat var="change" value="#{v2PropositionBean.selectedDraft.synonymChanges}">
                            <h:panelGroup rendered="#{change.add}">
                                <h:outputText value="[#{change.lang.toUpperCase()}] " style="font-size:14px; color:green; font-weight:bold;"/>
                                <h:outputText value="#{change.value}" style="font-size:14px; color:green;"/><br/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{change.update}">
                                <h:outputText value="[#{change.lang.toUpperCase()}] " style="font-size:14px; color:blue; font-weight:bold;"/>
                                <h:outputText value="#{change.value} " style="font-size:14px; color:blue;"/>
                                <h:outputText value="(#{change.oldValue})" style="font-size:14px; color:blue;"/><br/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{change.delete}">
                                <h:outputText value="[#{change.lang.toUpperCase()}] "
                                              style="font-size:14px; color:red; font-weight:bold; text-decoration:line-through;"/>
                                <h:outputText value="#{change.value}"
                                              style="font-size:14px; color:red; text-decoration:line-through;"/><br/>
                            </h:panelGroup>
                        </ui:repeat>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ui:fragment>
