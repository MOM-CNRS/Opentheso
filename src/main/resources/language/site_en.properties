import.listCsv.help=Terms must have a separator (comma, semi-colon or tabulated) in the file to be uploaded. For fields that allow multiple values, they must be separated by (##) e.g. (two##2). If the identifier already exists in the thesaurus, the concept to be imported will be rejected. The uri column and the identifier are mandatory. If you want to retrieve a hierarchy using the (skos:broader) column, this is also possible.
