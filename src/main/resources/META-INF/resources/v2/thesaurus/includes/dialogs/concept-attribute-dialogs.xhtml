<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2EditNotationDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.notation')}"
              widgetVar="v2EditNotationDlg" width="500" modal="true" resizable="false" position="top">
        <h:form id="v2EditNotationForm">
            <p:defaultCommand target="v2EditNotationSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptAttributeEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4" style="margin-top:6px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notation')} :"/>
                </div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptAttributeEditorBean.notation}"
                                 placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.new_notation')}..."
                                 style="width:100%;"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2EditNotationDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2EditNotationSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptAttributeEditorBean.submitUpdateNotation()}"
                                 update="v2EditNotationForm :containerIndex:rightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2EditConceptTypeDlg" header="#{v2LocaleBean.getMsg('concept.editConceptType')}"
              widgetVar="v2EditConceptTypeDlg" width="550" modal="true" resizable="false" position="top">
        <h:form id="v2EditConceptTypeForm">
            <p:defaultCommand target="v2EditConceptTypeSubmit"/>
            <div class="row mb-2">
                <div class="col-4 text-right" style="margin-top:6px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} :"/>
                </div>
                <div class="col-8">
                    <h:outputText value="#{v2ConceptAttributeEditorBean.currentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right" style="margin-top:6px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('statistique.type')} :"/>
                </div>
                <div class="col-8">
                    <p:selectOneMenu value="#{v2ConceptAttributeEditorBean.selectedConceptType}" style="width:100%;">
                        <f:selectItems value="#{v2ConceptAttributeEditorBean.availableConceptTypes}" var="conceptType"
                                       itemLabel="#{v2ConceptAttributeEditorBean.formatConceptTypeOption(conceptType)}"
                                       itemValue="#{conceptType.code}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-8 offset-4">
                    <p:selectBooleanCheckbox value="#{v2ConceptAttributeEditorBean.applyConceptTypeToBranch}"
                                             itemLabel="#{v2LocaleBean.getMsg('concept.changeTypeBranch')}"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2EditConceptTypeDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2EditConceptTypeSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptAttributeEditorBean.submitUpdateConceptType()}"
                                 update="v2EditConceptTypeForm :containerIndex:rightTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
