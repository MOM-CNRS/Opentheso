<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="v2AddManualAlignmentDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.add_alignment_manual')}"
              widgetVar="v2AddManualAlignment" width="500" modal="true" resizable="false">
        <h:form>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedConcept.summary.preferredLabel}"
                                  style="color: #C63632; font-weight: bold;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.equivalence_type')}"/></div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptAlignmentBean.manualAlignmentType}" style="width:100%">
                        <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                       itemLabel="#{type.label} (#{type.labelSkos})" itemValue="#{type.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.distant_uri')}"/></div>
                <div class="col-7"><p:inputText value="#{v2ConceptAlignmentBean.manualAlignmentUri}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.source_name')}"/></div>
                <div class="col-7"><p:inputText value="#{v2ConceptAlignmentBean.manualAlignmentSource}" style="width:100%"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptAlignmentBean.addManualAlignment()}" process="@form"
                                 update=":containerIndex:conceptSummaryPanel messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2EditAlignmentDlg" header="Modifier l'alignement" widgetVar="v2EditAlignment"
              width="500" modal="true" resizable="false">
        <h:form>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.equivalence_type')}"/></div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptAlignmentBean.editAlignmentType}" style="width:100%">
                        <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                       itemLabel="#{type.label} (#{type.labelSkos})" itemValue="#{type.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="URI"/></div>
                <div class="col-7"><p:inputText value="#{v2ConceptAlignmentBean.editAlignmentUri}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.source_name')}"/></div>
                <div class="col-7"><p:inputText value="#{v2ConceptAlignmentBean.editAlignmentSource}" style="width:100%"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptAlignmentBean.updateAlignment()}" process="@form"
                                 update=":containerIndex:conceptSummaryPanel messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteAlignmentDlg" header="Confirmer la suppression" widgetVar="v2DeleteAlignment"
              width="450" modal="true" resizable="false">
        <h:form>
            <h:outputText value="#{v2LocaleBean.getMsg('candidat.alignement.delete_confirm')}"/>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-danger"
                                 actionListener="#{v2ConceptAlignmentBean.deleteAlignment()}"
                                 oncomplete="PF('v2DeleteAlignment').hide();"
                                 update=":containerIndex:conceptSummaryPanel messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
