<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

  <h:panelGroup rendered="#{v2ThesaurusBrowseBean.hasFacetNotesOfType(noteType)}">
    <div class="list-group-item list-group-item-action">
      <div class="row" style="margin-left:0; margin-bottom:5px; margin-top:10px;">
        <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
          <h:outputText value="#{v2LocaleBean.getMsg(noteMessageKey)}"
                        title="#{v2LocaleBean.getMsg(noteMessageKey)}"
                        style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
        </div>
        <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
          <h:panelGroup rendered="#{v2FacetNoteEditorBean.noteActionsAvailable}">
            <p:menuButton icon="fas fa-cog"
                          style="color:#F7A269; background:none; border:none; box-shadow:none; font-size:12px;">
              <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.edit_note')}"
                          icon="fas fa-edit"
                          actionListener="#{v2FacetNoteEditorBean.prepareEditNoteType(noteType)}"
                          update=":containerIndex:v2FacetManageNoteForm"
                          oncomplete="PF('v2FacetManageNoteDlg').show();"/>
              <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.delete_note')}"
                          icon="fas fa-minus"
                          actionListener="#{v2FacetNoteEditorBean.prepareDeleteNotes()}"
                          update=":containerIndex:v2FacetDeleteNoteForm"
                          oncomplete="PF('v2FacetDeleteNoteDlg').show();"/>
            </p:menuButton>
          </h:panelGroup>
          <ui:repeat value="#{v2ThesaurusBrowseBean.facetNotesOfType(noteType)}" var="note">
            <h:outputText value="#{note.value}#{note.sourceDisplay}" escape="false" style="font-size:14px;"/>
            <h:outputText value=" (#{note.lang})" style="font-size:14px; font-weight:300;"/>
            <br/>
          </ui:repeat>
        </div>
      </div>
    </div>
  </h:panelGroup>
</ui:fragment>
