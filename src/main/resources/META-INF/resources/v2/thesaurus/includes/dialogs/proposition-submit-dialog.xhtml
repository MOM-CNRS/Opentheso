<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="v2SuggestImprovementDlg" header="#{v2LocaleBean.getMsg('rightbody.suggestImprovement')}"
              widgetVar="v2SuggestImprovement" width="560" modal="true" resizable="false">
        <h:form>
            <div class="row mb-3">
                <div class="col-12">
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedConcept.summary.preferredLabel}"
                                  style="color: #C63632; font-weight: bold; font-size: 1.1rem;"/>
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('profile.name')}"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2PropositionSubmitBean.authorName}" style="width: 100%;"/>
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-4"><h:outputText value="Email"/></div>
                <div class="col-8">
                    <p:inputText value="#{v2PropositionSubmitBean.authorEmail}" style="width: 100%;"/>
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('proposition.commentaire')}"/></div>
                <div class="col-8">
                    <p:inputTextarea value="#{v2PropositionSubmitBean.comment}" rows="6" style="width: 100%;"
                                     autoResize="false"/>
                </div>
            </div>

            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2SuggestImprovement').hide();"
                                 style="margin-right: 8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 icon="pi pi-send" process="@form"
                                 actionListener="#{v2PropositionSubmitBean.submit()}"
                                 update="@form messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
