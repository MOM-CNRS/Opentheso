<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

  <p:dialog id="v2HistoricalView" header="#{v2LocaleBean.getMsg('rightbody.concept.view_change_history')}"
            widgetVar="v2HistoricalView" modal="true" resizable="true" position="top" width="850"
            style="margin-top:30px; font-size:12px;">

    <p:scrollPanel mode="native" style="min-height:300px; max-height:700px; border:#FAFAFA; background-color:#FFFFFF; font-size:12px;">

      <div class="row">
        <div class="col-12">
          <p:dataTable value="#{v2ConceptHistoryBean.overview != null ? v2ConceptHistoryBean.overview.labels : null}" var="label"
                       scrollable="true" scrollHeight="250" style="font-size:12px;">
            <f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.labelHistory')}"/>
            </f:facet>
            <p:column headerText="#{v2LocaleBean.getMsg('candidat.value')}"><h:outputText value="#{label.value}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"><h:outputText value="#{label.lang}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('profile.action')}"><h:outputText value="#{label.action}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.modification_date')}"><h:outputText value="#{label.date}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.user')}"><h:outputText value="#{label.user}"/></p:column>
          </p:dataTable>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col-12">
          <p:dataTable value="#{v2ConceptHistoryBean.overview != null ? v2ConceptHistoryBean.overview.synonyms : null}" var="synonym"
                       scrollable="true" scrollHeight="250" style="font-size:12px;">
            <f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.synonymHistory')}"/>
            </f:facet>
            <p:column headerText="#{v2LocaleBean.getMsg('candidat.value')}"><h:outputText value="#{synonym.value}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"><h:outputText value="#{synonym.lang}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('profile.action')}"><h:outputText value="#{synonym.action}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.modification_date')}"><h:outputText value="#{synonym.date}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.user')}"><h:outputText value="#{synonym.user}"/></p:column>
          </p:dataTable>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col-12">
          <p:dataTable value="#{v2ConceptHistoryBean.overview != null ? v2ConceptHistoryBean.overview.notes : null}" var="note"
                       scrollable="true" scrollHeight="250" style="font-size:12px;">
            <f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.noteHistory')}"/>
            </f:facet>
            <p:column headerText="#{v2LocaleBean.getMsg('candidat.value')}"><h:outputText value="#{note.value}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"><h:outputText value="#{note.lang}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('profile.action')}"><h:outputText value="#{note.action}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.modification_date')}"><h:outputText value="#{note.date}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.user')}"><h:outputText value="#{note.user}"/></p:column>
          </p:dataTable>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col-12">
          <p:dataTable value="#{v2ConceptHistoryBean.overview != null ? v2ConceptHistoryBean.overview.relations : null}" var="relation"
                       scrollable="true" scrollHeight="250" style="font-size:12px;">
            <f:facet name="header" xmlns:f="http://xmlns.jcp.org/jsf/core">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.relationshipHistory')}"/>
            </f:facet>
            <p:column headerText="#{v2LocaleBean.getMsg('profile.action')}"><h:outputText value="#{relation.action}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.relationship')}"><h:outputText value="#{relation.role}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.modification_date')}"><h:outputText value="#{relation.date}"/></p:column>
            <p:column headerText="#{v2LocaleBean.getMsg('statistique.user')}"><h:outputText value="#{relation.user}"/></p:column>
          </p:dataTable>
        </div>
      </div>

    </p:scrollPanel>
  </p:dialog>
</ui:fragment>
