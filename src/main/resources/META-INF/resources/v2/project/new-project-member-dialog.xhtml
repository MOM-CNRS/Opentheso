<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2NewProjectMember"
              header="#{langueBean.getMsg('profile.new_userOnProject')}"
              widgetVar="v2NewProjectMember"
              width="650" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top: 30px">

        <h:form id="v2NewProjectMemberForm">
            <p:defaultCommand target="v2AddMemberBtn"/>

            <div class="row">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.pseudo')} *"
                                  title="#{langueBean.getMsg('profile.tootltip_user')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2MyProjectsBean.memberUsername}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.email')} *"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2MyProjectsBean.memberEmail}" style="width: 100%" autocomplete="off"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.institution')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2MyProjectsBean.memberInstitution}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="margin-top: 10px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.account_creation_method')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneRadio value="#{v2MyProjectsBean.memberCreationMode}" layout="lineDirection">
                        <f:selectItem itemLabel="#{langueBean.getMsg('profile.localPassword')}" itemValue="DIRECT"/>
                        <f:selectItem itemLabel="#{langueBean.getMsg('profile.emailValidation')}" itemValue="EMAIL"/>
                        <p:ajax listener="#{v2MyProjectsBean.updateMemberPasswordFields()}"
                                update="v2NewProjectMemberForm:passwordChoice"/>
                    </p:selectOneRadio>
                </div>
            </div>

            <h:panelGroup id="passwordChoice">
                <h:panelGroup id="passwordSection" rendered="#{v2MyProjectsBean.memberCreationMode eq 'DIRECT'}">
                    <div class="row" style="margin-top: 5px;">
                        <div class="col-5" style="text-align: right">
                            <h:outputText value="#{langueBean.getMsg('menu.password')} *"/>
                        </div>
                        <div class="col-7">
                            <p:password id="password1" value="#{v2MyProjectsBean.memberPassword1}"
                                        style="width:100%" autocomplete="off"
                                        feedback="true"
                                        promptLabel="#{langueBean.getMsg('password.prompt')}"
                                        weakLabel="#{langueBean.getMsg('password.weak')}"
                                        goodLabel="#{langueBean.getMsg('password.good')}"
                                        strongLabel="#{langueBean.getMsg('password.strong')}">
                                <f:validator validatorId="passwordValidator"/>
                            </p:password>
                            <p:message for="password1"/>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 5px;">
                        <div class="col-5" style="text-align: right">
                            <h:outputText
                                    value="#{langueBean.getMsg('profile.confirmation')} #{langueBean.getMsg('menu.password')} * "/>
                        </div>
                        <div class="col-7">
                            <p:password value="#{v2MyProjectsBean.memberPassword2}" style="width: 100%" autocomplete="off"/>
                        </div>
                    </div>
                </h:panelGroup>
            </h:panelGroup>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.alert_by_email')}"
                                  title="#{langueBean.getMsg('profile.alert_by_emailTooltip')}"/>
                </div>
                <div class="col-7">
                    <p:toggleSwitch id="isAlertMail" value="#{v2MyProjectsBean.memberAlertMail}" onIcon="pi pi-times"
                                    offIcon="pi pi-check"/>
                </div>
                <p:tooltip value="#{langueBean.getMsg('profile.alert_by_emailTooltip')}" showDelay="500"
                           for="isAlertMail"/>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{langueBean.getMsg('profile.currentProject')}" style="font-size: 12px;"/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2MyProjectsBean.selectedProjectName}"/>
                </div>
            </div>

            <h:panelGroup id="userRoleDef">
                <div class="row" style="margin-top: 5px;">
                    <div class="col-5" style="text-align: right">
                        <h:outputText value="#{langueBean.getMsg('profile.role')} "/>
                    </div>
                    <div class="col-7">
                        <p:selectOneMenu value="#{v2MyProjectsBean.memberRoleId}"
                                         styleClass="selectOneMenu_custom"
                                         panelStyleClass="selectOneMenu_panelStyle_custom"
                                         style="width: 100%; background: none; box-shadow: none;"
                                         panelStyle="border: none; box-shadow: none; max-width: 300px">
                            <p:ajax event="change" update="v2NewProjectMemberForm:userRoleDef"/>
                            <f:selectItems value="#{v2MyProjectsBean.assignableRoles}" var="role"
                                           itemLabel="#{role.name()}" itemValue="#{role.id()}"/>
                        </p:selectOneMenu>
                    </div>
                </div>

                <h:panelGroup rendered="#{v2MyProjectsBean.memberRoleLimitedSectionVisible}">
                    <div class="row" style="margin-top: 5px;">
                        <div class="col-5" style="text-align: right">
                            <h:outputText value="#{langueBean.getMsg('profile.limitRoleOnTheso')}"
                                          title="#{langueBean.getMsg('profile.limitRoleOnThesoTooltip')}"/>
                        </div>
                        <div class="col-7">
                            <p:toggleSwitch id="limitToThesaurus" value="#{v2MyProjectsBean.memberLimitOnThesaurus}"
                                            onIcon="pi pi-times" offIcon="pi pi-check">
                                <p:ajax listener="#{v2MyProjectsBean.toggleMemberLimitThesaurus()}"
                                        update="v2NewProjectMemberForm:userRoleDef"/>
                            </p:toggleSwitch>
                        </div>
                        <p:tooltip value="#{langueBean.getMsg('profile.limitRoleOnThesoTooltip')}" showDelay="500"
                                   for="limitToThesaurus"/>
                    </div>

                    <h:panelGroup rendered="#{v2MyProjectsBean.memberLimitOnThesaurus}">
                        <div class="row" style="margin-top: 5px;">
                            <div class="col-5" style="text-align: right">
                                <h:outputText value="#{langueBean.getMsg('profile.list_of_thesauri')}"
                                              style="font-size: 12px;"/>
                            </div>
                            <div class="col-7">
                                <p:selectManyMenu value="#{v2MyProjectsBean.memberThesaurusIds}"
                                                  styleClass="manymenu-advanced" showCheckbox="true"
                                                  style="width: 100%;">
                                    <f:selectItems value="#{v2MyProjectsBean.projectThesauri}" var="theso"
                                                   itemLabel="#{theso.title()} (#{theso.id()})"
                                                   itemValue="#{theso.id()}"/>
                                </p:selectManyMenu>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{langueBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 ajax="true" oncomplete="PF('v2NewProjectMember').hide();" update="idV2NewProjectMember"/>

                <p:commandButton id="v2AddMemberBtn" value="#{langueBean.getMsg('btnValidate')}"
                                 icon="pi pi-check"
                                 styleClass="ui-button-success"
                                 update="messageIndex v2NewProjectMemberForm containerIndex"
                                 action="#{v2MyProjectsBean.createMember()}"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
