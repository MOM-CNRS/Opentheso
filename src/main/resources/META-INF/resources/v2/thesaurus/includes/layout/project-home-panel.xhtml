<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <div class="container-fluid col-xl-12 col-lg-12" style="margin-top: 30px">
        <div class="card shadow mb-4">
            <h:panelGroup rendered="#{v2ConsultationProjectHomeBean.editAllowed}">
                <div class="card-header py-3" style="width: 100%; display: flex; margin-bottom: 0px">
                    <div style="width: 100%; text-align: right;">
                        <p:commandButton value="Modifier" ajax="true" process="@this"
                                         update=":containerIndex:contentConcept"
                                         styleClass="ui-button-success" icon="pi pi-check"
                                         style="font-size: 14px; margin-right: 10px;"
                                         actionListener="#{v2ConsultationProjectHomeBean.startEdit()}"/>
                    </div>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{v2ConsultationProjectHomeBean.thesauriVisible}">
                <div class="card-header py-3" style="width: 100%; display: flex;">
                    <ul aria-label="#{v2LocaleBean.getMsg('profile.list_of_thesauri')} :">
                        <ui:repeat value="#{v2ConsultationProjectHomeBean.thesauri}" var="theso">
                            <li>#{theso.displayLabel}</li>
                        </ui:repeat>
                    </ul>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{not v2ConsultationProjectHomeBean.thesauriVisible}">
                <div class="card-header py-3" style="width: 100%; text-align: center; padding: 10px">
                    <h:outputLabel value="#{v2LocaleBean.getMsg('toolbox.noThesaurus')} !"/>
                </div>
            </h:panelGroup>

            <div style="padding-left: 20px; padding-right: 20px; padding-bottom: 20px; padding-top: 10px">
                <h:panelGroup rendered="#{v2ConsultationProjectHomeBean.descriptionVisible and not v2ConsultationProjectHomeBean.editing}">
                    <div class="row" style="margin-top: 10px; margin-bottom: 10px">
                        <div class="col-12" style="display: flex">
                            <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"
                                          style="margin-right: 10px; font-weight: bold; margin-top: 3px"/>

                            <p:selectOneMenu value="#{v2ConsultationProjectHomeBean.selectedDescriptionLang}"
                                             styleClass="selectOneMenu_custom"
                                             panelStyleClass="selectOneMenu_panelStyle_custom"
                                             style="width: 250px; background: none; box-shadow: none; padding: 0rem 0.5rem; margin-right: 10px;"
                                             panelStyle="border: none; box-shadow: none; max-width: 300px">
                                <p:ajax event="change"
                                        listener="#{v2ConsultationProjectHomeBean.onDescriptionLangChange()}"
                                        update=":containerIndex:contentConcept :messageIndex"/>
                                <f:selectItems value="#{v2ConsultationProjectHomeBean.descriptionLangs}" var="lang"
                                               itemValue="#{lang.iso6391}" itemLabel="#{lang.displayLabel}"/>
                            </p:selectOneMenu>

                            <img src="#{v2ConsultationProjectHomeBean.flagUrlForSelectedDescription()}"
                                 width="25" height="20" style="margin-top: 3px" alt=""/>
                        </div>
                    </div>

                    <div class="row" style="padding-top: 4px">
                        <div class="col-12">
                            <div style="border: 1px solid #e3e6f0; border-radius: 10px; padding: 10px;">
                                <h:outputText value="#{v2ConsultationProjectHomeBean.descriptionHtml}"
                                              escape="false" style="vertical-align: center;"/>
                            </div>
                        </div>
                    </div>

                    <h:panelGroup rendered="#{v2ConsultationProjectHomeBean.editAllowed}">
                        <div class="row" style="margin-top: 15px">
                            <div class="col-4 offset-8" style="text-align: right">
                                <p:commandButton value="Supprimer"
                                                 action="#{v2ConsultationProjectHomeBean.deleteDescription()}"
                                                 ajax="true" process="@this"
                                                 update=":containerIndex:contentConcept :messageIndex"
                                                 styleClass="ui-button-success ui-button-danger" icon="pi pi-trash">
                                    <p:confirm header="Confirmation"
                                               message="Est ce que vous êtes sûr de vouloir supprimer cette description ?"
                                               icon="pi pi-info-circle"/>
                                </p:commandButton>
                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
                                                 responsive="true" width="350">
                                    <p:commandButton value="Non" type="button"
                                                     styleClass="ui-confirmdialog-no ui-button-flat"/>
                                    <p:commandButton value="Oui" type="button"
                                                     styleClass="ui-confirmdialog-yes"/>
                                </p:confirmDialog>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>

                <h:panelGroup rendered="#{v2ConsultationProjectHomeBean.editing}">
                    <div class="row" style="margin-top: 10px; margin-bottom: 10px">
                        <div class="col-12" style="display: flex">
                            <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"
                                          style="margin-right: 10px; margin-top: 3px; font-weight: bold;"/>

                            <p:selectOneMenu value="#{v2ConsultationProjectHomeBean.editLang}"
                                             styleClass="selectOneMenu_custom"
                                             panelStyleClass="selectOneMenu_panelStyle_custom"
                                             style="width: 250px; background: none; box-shadow: none; padding: 0rem 0.5rem; margin-right: 10px;"
                                             panelStyle="border: none; box-shadow: none; max-width: 300px">
                                <p:ajax event="change"
                                        listener="#{v2ConsultationProjectHomeBean.onEditLangChange()}"
                                        update=":containerIndex:contentConcept :messageIndex"/>
                                <f:selectItems value="#{v2ConsultationProjectHomeBean.allLangs}" var="lang"
                                               itemValue="#{lang.iso6391}" itemLabel="#{lang.displayLabel}"/>
                            </p:selectOneMenu>

                            <img src="#{v2ConsultationProjectHomeBean.flagUrlForEditLang()}"
                                 width="25" height="20" style="margin-top: 3px" alt=""/>
                        </div>
                    </div>

                    <p:textEditor value="#{v2ConsultationProjectHomeBean.editHtml}" secure="false" height="300"
                                  style="margin-bottom:5px; margin-right: 5px"/>

                    <div class="row" style="margin-top: 15px">
                        <div class="col-4 offset-8" style="text-align: right">
                            <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                             styleClass="ui-button-secondary button" icon="fas fa-undo-alt"
                                             update=":containerIndex:contentConcept"
                                             style="font-size: 14px; margin-right: 20px;"
                                             actionListener="#{v2ConsultationProjectHomeBean.cancelEdit()}"/>

                            <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                             update=":containerIndex:contentConcept :messageIndex"
                                             styleClass="ui-button-success" icon="pi pi-check"
                                             style="font-size: 14px; margin-right: 10px;"
                                             actionListener="#{v2ConsultationProjectHomeBean.saveDescription()}"/>
                        </div>
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </div>

    <style type="text/css">
        ul:before {
            content: attr(aria-label);
            font-size: 120%;
            font-weight: bold;
            margin-left: -15px;
        }
    </style>

</ui:composition>
