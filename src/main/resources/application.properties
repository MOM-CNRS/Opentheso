info.application.version=@project.version@
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.liquibase.change-log=classpath:/changelog/db.changelog.xml
opentheso.home-path=/thesauri
opentheso.expire-path=/session/expire
opentheso.keepalive-path=/session/keep-alive
opentheso.public-base-url=${OPENTHESO_PUBLIC_BASE_URL:http://localhost:8099}
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=260MB
server.tomcat.max-http-form-post-size=260MB
server.tomcat.max-swallow-size=260MB
