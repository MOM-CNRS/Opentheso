sonar.projectKey=opentheso
sonar.projectName=OpenTheso (v2)
sonar.projectVersion=26.07.02

sonar.host.url=http://localhost:9000

# Analyse limitée au nouveau package v2 uniquement
sonar.sources=src/main/java/fr/cnrs/opentheso/v2
sonar.tests=src/test/java/fr/cnrs/opentheso/v2
sonar.inclusions=src/main/java/fr/cnrs/opentheso/v2/**
sonar.test.inclusions=src/test/java/fr/cnrs/opentheso/v2/**

sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.sourceEncoding=UTF-8

# Exclusions globales
sonar.exclusions=**/target/**,**/*.xhtml,**/*.xml,**/*.sql,**/*.properties,**/*.yaml,**/*.yml

# Sécurité : n'analyser que le code sous v2 (hors legacy fr.cnrs.opentheso.*)
sonar.inclusions=src/main/java/fr/cnrs/opentheso/v2/**

# Couverture JaCoCo : couche métier V2 (service / policy / mapper / repository)
# sonar.coverage.inclusions n'est pas appliqué par le scanner ; on exclut UI/moteurs/IO.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/AlignmentPropositionEnricher.java,**/ConceptCorpusSearchService.java,**/ui/**,**/*Bean.java,**/*Engine.java,**/persistence/**,**/model/**,**/workshop/**,**/config/**,**/*Controller.java,**/edition/io/**,**/candidat/alignment/**
