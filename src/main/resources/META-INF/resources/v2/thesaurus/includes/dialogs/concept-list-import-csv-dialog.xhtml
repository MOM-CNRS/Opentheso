<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2ListImportCsvDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.import_tabulated_list')}"
              widgetVar="v2ListImportCsvDlg" width="700" modal="true" resizable="true" position="top">
        <h:form id="v2ListImportCsvForm" enctype="multipart/form-data">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="importer sous :" style="font-size: 13px;"/>
                    <h:outputText value=" #{v2ConceptListCsvImportBean.parentConceptLabel}"
                                  style="font-size: 13px; color: #C63632;"/>
                </div>
            </div>

            <p:outputPanel style="font-size: 12px; margin-bottom: 10px;">
                <p>#{v2LocaleBean.getMsg('import.simpleListCsv.help')}</p>
            </p:outputPanel>

            <div class="row mb-2">
                <div class="col-3">
                    <h:outputText value="#{v2LocaleBean.getMsg('import.separatedValue')}:" style="font-size: 12px;"/>
                </div>
                <div class="col-3">
                    <p:selectOneMenu value="#{v2ConceptListCsvImportBean.choiceDelimiter}" style="width: 100%;">
                        <f:selectItem itemLabel="," itemValue="0"/>
                        <f:selectItem itemLabel=";" itemValue="1"/>
                        <f:selectItem itemLabel="\t" itemValue="2"/>
                        <p:ajax event="change" listener="#{v2ConceptListCsvImportBean.actionChoice()}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <h:panelGroup id="v2PanelListCsv">
                <div class="row mb-2">
                    <div class="col-12">
                        <p:fileUpload listener="#{v2ConceptListCsvImportBean.loadFileCsvList}"
                                      label="#{v2LocaleBean.getMsg('candidat.parcourir')}"
                                      mode="advanced" auto="true"
                                      styleClass="browserbutton"
                                      update="v2PanelListCsv"
                                      disabled="#{v2ConceptListCsvImportBean.loadDone}">
                                      <p:validateFile allowTypes="/(\.|\/)(csv|txt)$/"/>
                        </p:fileUpload>
                    </div>
                </div>

                <h:panelGroup rendered="#{v2ConceptListCsvImportBean.loadDone}">
                    <div class="row" style="font-size: 12px;">
                        <div class="col-12">
                            <h:outputText value="URI: "/>
                            <h:outputText value="#{v2ConceptListCsvImportBean.uri}" style="color: #C63632"/>
                        </div>
                        <div class="col-12">
                            <h:outputText value="Total des concepts: "/>
                            <h:outputText value="#{v2ConceptListCsvImportBean.total}" style="color: #C63632"/>
                        </div>
                    </div>
                </h:panelGroup>

                <div style="width: 100%; text-align: right; margin-top: 10px;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}"
                                     icon="fas fa-undo-alt" styleClass="ui-button-secondary"
                                     style="margin-right: 12px"
                                     actionListener="#{v2ConceptListCsvImportBean.init()}"
                                     update="v2ListImportCsvForm"
                                     oncomplete="PF('v2ListImportCsvDlg').hide();"/>
                    <p:commandButton value="#{v2LocaleBean.getMsg('candidat.import')}"
                                     styleClass="ui-button-success" icon="fa fa-download"
                                     actionListener="#{v2ConceptListCsvImportBean.importUnderCurrentConcept()}"
                                     update="v2PanelListCsv :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                     disabled="#{!v2ConceptListCsvImportBean.loadDone}"
                                     process="@form"/>
                </div>

                <h:panelGroup rendered="#{v2ConceptListCsvImportBean.loadDone or v2ConceptListCsvImportBean.importDone}"
                              style="margin-top: 10px;">
                    <p:accordionPanel activeIndex="-1">
                        <p:tab title="Info">
                            <p:scrollPanel mode="native" style="height:120px">
                                <pre><h:outputText value="#{v2ConceptListCsvImportBean.info}"/></pre>
                                <hr/>
                                <pre><h:outputText rendered="#{!v2ConceptListCsvImportBean.warningEmpty}"
                                                   value="Warning : #{v2ConceptListCsvImportBean.warning}"/></pre>
                            </p:scrollPanel>
                        </p:tab>
                        <p:tab title="Error">
                            <p:scrollPanel mode="native" style="height:120px">
                                <pre><h:outputText value="#{v2ConceptListCsvImportBean.error}"/></pre>
                            </p:scrollPanel>
                        </p:tab>
                    </p:accordionPanel>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:fragment>
