<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
        <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
            <div class="list-group-item list-group-item-action" style="margin-top:-5px; margin-bottom:-5px;">
                <div class="row" style="margin-left:0;">
                    <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.traduction')}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f; margin-right:7px; margin-left:5px;"/>
                    </div>
                    <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                        <p:menuButton icon="fas fa-cog"
                                      style="color:#F7A269; background:none; border:none; box-shadow:none; margin-left:-37px;">
                            <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.add_traduction')}"
                                        icon="fas fa-plus"
                                        process="@this"
                                        actionListener="#{v2PropositionSubmitBean.prepareAddTranslation()}"
                                        update=":containerIndex:v2PropAddTraductionDlg"
                                        oncomplete="PF('v2PropAddTraduction').show();"/>
                            <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.edit_traduction')}"
                                        icon="fas fa-edit"
                                        process="@this"
                                        disabled="#{v2PropositionSubmitBean.translationMenuDisabled}"
                                        update=":containerIndex:v2PropRenameTraductionDlg"
                                        oncomplete="PF('v2PropRenameTraduction').show();"/>
                            <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.delete_traduction')}"
                                        icon="fas fa-minus"
                                        process="@this"
                                        disabled="#{v2PropositionSubmitBean.translationMenuDisabled}"
                                        update=":containerIndex:v2PropDeleteTraductionDlg"
                                        oncomplete="PF('v2PropDeleteTraduction').show();"/>
                        </p:menuButton>

                        <h:panelGroup rendered="#{empty v2PropositionSubmitBean.translationOptions}">
                            <h:outputText value="....." title="#{v2LocaleBean.getMsg('rightbody.concept.no_value')}"/>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{not empty v2PropositionSubmitBean.translationOptions}">
                            <ui:repeat var="trad" value="#{v2PropositionSubmitBean.translationOptions}">
                                <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(trad.lang)}"
                                     width="20" height="15" style="margin-right:10px;" alt=""/>

                                <h:outputText value="#{trad.value}"
                                              rendered="#{!trad.toAdd and !trad.toRemove and !trad.toUpdate}"
                                              style="font-size:14px;"/>
                                <h:outputText value="#{trad.value}"
                                              rendered="#{trad.toAdd}"
                                              style="font-size:14px; color:green;"/>
                                <h:panelGroup rendered="#{trad.toUpdate}">
                                    <h:outputText value="#{trad.value} " style="font-size:14px; color:blue;"/>
                                    <h:outputText value="(#{trad.oldValue})"
                                                  style="font-size:14px; color:blue; font-weight:bold; text-decoration:line-through;"/>
                                </h:panelGroup>
                                <h:outputText value="#{trad.value}"
                                              rendered="#{trad.toRemove}"
                                              style="font-size:14px; text-decoration:line-through; color:red;"/>
                                <br/>
                            </ui:repeat>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ui:fragment>
