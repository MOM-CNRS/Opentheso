<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:p="http://primefaces.org/ui">

    <p:tree id="#{treeId}"
            value="#{treeRoot}"
            var="nodetree"
            dynamic="true"
            cache="#{v2ThesaurusBrowseBean.treeCacheEnabled}"
            selectionMode="single"
            selection="#{v2ThesaurusBrowseBean.selectedNode}"
            style="width:auto; border:none; min-height:925px; max-height:925px; overflow:auto; font-size:12px;">
        <f:attribute name="treeMode" value="#{treeMode}"/>
        <p:ajax event="expand" listener="#{v2ThesaurusBrowseBean.onNodeExpand}"/>
        <p:ajax event="select"
                listener="#{v2ThesaurusBrowseBean.onNodeSelect}"
                update="indexTitle containerIndex:formRightTab containerIndex:tabTree messageIndex"/>

        <p:treeNode expandedIcon="pi pi-folder-open"
                    collapsedIcon="pi pi-folder">
            <h:outputText value="#{nodetree.notation} "
                          style="color:blue; font-size:12px;"
                          rendered="#{not empty nodetree.notation}"/>
            <h:outputText value="#{nodetree.label}" style="font-size:12px;"/>
        </p:treeNode>

        <p:treeNode type="group"
                    expandedIcon="fa-solid fa-object-ungroup fa_custom_open"
                    collapsedIcon="fa-solid fa-object-group fa_custom_collapse">
            <h:outputText value="#{nodetree.notation} "
                          style="color:blue; font-size:12px;"
                          rendered="#{not empty nodetree.notation}"/>
            <h:outputText value="#{nodetree.label}" style="font-size:12px;"/>
        </p:treeNode>

        <p:treeNode type="subGroup"
                    expandedIcon="fa-solid fa-object-ungroup fa_custom_open"
                    collapsedIcon="fa-solid fa-object-group fa_custom_collapse">
            <h:outputText value="#{nodetree.notation} "
                          style="color:blue; font-size:12px;"
                          rendered="#{not empty nodetree.notation}"/>
            <h:outputText value="#{nodetree.label}" style="font-size:12px;"/>
        </p:treeNode>

        <p:treeNode type="file"
                    icon="pi pi-file-o pi_custom_file">
            <h:outputText value="#{nodetree.notation} "
                          style="color:blue; font-size:12px;"
                          rendered="#{not empty nodetree.notation}"/>
            <h:outputText value="#{nodetree.label}" style="font-size:12px;"/>
        </p:treeNode>
    </p:tree>
</ui:fragment>
