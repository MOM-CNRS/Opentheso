<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2ResetPassword" header="#{langueBean.getMsg('password.reset')}" widgetVar="v2ResetPassword"
              width="450" modal="true" resizable="false" position="top">
        <h:form id="v2ResetPasswordForm">
            <div class="row mb-2">
                <div class="col-5 text-right"><h:outputText value="#{langueBean.getMsg('menu.password')} *"/></div>
                <div class="col-7"><p:password value="#{v2AllUsersBean.resetPassword}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 text-right"><h:outputText value="#{langueBean.getMsg('profile.confirmation')}"/></div>
                <div class="col-7"><p:password value="#{v2AllUsersBean.resetPasswordConfirmation}" style="width:100%"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{langueBean.getMsg('btnValidate')}" icon="pi pi-check"
                                 action="#{v2AllUsersBean.resetUserPassword()}" update=":messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
