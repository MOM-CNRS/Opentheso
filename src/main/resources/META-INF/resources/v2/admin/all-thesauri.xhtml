<!DOCTYPE HTML>
<HTML xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:viewAction action="#{v2ConsultationShellBean.load()}"/>
    <f:viewAction action="#{v2AllThesauriBean.load()}"/>
</f:metadata>

<h:head>
    <title>Opentheso</title>
    <link href="../../resources/img/icon_opentheso2.png" rel="icon"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/all.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css"/>
    <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/v4-shims.css"/>
</h:head>

<h:body id="page-top" onload="initMenu()" style="margin:0; padding:0; height:100%;">
    <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>

    <h:panelGroup rendered="#{v2UserSession.isLoggedIn() and v2UserSession.canAccessSuperAdminScreen()}"
                  id="wrapper" style="height: 100%">
        <ui:include src="../thesaurus/includes/layout/menu.xhtml"/>

        <div id="content-wrapper" style="min-height:100%; position:relative;">
            <h:form id="containerIndex">
                <h:panelGroup id="header">
                    <ui:include src="../thesaurus/includes/layout/header.xhtml"/>
                </h:panelGroup>

                <div class="container-fluid" style="padding-bottom: 70px">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin: 20px">
                        <h1 class="h3 mb-0 text-gray-800">#{v2LocaleBean.getMsg('menu.profile')} / <span
                                style="color: #f47b2a">#{v2LocaleBean.getMsg('profile.all_thesauri')}</span></h1>
                    </div>

                    <div class="card shadow mb-4" style="height: 100%;">
                        <div class="card mb-4 py-3 border-left-success"
                             style="margin-top: 5px; vertical-align: central; margin: 30px">
                            <p:dataTable value="#{v2AllThesauriBean.thesauri}" var="theso" size="small"
                                         widgetVar="listThesoTable" styleClass="products-table"
                                         resizableColumns="true" scrollHeight="450" reflow="true"
                                         paginator="true" rows="10" paginatorPosition="bottom"
                                         emptyMessage="#{v2LocaleBean.getMsg('toolbox.noThesaurus')}"
                                         stripedRows="true"
                                         style="margin-bottom: -17px; margin-top: -16px;">
                                <f:facet name="header">
                                    <div class="products-table-header">
                                        <span style="font-weight: bold">#{v2LocaleBean.getMsg('profile.list_of_thesauri')}</span>
                                    </div>
                                </f:facet>
                                <p:column width="10" headerText="Id" sortBy="#{theso.id()}">
                                    <h:outputText value="#{theso.id()}" style="font-weight: bold"/>
                                </p:column>
                                <p:column width="40" headerText="#{v2LocaleBean.getMsg('menu.thesaurus')}" sortBy="#{theso.title()}">
                                    <h:outputText rendered="#{!theso.privateThesaurus()}" value="#{theso.title()}"/>
                                    <h:outputText rendered="#{theso.privateThesaurus()}" value="#{theso.title()}"
                                                  style="color: red; font-style: italic"/>
                                </p:column>
                                <p:column width="50" headerText="#{v2LocaleBean.getMsg('profile.project')}" sortBy="#{theso.projectName()}">
                                    <h:outputText value="#{theso.projectName()}"/>
                                </p:column>
                                <p:column width="10" headerText="#{v2LocaleBean.getMsg('toolbox.publicPrivate')}">
                                    <p:toggleSwitch disabled="true" value="#{theso.privateThesaurus()}"/>
                                </p:column>
                                <p:column width="1" headerText="#{v2LocaleBean.getMsg('profile.action')}" style="text-align: center">
                                    <p:commandButton icon="fas fa-people-carry" styleClass="edit-button rounded-button"
                                                     process="@this" ajax="true"
                                                     title="#{v2LocaleBean.getMsg('profile.move_thesaurus_to_another_project')}"
                                                     update=":containerIndex:idV2MoveThesaurus :containerIndex:v2MoveThesaurusForm"
                                                     oncomplete="PF('v2MoveThesaurus').show();"
                                                     actionListener="#{v2AllThesauriBean.prepareMoveDialog(theso.id(), theso.title())}"/>
                                </p:column>
                                <f:facet name="footer">
                                    <span class="p-text-bold">
                                        <h:outputText value="#{v2LocaleBean.getMsg('toolbox.totalOfTheso')} : " style="font-size: 14px;"/>
                                        <h:outputText value="#{v2AllThesauriBean.thesauri.size()}" style="font-size: 16px; color: #f47b2a"/>
                                    </span>
                                </f:facet>
                            </p:dataTable>
                        </div>

                        <ui:include src="move-thesaurus-dialog.xhtml"/>
                    </div>
                </div>

                <input type="hidden" name="csrfToken" value="#{sessionScope.CSRF_TOKEN}"/>
            </h:form>

            <ui:include src="../thesaurus/includes/layout/footer.xhtml"/>
            <ui:include src="../thesaurus/includes/layout/logout-dialog.xhtml"/>
            <ui:include src="../thesaurus/includes/layout/login-dialog.xhtml"/>
            <ui:include src="../thesaurus/includes/layout/forget-password-dialog.xhtml"/>
        </div>
    </h:panelGroup>
</h:body>
</HTML>
