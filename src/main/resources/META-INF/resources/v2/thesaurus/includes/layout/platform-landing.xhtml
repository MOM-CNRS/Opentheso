<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui">

    <div class="container-fluid col-xl-12 col-lg-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3" style="width:100%; display:flex; margin-bottom:0;">
                <div style="width:100%; text-align:right;">
                    <h:panelGroup rendered="#{v2PlatformHomeEditorBean.actionsAvailable}">
                        <p:selectOneMenu value="#{v2PlatformHomeEditorBean.selectedOption}" style="color:#000;">
                            <p:ajax event="valueChange"
                                    listener="#{v2PlatformHomeEditorBean.onOptionChange()}"
                                    update=":containerIndex:contentConcept :messageIndex"/>
                            <f:selectItem itemLabel="Actions ..." itemValue="Option1"/>
                            <f:selectItem itemLabel="#{v2LocaleBean.getMsg('index.modifyHomepage')}" itemValue="Option2"/>
                            <f:selectItem itemLabel="Code Analytics" itemValue="Option3"/>
                        </p:selectOneMenu>
                        <i class="fa-regular fa-pen-to-square" style="font-size:18px; margin-left:10px; padding-top:4px;"/>
                    </h:panelGroup>
                </div>
            </div>

            <div class="card-body">
                <!-- Contenu public -->
                <h:panelGroup rendered="#{v2PlatformHomeEditorBean.textVisible}">
                    <h:outputText value="#{v2ConsultationShellBean.platformHomeHtml}" escape="false" style="font-size:14px;"/>
                </h:panelGroup>

                <!-- Édition Google Analytics -->
                <h:panelGroup rendered="#{v2PlatformHomeEditorBean.editingGoogleAnalytics}">
                    <p:inputTextarea value="#{v2PlatformHomeEditorBean.codeGoogleAnalytics}"
                                     style="width:100%; min-height:300px;"/>
                    <div style="width:100%; display:flex;">
                        <div style="width:100%; text-align:right; margin-top:20px;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                             styleClass="ui-button-secondary button"
                                             icon="fas fa-undo-alt"
                                             style="font-size:14px; margin-right:20px;"
                                             process="@this"
                                             actionListener="#{v2PlatformHomeEditorBean.cancel()}"
                                             update=":containerIndex:contentConcept :messageIndex"/>
                            <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                             icon="pi pi-check"
                                             styleClass="ui-button-success"
                                             process="@form"
                                             actionListener="#{v2PlatformHomeEditorBean.saveGoogleAnalytics()}"
                                             update=":containerIndex:contentConcept :messageIndex"/>
                        </div>
                    </div>
                </h:panelGroup>

                <!-- Édition page d'accueil -->
                <h:panelGroup rendered="#{v2PlatformHomeEditorBean.editingHomePage}">
                    <div style="width:100%; display:flex; margin-bottom:10px;">
                        <div style="width:50%;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('thesohome.interpretedHTMLView')}"
                                             styleClass="ui-button-success"
                                             process="@this"
                                             action="#{v2PlatformHomeEditorBean.setViewPlainTextTo(false)}"
                                             update=":containerIndex:contentConcept"/>
                        </div>
                        <div style="width:50%; text-align:right;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('thesohome.rawHTMLView')}"
                                             styleClass="ui-button-success"
                                             process="@this"
                                             action="#{v2PlatformHomeEditorBean.setViewPlainTextTo(true)}"
                                             update=":containerIndex:contentConcept"/>
                        </div>
                    </div>

                    <h:panelGroup rendered="#{not v2PlatformHomeEditorBean.plainTextView}">
                        <p:textEditor widgetVar="v2PlatformHomeEditor"
                                      value="#{v2PlatformHomeEditorBean.text}"
                                      secure="false"
                                      height="600"
                                      style="margin-bottom:5px; margin-right:5px;"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{v2PlatformHomeEditorBean.plainTextView}">
                        <p:inputTextarea value="#{v2PlatformHomeEditorBean.text}"
                                         style="width:100%; min-height:600px;"/>
                    </h:panelGroup>

                    <div class="row" style="margin-top:15px;">
                        <div class="col-4 offset-8" style="text-align:right;">
                            <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                             styleClass="ui-button-secondary button"
                                             icon="fas fa-undo-alt"
                                             style="font-size:14px; margin-right:20px;"
                                             process="@this"
                                             actionListener="#{v2PlatformHomeEditorBean.cancel()}"
                                             update=":containerIndex:contentConcept :messageIndex"/>
                            <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                             styleClass="ui-button-success"
                                             icon="pi pi-check"
                                             style="font-size:14px; margin-right:10px;"
                                             process="@form"
                                             actionListener="#{v2PlatformHomeEditorBean.saveHomePage()}"
                                             update=":containerIndex:contentConcept :messageIndex"/>
                        </div>
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </div>
</ui:composition>
