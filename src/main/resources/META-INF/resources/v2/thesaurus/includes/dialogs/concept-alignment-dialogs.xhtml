<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <!-- Dialogs hors du form principal (comme concept-identifier-dialogs) pour éviter les forms imbriqués. -->

    <p:dialog id="v2AddManualAlignmentDlg"
              header="#{v2LocaleBean.getMsg('rightbody.concept.add_alignment_manual')}"
              widgetVar="v2AddManualAlignment"
              width="500"
              modal="true"
              resizable="false"
              appendTo="@(body)">
        <h:form id="v2AddManualAlignmentForm">
            <p:defaultCommand target="v2AddManualAlignmentBtn"/>

            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.term')} : "/>
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedConcept.summary.preferredLabel}"
                                  style="color: #C63632; font-weight: bold;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.equivalence_type')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptAlignmentBean.manualAlignmentType}" style="width:100%">
                        <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                       itemLabel="#{type.label} (#{type.labelSkos})" itemValue="#{type.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.distant_uri')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptAlignmentBean.manualAlignmentUri}" style="width:100%"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.source_name')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptAlignmentBean.manualAlignmentSource}" style="width:100%"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 styleClass="ui-button-secondary"
                                 icon="fas fa-undo-alt"
                                 type="button"
                                 style="margin-right:8px;"
                                 onclick="PF('v2AddManualAlignment').hide();"/>
                <p:commandButton id="v2AddManualAlignmentBtn"
                                 value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check"
                                 actionListener="#{v2ConceptAlignmentBean.addManualAlignment()}"
                                 process="@form"
                                 update="v2AddManualAlignmentForm :containerIndex:formRightTab :messageIndex"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>

    <p:dialog id="v2EditAlignmentDlg"
              header="#{v2LocaleBean.getMsg('rightbody.concept.edit_alignment')}"
              widgetVar="v2EditAlignment"
              width="500"
              modal="true"
              resizable="false"
              appendTo="@(body)">
        <h:form id="v2EditAlignmentForm">
            <div class="row mb-2">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.equivalence_type')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptAlignmentBean.editAlignmentType}" style="width:100%">
                        <f:selectItems value="#{v2ConceptAlignmentBean.alignmentTypes}" var="type"
                                       itemLabel="#{type.label} (#{type.labelSkos})" itemValue="#{type.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5"><h:outputText value="URI"/></div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptAlignmentBean.editAlignmentUri}" style="width:100%"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.source_name')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptAlignmentBean.editAlignmentSource}" style="width:100%"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 styleClass="ui-button-secondary"
                                 type="button"
                                 style="margin-right:8px;"
                                 onclick="PF('v2EditAlignment').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check"
                                 actionListener="#{v2ConceptAlignmentBean.updateAlignment()}"
                                 process="@form"
                                 update="v2EditAlignmentForm :containerIndex:formRightTab :messageIndex"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteAlignmentDlg"
              header="#{v2LocaleBean.getMsg('profile.confirmation')}"
              widgetVar="v2DeleteAlignment"
              width="450"
              modal="true"
              resizable="false"
              appendTo="@(body)">
        <h:form id="v2DeleteAlignmentForm">
            <h:outputText value="#{v2LocaleBean.getMsg('candidat.alignement.delete_confirm')}"/>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 styleClass="ui-button-secondary"
                                 type="button"
                                 style="margin-right:8px;"
                                 onclick="PF('v2DeleteAlignment').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-danger"
                                 actionListener="#{v2ConceptAlignmentBean.deleteAlignment()}"
                                 process="@this"
                                 update="v2DeleteAlignmentForm :containerIndex:formRightTab :messageIndex"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
