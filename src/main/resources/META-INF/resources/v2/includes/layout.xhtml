<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      lang="#{v2LocaleBean.idLangue}">
<f:metadata>
  <f:viewParam name="idt" value="#{v2ThesaurusContext.idThesoFromUri}"/>
  <f:viewParam name="prop" value="#{v2PropositionBean.requestedPropositionId}"/>
  <f:viewAction action="#{v2LocaleBean.applyToView}"/>
  <f:viewAction action="#{v2ConsultationShellBean.applyThesaurusFromUrl}" onPostback="false"/>
  <f:viewAction action="#{v2ThesaurusViewBean.ensureSessionThesaurus}"/>
  <f:viewAction action="#{v2PropositionBean.refreshPendingCount}" onPostback="false"/>
  <f:viewAction action="#{v2PropositionBean.openDedicatedReview}" onPostback="false"/>
  <ui:insert name="viewActions"/>
</f:metadata>
<h:head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title><ui:insert name="title">OpenTheso</ui:insert></title>
  <base href="#{request.contextPath}/v2/"/>
  <link rel="icon" type="image/png" href="#{request.contextPath}/resources/img/O.png"/>
  <link rel="apple-touch-icon" href="#{request.contextPath}/resources/img/O.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2-prototype-recherche.css"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2.css"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2-thesaurus-picker.css"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2-instance-admin.css"/>
</h:head>
<h:body pt:data-page="#{v2Page}" pt:data-ctx="#{request.contextPath}"
      pt:data-logged-in="#{v2UserSession.loggedIn ? '1' : '0'}"
      pt:data-tree-dnd="#{v2ConceptTreeDragDropBean.cutActionsAvailable ? '1' : '0'}"
      pt:data-username="#{v2UserSession.loggedIn ? v2UserSession.currentUsername : ''}"
      pt:data-card-layout="#{v2ConceptBlockLayoutBean.layoutJson}"
      pt:data-tree-status="#{v2TreeStatusBean.selectedJson}"
      pt:data-table-cols="#{v2TableColBean.selectedJson}"
      pt:data-msg-copied="#{v2LocaleBean.getMsg('v2.copied')}"
      pt:data-msg-link="#{v2LocaleBean.getMsg('v2.home.linkPrompt')}"
      pt:data-leaflet-js="#{resource['webjars:leaflet/1.8.0/leaflet.js']}"
      pt:data-leaflet-css="#{resource['webjars:leaflet/1.8.0/leaflet.css']}">
<f:event type="preRenderView" listener="#{v2PropositionBean.openDedicatedReview}"/>
<div class="app" id="app">
  <ui:include src="/v2/includes/thesaurus.xhtml"/>
  <div class="sb-scrim" id="sbScrim" hidden="hidden" data-act="sb-dismiss"></div>
  <div class="main">
    <div class="panes">
      <ui:insert name="sidebar">
        <ui:include src="/v2/includes/sidebar.xhtml"/>
      </ui:insert>
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
           title="Glisser pour redimensionner · double-clic pour réinitialiser">
        <span class="resizer-grip"></span>
      </div>
      <main class="content">
        <div class="view" id="previewView">
          <h:panelGroup id="previewWorkLangRefresh" layout="block" styleClass="view-lang-refresh">
            <ui:insert name="main"/>
            <ui:insert name="detail">
              <ui:include src="/v2/includes/detail.xhtml"/>
            </ui:insert>
          </h:panelGroup>
        </div>
        <div class="view-rail" id="previewRail" aria-hidden="true">
          <span class="view-rail-thumb" id="previewRailThumb"></span>
        </div>
        <button type="button" class="go-top is-off" id="previewGoTop" data-act="go-top"
                title="Haut de page" aria-label="Haut de page" aria-hidden="true" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
          <span>Haut</span>
        </button>
      </main>
    </div>
  </div>
</div>
<div class="app-toast" id="appToast" hidden="hidden" role="status" aria-live="polite">
  <svg class="app-toast-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <span class="app-toast-txt"></span>
</div>
<h:outputScript library="jakarta.faces" name="faces.js"/>
<script src="#{request.contextPath}/resources/js/v2/core.js"></script>
<script src="#{request.contextPath}/resources/js/v2/settings.js"></script>
<script src="#{request.contextPath}/resources/js/v2/shell.js"></script>
<script src="#{request.contextPath}/resources/js/v2/search.js"></script>
<script src="#{request.contextPath}/resources/js/v2/tree.js"></script>
<script src="#{request.contextPath}/resources/js/v2/table.js"></script>
<script src="#{request.contextPath}/resources/js/v2/globe-ui.js"></script>
<script src="#{request.contextPath}/resources/js/v2/collections.js"></script>
<script src="#{request.contextPath}/resources/js/v2/selection.js"></script>
<script src="#{request.contextPath}/resources/js/v2/export.js"></script>
<script src="#{request.contextPath}/resources/js/v2/about.js"></script>
<script src="#{request.contextPath}/resources/js/v2/stats.js"></script>
<script src="#{request.contextPath}/resources/js/v2/shell-narrow.js"></script>
<script src="#{request.contextPath}/resources/js/v2/dialogs.js"></script>
<script src="#{request.contextPath}/resources/js/v2/add-nt.js"></script>
<script src="#{request.contextPath}/resources/js/v2/ark-progress.js"></script>
<script src="#{request.contextPath}/resources/js/v2/theso-ac.js"></script>
<script src="#{request.contextPath}/resources/js/v2/app.js"></script>
</h:body>
</html>
