<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="v2ModifyFacetDlg" header="#{v2LocaleBean.getMsg('leftbody.renamefacet')}"
              widgetVar="v2ModifyFacetDlg" width="500" modal="true" resizable="false" position="top">
        <h:form>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('statistique.label')}"/></div>
                <div class="col-8"><p:inputText value="#{v2FacetDetailEditorBean.label}" style="width:100%"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2FacetDetailEditorBean.submitModify()}"
                                 process="@form"
                                 update=":containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteFacetDlg" header="#{v2LocaleBean.getMsg('facet.deleteFacet')}"
              widgetVar="v2DeleteFacetDlg" width="450" modal="true" resizable="false" position="top">
        <h:form>
            <h:outputText value="#{v2LocaleBean.getMsg('facet.confirmDelete')}"/>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-danger"
                                 actionListener="#{v2FacetDetailEditorBean.submitDelete()}"
                                 process="@form"
                                 update=":containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddFacetTranslationDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.add_traduction')}"
              widgetVar="v2AddFacetTranslationDlg" width="500" modal="true" resizable="false" position="top">
        <h:form>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('candidat.traduction')}"/></div>
                <div class="col-8">
                    <p:selectOneMenu value="#{v2FacetDetailEditorBean.translationLang}" style="width:100%">
                        <f:selectItems value="#{v2FacetDetailEditorBean.availableTranslationLanguages}" var="lang"
                                       itemLabel="#{lang.value}" itemValue="#{lang.code}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4"><h:outputText value="#{v2LocaleBean.getMsg('statistique.label')}"/></div>
                <div class="col-8"><p:inputText value="#{v2FacetDetailEditorBean.translationValue}" style="width:100%"/></div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2FacetDetailEditorBean.submitAddTranslation()}"
                                 process="@form" update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2EditFacetTranslationsDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.edit_traduction')}"
              widgetVar="v2EditFacetTranslationsDlg" width="560" modal="true" resizable="false" position="top">
        <h:form>
            <ui:repeat value="#{v2FacetDetailEditorBean.translationsToEdit}" var="translation">
                <div class="row mb-2">
                    <div class="col-3"><h:outputText value="#{translation.lang}"/></div>
                    <div class="col-7"><p:inputText value="#{translation.value}" style="width:100%"/></div>
                    <div class="col-2">
                        <p:commandLink actionListener="#{v2FacetDetailEditorBean.submitUpdateTranslation(translation)}"
                                       process="@form" update=":containerIndex:formRightTab :messageIndex">
                            <i class="pi pi-check" style="color:#43B572;"/>
                        </p:commandLink>
                    </div>
                </div>
            </ui:repeat>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteFacetTranslationDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.delete_traduction')}"
              widgetVar="v2DeleteFacetTranslationDlg" width="450" modal="true" resizable="false" position="top">
        <h:form>
            <p:selectOneMenu value="#{v2FacetDetailEditorBean.selectedTranslationLang}" style="width:100%">
                <f:selectItems value="#{v2ThesaurusBrowseBean.selectedFacet.translations}" var="translation"
                               itemLabel="#{translation.value} (#{translation.lang})" itemValue="#{translation.lang}"/>
            </p:selectOneMenu>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-danger"
                                 actionListener="#{v2FacetDetailEditorBean.submitDeleteTranslation()}"
                                 process="@form" update=":containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddMemberToFacetDlg" header="#{v2LocaleBean.getMsg('leftbody.addExistingConcepts')}"
              widgetVar="v2AddMemberToFacetDlg" width="550" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2AddMemberToFacetForm">
            <p:defaultCommand target="v2AddMemberToFacetSubmit"/>
            <div class="row">
                <div class="col-12" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('leftbody.facet')} : "/>
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedFacet.label}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('leftbody.SearchAConcept')}"/>
                </div>
                <div class="col-7">
                    <p:autoComplete value="#{v2FacetDetailEditorBean.selectedConcept}"
                                    completeMethod="#{v2FacetDetailEditorBean.autocompleteConcept}"
                                    var="concept" forceSelection="true"
                                    minQueryLength="1"
                                    itemLabel="#{concept.prefLabel}" itemValue="#{concept}"
                                    converter="v2ConceptSearchConverter"
                                    scrollHeight="600"
                                    inputStyle="font-size:12px; width:100%; height:28px; box-shadow:none; border-color:#43B572;"
                                    style="width:100%;">
                        <p:column>
                            <h:outputText title="#{concept.conceptId}" value="#{concept.displayLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:20px; margin-bottom:5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 style="margin-right:10px;" type="button"
                                 onclick="PF('v2AddMemberToFacetDlg').hide();"/>
                <p:commandButton id="v2AddMemberToFacetSubmit"
                                 value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success" icon="pi pi-check"
                                 actionListener="#{v2FacetDetailEditorBean.submitAddMember()}"
                                 update=":containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2RemoveMembersFromFacetDlg" header="#{v2LocaleBean.getMsg('leftbody.removeFacetMembers')}"
              widgetVar="v2RemoveMembersFromFacetDlg" width="450" modal="true" resizable="false" position="top"
              style="margin-top:30px;">
        <h:form id="v2RemoveMembersFromFacetForm">
            <div class="row">
                <div class="col-12" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('leftbody.facet')} : "/>
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedFacet.label}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="card mb-4 py-3 border-left-success" style="border-color:#43B572; margin-top:10px;">
                <p:dataTable id="v2FacetMembersToDelete" size="small" var="member"
                             value="#{v2ThesaurusBrowseBean.selectedFacet.members}"
                             styleClass="products-table"
                             style="margin-bottom:-17px; margin-top:-16px;" lazy="false">
                    <p:column width="90" headerText="#{v2LocaleBean.getMsg('group.members')}">
                        <h:outputText rendered="#{not empty member.label}" value="#{member.label}"
                                      title="#{member.conceptId}" style="color:#43B572;"/>
                        <h:outputText rendered="#{empty member.label}" value="(#{member.conceptId})"
                                      style="color:#FF7979;"/>
                    </p:column>
                    <p:column width="10">
                        <p:commandLink style="color:#FF7979"
                                       actionListener="#{v2FacetDetailEditorBean.submitRemoveMember(member.conceptId)}"
                                       process="@this"
                                       update=":containerIndex:formLeftTab :containerIndex:formRightTab v2FacetMembersToDelete :messageIndex">
                            <i class="pi pi-trash"/>
                        </p:commandLink>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddChildUnderFacetDlg"
              header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_specific_concept')}"
              widgetVar="v2AddChildUnderFacetDlg" width="550" modal="true" resizable="false"
              position="top" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2AddChildUnderFacetForm">
            <p:defaultCommand target="v2AddChildUnderFacetSubmit"/>
            <div class="row">
                <div class="col-5" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.generic_term')} : "/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2FacetDetailEditorBean.parentConceptLabel}" style="font-weight:bold;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.new_concept')} : "/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2FacetDetailEditorBean.childPreferredLabel}" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.relationship')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2FacetDetailEditorBean.childNarrowerRelationType}" style="width:100%;">
                        <f:selectItems value="#{v2FacetDetailEditorBean.ntRelationTypes}" var="typesNT"
                                       itemLabel="#{typesNT.descriptionFr} (#{typesNT.relationType})"
                                       itemValue="#{typesNT.relationType}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.collection')} : "/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2FacetDetailEditorBean.childSelectedGroupId}" style="width:100%;">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2FacetDetailEditorBean.availableCollections}" var="collection"
                                       itemLabel="#{collection.label}" itemValue="#{collection.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notation')} : "/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.concept.notation')}..."
                                 value="#{v2FacetDetailEditorBean.childNotation}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.optional_identifier')} : "/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2FacetDetailEditorBean.childCustomConceptId}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('alignment.source')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2FacetDetailEditorBean.childSource}" style="width:100%;"/>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:15px; margin-bottom:5px;">
                <p:commandButton rendered="#{not v2FacetDetailEditorBean.childDuplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 style="margin-right:10px;" type="button"
                                 onclick="PF('v2AddChildUnderFacetDlg').hide();"/>
                <p:commandButton rendered="#{not v2FacetDetailEditorBean.childDuplicateLabelWarning}"
                                 id="v2AddChildUnderFacetSubmit" icon="pi pi-check" styleClass="ui-button-success"
                                 value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 actionListener="#{v2FacetDetailEditorBean.submitAddChildUnderFacet()}"
                                 update="v2AddChildUnderFacetForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
                <p:commandButton rendered="#{v2FacetDetailEditorBean.childDuplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnCancel')}" icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary button" style="margin-right:10px;"
                                 actionListener="#{v2FacetDetailEditorBean.cancelChildDuplicate()}"
                                 update="v2AddChildUnderFacetForm"
                                 oncomplete="PF('v2AddChildUnderFacetDlg').show();"
                                 process="@form"/>
                <p:commandButton rendered="#{v2FacetDetailEditorBean.childDuplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.force')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2FacetDetailEditorBean.submitAddChildUnderFacetForced()}"
                                 update="v2AddChildUnderFacetForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2ChangeFacetParentDlg" header="#{v2LocaleBean.getMsg('leftbody.modify_ParentConcept')}"
              widgetVar="v2ChangeFacetParentDlg" width="450" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2ChangeFacetParentForm">
            <div class="row">
                <div class="col-12" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2FacetDetailEditorBean.parentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_to_display_all')}"/>
                </div>
            </div>
            <div class="row" style="margin-top:3px;">
                <div class="col-12">
                    <p:autoComplete value="#{v2FacetDetailEditorBean.selectedParentConcept}"
                                    completeMethod="#{v2FacetDetailEditorBean.autocompleteConcept}"
                                    var="item" forceSelection="true"
                                    minQueryLength="1"
                                    itemLabel="#{item.prefLabel}" itemValue="#{item}"
                                    converter="v2ConceptSearchConverter"
                                    scrollHeight="300"
                                    style="width:100%; height:35px;">
                        <p:column style="font-size:12px;">
                            <h:outputText title="#{item.conceptId}" value="#{item.displayLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:15px; margin-bottom:5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 style="margin-right:10px;" type="button"
                                 onclick="PF('v2ChangeFacetParentDlg').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success" icon="pi pi-check"
                                 actionListener="#{v2FacetDetailEditorBean.submitChangeParent()}"
                                 update=":containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2CreateFacetDlg" header="#{v2LocaleBean.getMsg('rightbody.facetdialog.add_new_facet')}"
              widgetVar="v2CreateFacetDlg" width="550" showEffect="fade" modal="true" resizable="false"
              position="top" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2CreateFacetForm">
            <p:defaultCommand target="v2CreateFacetSubmit"/>
            <div class="row" style="margin-top:10px;">
                <div class="col-5" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.facet_name')}: "/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2FacetDetailEditorBean.label}" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.parent_concept')}: "/>
                </div>
                <div class="col-7">
                    <p:autoComplete value="#{v2FacetDetailEditorBean.selectedParentConcept}"
                                    completeMethod="#{v2FacetDetailEditorBean.autocompleteConcept}"
                                    var="concept" forceSelection="true" minQueryLength="1"
                                    itemLabel="#{concept.prefLabel}" itemValue="#{concept}"
                                    converter="v2ConceptSearchConverter" scrollHeight="300"
                                    style="width:100%;" inputStyle="width:100%;">
                        <p:column>
                            <h:outputText title="#{concept.conceptId}" value="#{concept.displayLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('candidat.definition')}:" style="font-size:14px;"/>
                </div>
                <div class="col-12">
                    <p:textEditor value="#{v2FacetDetailEditorBean.definition}" allowLinks="true"
                                  secure="false" height="100"
                                  style="font-size:12px; color:black; border-color:#43B572; width:100%;"
                                  placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_value')}"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-12" style="text-align:right;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" styleClass="ui-button-secondary button"
                                     icon="fas fa-undo-alt" type="button"
                                     onclick="PF('v2CreateFacetDlg').hide();" style="margin-right:10px;"/>
                    <p:commandButton id="v2CreateFacetSubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                     styleClass="ui-button-success" icon="pi pi-check"
                                     actionListener="#{v2FacetDetailEditorBean.submitCreate()}"
                                     process="@form"
                                     update="@form :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"/>
                </div>
            </div>
        </h:form>
    </p:dialog>

    <!-- Création sous le concept courant (menu hamburger fiche concept, comme legacy) -->
    <p:dialog id="v2CreateFacetUnderConceptDlg"
              header="#{v2LocaleBean.getMsg('rightbody.facetdialog.add_new_facet')}"
              widgetVar="v2CreateFacetUnderConceptDlg" width="550" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2CreateFacetUnderConceptForm">
            <p:defaultCommand target="v2CreateFacetUnderConceptSubmit"/>
            <div class="row">
                <div class="col-12" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.parent_concept')} : "/>
                    <h:outputText value="#{v2FacetDetailEditorBean.parentConceptLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-5" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.facet_name')}: "/>
                </div>
                <div class="col-7">
                    <p:inputText label="#{v2LocaleBean.getMsg('rightbody.facetdialog.facet_name')}"
                                 value="#{v2FacetDetailEditorBean.label}" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('candidat.definition')}:" style="font-size:14px;"/>
                </div>
                <div class="col-12">
                    <p:textEditor id="v2FacetDefinitionEditor" widgetVar="v2FacetDefinitionEditor"
                                  value="#{v2FacetDetailEditorBean.definition}" allowLinks="true"
                                  secure="false" height="100"
                                  style="font-size:12px; color:black; border-color:#43B572; width:100%;"
                                  placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_value')}"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px;">
                <div class="col-12" style="text-align:right;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                     style="margin-right:10px;"
                                     icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                     type="button"
                                     onclick="PF('v2CreateFacetUnderConceptDlg').hide();"/>
                    <p:commandButton id="v2CreateFacetUnderConceptSubmit"
                                     styleClass="ui-button-success"
                                     value="#{v2LocaleBean.getMsg('btnValidate')}"
                                     icon="pi pi-check"
                                     actionListener="#{v2FacetDetailEditorBean.submitCreate()}"
                                     process="@form"
                                     update="@form :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"/>
                </div>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
