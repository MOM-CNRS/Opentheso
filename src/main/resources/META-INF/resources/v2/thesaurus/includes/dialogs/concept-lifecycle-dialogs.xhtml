<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2RenameConceptDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.rename_concept')}"
              widgetVar="v2RenameConceptDlg" width="520" modal="true" resizable="false">
        <h:form id="v2RenameConceptForm">
            <p:defaultCommand target="v2RenameConceptSubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.actualName')} : "/>
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.newName')}"/>
                </div>
                <div class="col-8">
                    <p:inputText value="#{v2ConceptLifecycleEditorBean.preferredLabel}" style="width:100%;"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 actionListener="#{v2ConceptLifecycleEditorBean.cancelDuplicate()}"
                                 update="v2RenameConceptForm"
                                 oncomplete="PF('v2RenameConceptDlg').show();"
                                 process="@form" style="margin-right:8px;"/>
                <p:commandButton rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2RenameConceptDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2RenameConceptSubmit"
                                 rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitRename()}"
                                 update="v2RenameConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.force')}"
                                 styleClass="ui-button-warning"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitRenameForced()}"
                                 update="v2RenameConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"
                                 oncomplete="PF('v2RenameConceptDlg').hide();"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddChildConceptDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_specific_concept')}"
              widgetVar="v2AddChildConceptDlg" width="450" modal="true" resizable="false" position="top" style="margin-top:30px;">
        <h:form id="v2AddChildConceptForm">
            <p:defaultCommand target="v2AddChildConceptSubmit"/>
            <div class="row">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.generic_term')} : "/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="font-weight:bold;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.new_concept')} * "/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptLifecycleEditorBean.preferredLabel}" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.relationship')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptLifecycleEditorBean.selectedNarrowerRelationType}" style="width:100%;">
                        <f:selectItems value="#{v2ConceptLifecycleEditorBean.ntRelationTypes}" var="typesNT"
                                       itemLabel="#{typesNT.descriptionFr} (#{typesNT.relationType})"
                                       itemValue="#{typesNT.relationType}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.collection')}"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptLifecycleEditorBean.selectedGroupId}" style="width:100%;">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2ConceptLifecycleEditorBean.availableCollections}" var="collection"
                                       itemLabel="#{collection.label}" itemValue="#{collection.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notation')}"/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.concept.notation')}..."
                                 value="#{v2ConceptLifecycleEditorBean.notation}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.optional_identifier')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptLifecycleEditorBean.customConceptId}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('alignment.source')}"/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ConceptLifecycleEditorBean.source}" style="width:100%;"/>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:15px; margin-bottom:5px;">
                <p:commandButton rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('candidat.close')}" icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary button" style="margin-right:10px"
                                 type="button" onclick="PF('v2AddChildConceptDlg').hide();"/>
                <p:commandButton rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 id="v2AddChildConceptSubmit" icon="pi pi-check" styleClass="ui-button-success"
                                 value="#{v2LocaleBean.getMsg('btnAdd')}"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitAddChild()}"
                                 update="v2AddChildConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnCancel')}" icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary button" style="margin-right:10px"
                                 actionListener="#{v2ConceptLifecycleEditorBean.cancelDuplicate()}"
                                 update="v2AddChildConceptForm" oncomplete="PF('v2AddChildConceptDlg').show();"
                                 process="@form"/>
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.force')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitAddChildForced()}"
                                 update="v2AddChildConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddTopConceptDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.addTopConcept')}"
              widgetVar="v2AddTopConceptDlg" width="450" modal="true" resizable="false" position="top" style="margin-top:30px;">
        <h:form id="v2AddTopConceptForm">
            <p:defaultCommand target="v2AddTopConceptSubmit"/>
            <div class="row">
                <div class="col-5" style="margin-top:3px">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.topConceptName')}:"/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.concept.addTopTerm')}"
                                 value="#{v2ConceptLifecycleEditorBean.preferredLabel}" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.collection')}:"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ConceptLifecycleEditorBean.selectedGroupId}" style="width:100%;">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2ConceptLifecycleEditorBean.availableCollections}" var="collection"
                                       itemLabel="#{collection.label}" itemValue="#{collection.id}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notation')} :"/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.concept.notation')}..."
                                 value="#{v2ConceptLifecycleEditorBean.notation}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div class="row" style="margin-top:10px">
                <div class="col-5">
                    <h:outputText value="ID :"/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.optional_identifier')}..."
                                 value="#{v2ConceptLifecycleEditorBean.customConceptId}" autocomplete="false" style="width:100%;"/>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:25px; margin-bottom:5px;">
                <p:commandButton rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('candidat.close')}" icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary button" style="margin-right:10px"
                                 type="button" onclick="PF('v2AddTopConceptDlg').hide();"/>
                <p:commandButton rendered="#{not v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 id="v2AddTopConceptSubmit" value="#{v2LocaleBean.getMsg('btnAdd')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitAddTopConcept()}"
                                 update="v2AddTopConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('btnCancel')}" icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary button" style="margin-right:10px"
                                 actionListener="#{v2ConceptLifecycleEditorBean.cancelDuplicate()}"
                                 update="v2AddTopConceptForm" oncomplete="PF('v2AddTopConceptDlg').show();"
                                 process="@form"/>
                <p:commandButton rendered="#{v2ConceptLifecycleEditorBean.duplicateLabelWarning}"
                                 value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.force')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitAddTopConceptForced()}"
                                 update="v2AddTopConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteConceptDlg" header="#{v2LocaleBean.getMsg('btnDelete')}"
              widgetVar="v2DeleteConceptDlg" width="480" modal="true" resizable="false">
        <h:form id="v2DeleteConceptForm">
            <h:outputText value="Confirmer la suppression du concept sélectionné ?"
                          style="display:block; margin-bottom:12px;"/>
            <h:panelGroup rendered="#{v2ConceptSelectionContext.hasNarrowers}">
                <p:selectBooleanCheckbox value="#{v2ConceptLifecycleEditorBean.forceDeletePolyhierarchy}"/>
                <h:outputText value=" Forcer la suppression malgré la polyhiérarchie" style="margin-left:8px;"/>
            </h:panelGroup>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2DeleteConceptDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnDelete')}" styleClass="ui-button-danger"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitDelete()}"
                                 update="v2DeleteConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 oncomplete="if (!args.validationFailed) PF('v2DeleteConceptDlg').hide();"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeprecateConceptDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.deprecate_concept')}"
              widgetVar="v2DeprecateConceptDlg" width="480" modal="true" resizable="false">
        <h:form id="v2DeprecateConceptForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.nameOfConcept')} : "/>
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2DeprecateConceptDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('apply')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitDeprecate()}"
                                 update="v2DeprecateConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2ApproveConceptDlg" header="#{v2LocaleBean.getMsg('rightbody.concept.approve_concept')}"
              widgetVar="v2ApproveConceptDlg" width="520" modal="true" resizable="false">
        <h:form id="v2ApproveConceptForm">
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <h:panelGroup rendered="#{not empty v2ThesaurusBrowseBean.selectedConcept.replacedBy}">
                <div class="row mb-2">
                    <div class="col-12">
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.conceptReplacedBy')}" style="font-size:12px;"/>
                    </div>
                </div>
                <p:dataTable value="#{v2ThesaurusBrowseBean.selectedConcept.replacedBy}" var="replacedBy"
                             size="small" scrollable="true" scrollHeight="200" lazy="false">
                    <p:column headerText="idConcept" width="30%">
                        <h:outputText value="#{replacedBy.conceptId}"/>
                    </p:column>
                    <p:column headerText="label">
                        <h:outputText value="#{replacedBy.displayLabel}"/>
                    </p:column>
                </p:dataTable>
                <div class="row mt-2">
                    <div class="col-12">
                        <p:selectBooleanCheckbox value="#{v2ConceptLifecycleEditorBean.addReplacedByRelations}"/>
                        <h:outputText value=" Créer des relations associatives (RT) avec les concepts de remplacement"
                                      style="margin-left:8px; font-size:12px;"/>
                    </div>
                </div>
            </h:panelGroup>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2ApproveConceptDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('apply')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitApprove()}"
                                 update="v2ApproveConceptForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2AddReplacedByDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.replace_by')}"
              widgetVar="v2AddReplacedByDlg" width="520" modal="true" resizable="false">
        <h:form id="v2AddReplacedByForm">
            <p:defaultCommand target="v2AddReplacedBySubmit"/>
            <div class="row mb-2">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.replace_concept')} : "/>
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="color:#C63632;"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-3">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.by')} :"/>
                </div>
                <div class="col-9">
                    <p:autoComplete value="#{v2ConceptLifecycleEditorBean.replacedBySearchSelected}"
                                    var="values" style="width:100%;"
                                    forceSelection="true"
                                    completeMethod="#{v2ConceptLifecycleEditorBean.autocompleteReplacedByTarget}"
                                    minQueryLength="1" itemLabel="#{values.prefLabel}" itemValue="#{values}"
                                    converter="v2ConceptSearchConverter" scrollHeight="400"
                                    inputStyle="width:100%;">
                        <p:column rendered="#{values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.altLabel}" style="font-style:italic;"/>
                            <h:outputText title="#{values.idConcept}" value=" -&gt; #{values.prefLabel}" style="color:blue;"/>
                        </p:column>
                        <p:column rendered="#{not values.isAltLabel()}">
                            <h:outputText title="#{values.idConcept}" value="#{values.prefLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2AddReplacedByDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton id="v2AddReplacedBySubmit" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 actionListener="#{v2ConceptLifecycleEditorBean.submitAddReplacedBy()}"
                                 update="v2AddReplacedByForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2DeleteReplacedByDlg" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.delete_replaceby')}"
              widgetVar="v2DeleteReplacedByDlg" width="550" modal="true" resizable="true" position="top" style="margin-top:50px;">
        <h:form id="v2DeleteReplacedByForm">
            <div class="row">
                <div class="col-12" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.deprecated_concept')} : " style="font-size:14px;"/>
                    <h:outputText value="#{v2ConceptLifecycleEditorBean.currentPreferredLabel}" style="font-size:14px; color:#C63632;"/>
                    <h:outputText value=" #{v2LocaleBean.getMsg('rightbody.conceptdialog.is_replaced_by')} :" style="font-size:12px;"/>
                </div>
            </div>
            <p:spacer height="20"/>
            <ui:repeat value="#{v2ThesaurusBrowseBean.selectedConcept.replacedBy}" var="replaceBy">
                <div class="row" style="color:#43B572; background:#FAFAFA; font-size:14px;">
                    <div class="col-10" style="margin-left:5px; margin-top:3px;">
                        <h:outputText value="#{replaceBy.displayLabel} (#{replaceBy.conceptId})"/>
                    </div>
                    <div class="col-1" style="margin-top:3px;">
                        <p:commandLink style="color:#FF7979;"
                                       process="@form"
                                       actionListener="#{v2ConceptLifecycleEditorBean.submitDeleteReplacedBy(replaceBy.conceptId)}"
                                       update="v2DeleteReplacedByForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex">
                            <i class="pi pi-trash"/>
                        </p:commandLink>
                    </div>
                </div>
            </ui:repeat>
        </h:form>
    </p:dialog>
</ui:fragment>
