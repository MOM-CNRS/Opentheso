<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2AddLanguageDialog" header="#{langueBean.getMsg('toolbox.addLanguageToTheso')}"
              widgetVar="v2AddLanguage" width="450" showEffect="fade" modal="true" resizable="false"
              position="top" style="margin-top: 30px">

        <h:form>
            <div class="row">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('statistique.thesaurus.name')}:"/>
                </div>
                <div class="col-7">
                    <p:inputText placeholder="#{langueBean.getMsg('statistique.thesaurus.name')}"
                                 value="#{v2ModifyThesaurusBean.addLanguageEditor.title}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="margin-top: 10px">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('editTheso.langToAdd')}:"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2ModifyThesaurusBean.addLanguageEditor.selectedLanguage}"
                                     styleClass="selectOneMenu_custom"
                                     panelStyleClass="selectOneMenu_panelStyle_custom"
                                     style="width: 100%; background: none; box-shadow: none;"
                                     panelStyle="border: none; box-shadow: none; width: 200px">
                        <f:selectItems value="#{v2ModifyThesaurusBean.allLanguages}" var="lang"
                                       itemValue="#{lang.code}"
                                       itemLabel="#{lang.code} _ #{lang.frenchName} (#{lang.englishName})"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{langueBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 onclick="PF('v2AddLanguage').hide(); return false;" type="button"/>
                <p:commandButton value="#{langueBean.getMsg('btnAdd')}" update="containerIndex messageIndex"
                                 ajax="true" process="@form" styleClass="ui-button-success"
                                 oncomplete="PF('v2AddLanguage').hide();" icon="pi pi-check"
                                 actionListener="#{v2ModifyThesaurusBean.addLanguage()}"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
