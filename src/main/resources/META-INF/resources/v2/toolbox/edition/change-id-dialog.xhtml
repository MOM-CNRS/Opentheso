<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="v2ChangeThesaurusIdDialog" header="#{v2LocaleBean.getMsg('toolbox.modifyThesaurusId')}"
              widgetVar="v2ChangeThesaurusId" width="450" showEffect="fade" modal="true" resizable="false"
              position="top" style="margin-top: 30px">

        <h:form>
            <div class="row">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('toolbox.oldId')}: "/>
                </div>
                <div class="col-7">
                    <p:inputText readonly="true" value="#{v2ModifyThesaurusBean.changeIdEditor.currentId}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="margin-top: 10px;">
                <div class="col-5">
                    <h:outputText value="#{v2LocaleBean.getMsg('toolbox.newId')}: "/>
                </div>
                <div class="col-7">
                    <p:inputText value="#{v2ModifyThesaurusBean.changeIdEditor.newId}" style="width: 100%"/>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 onclick="PF('v2ChangeThesaurusId').hide(); return false;" type="button"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('apply')}" update="containerIndex messageIndex"
                                 styleClass="ui-button-success" oncomplete="PF('v2ChangeThesaurusId').hide();"
                                 process="@form" ajax="true" icon="pi pi-check"
                                 actionListener="#{v2ModifyThesaurusBean.changeThesaurusId()}"/>
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
