<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
        <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
            <div class="list-group-item list-group-item-action">
                <div class="row" style="padding:2px;">
                    <div class="col-3" style="margin-left:10px;">
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notes')}"
                                      style="color:#78261f; font-size:14px; font-weight:bold;"/>
                    </div>
                </div>
            </div>

            <ui:repeat var="entry" value="#{v2PropositionBean.noteChangeEntries}">
                <div class="list-group-item list-group-item-action">
                    <div class="row" style="margin-left:0; margin-bottom:5px;">
                        <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                            <p:selectBooleanCheckbox value="#{entry.accepted}"
                                                     title="Accepter cette proposition"
                                                     rendered="#{v2PropositionBean.showButtonDecision and v2PropositionBean.canMakeAction}"/>
                            <h:outputText value=" #{v2LocaleBean.getMsg(entry.messageKey)}"
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                        <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                            <h:panelGroup rendered="#{entry.change.add}">
                                <h:outputText value="#{entry.change.value}" style="font-size:14px; color:green;" escape="false"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{entry.change.update}">
                                <h:outputText value="#{entry.change.value} " style="font-size:14px; color:blue;" escape="false"/>
                                <h:outputText value="(#{entry.change.oldValue})"
                                              style="font-size:14px; color:blue; text-decoration:line-through;" escape="false"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{entry.change.delete}">
                                <h:outputText value="#{entry.change.oldValue}"
                                              style="font-size:14px; color:red; text-decoration:line-through;" escape="false"/>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>
            </ui:repeat>
        </div>
    </div>
</ui:fragment>
