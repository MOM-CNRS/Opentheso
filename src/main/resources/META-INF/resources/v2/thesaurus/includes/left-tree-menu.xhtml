<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

    <div class="row" style="height:28px; margin-top:-15px; margin-bottom:-20px;">
        <div class="col-xl-8 col-lg-7 col-md-6 col-sm-6">
            <h:outputText rendered="#{v2ThesaurusBrowseBean.manySiblings}"
                          value="#{v2LocaleBean.getMsg('tree.manySiblings')}"
                          title="#{v2LocaleBean.getMsg('tree.tooltip_manySiblings')}"
                          style="color:red; font-style:italic; background-color:yellow; font-size:12px;"/>
        </div>
        <div class="col-xl-1 col-lg-1 col-md-1 col-sm-1">
            <p:commandLink id="v2ReloadConceptTree"
                           process="@this" ajax="true"
                           actionListener="#{v2ThesaurusBrowseBean.reloadConceptTree()}"
                           update=":containerIndex:formLeftTab :messageIndex"
                           style="color:#F47B2A; float:right;"
                           title="#{v2LocaleBean.getMsg('menu.reload_concept')}">
                <i class="fas fa-refresh" style="color:#F47B2A; font-size:0.8rem;"/>
            </p:commandLink>
        </div>
        <div class="col-xl-1 col-lg-1 col-md-2 col-sm-3">
            <p:menuButton id="v2ConceptTreeMenuButton" icon="pi pi-align-justify"
                          styleClass="left-tree-menu-btn"
                          appendTo="@(body)">
                <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.addTopTerm')}"
                            icon="fas fa-folder-plus"
                            actionListener="#{v2ConceptLifecycleEditorBean.prepareAddTopConcept()}"
                            oncomplete="PF('v2AddTopConceptDlg').show();"
                            update="@([id$=v2AddTopConceptForm])"
                            process="@this"
                            rendered="#{v2ConceptLifecycleEditorBean.writeActionsAvailable}"/>
                <p:separator rendered="#{v2ConceptLifecycleEditorBean.writeActionsAvailable}"
                             style="border-bottom:2px solid #d8d8dc; margin-bottom:5px;"/>
                <p:menuitem rendered="#{v2ConceptTreeDragDropBean.pasteAtRootAvailable}"
                            value="#{v2LocaleBean.getMsg('rightbody.concept.paste')} #{v2ConceptTreeDragDropBean.cutLabel} #{v2LocaleBean.getMsg('rightbody.concept.at_the_root')}"
                            icon="fas fa-paste"
                            actionListener="#{v2ConceptTreeDragDropBean.pasteAtRoot()}"
                            process="@this"
                            update=":containerIndex:formLeftTab :containerIndex:formRightTab :messageIndex"/>
                <p:menuitem rendered="#{v2ConceptTreeDragDropBean.cutOn}"
                            value="#{v2LocaleBean.getMsg('rightbody.concept.cancel_copy')}"
                            icon="fas fa-undo"
                            actionListener="#{v2ConceptTreeDragDropBean.cancelCut()}"
                            process="@this"
                            update=":containerIndex:formLeftTab :containerIndex:formRightTab :messageIndex"/>
                <p:menuitem rendered="#{v2ConceptCopyBetweenThesaurusBean.pasteAvailable}"
                            value="#{v2LocaleBean.getMsg('rightbody.concept.paste')} (#{v2ConceptCopyBetweenThesaurusBean.sourceLabel}) #{v2LocaleBean.getMsg('rightbody.concept.at_the_root')} !!"
                            icon="fas fa-paste"
                            actionListener="#{v2ConceptCopyBetweenThesaurusBean.preparePasteAtRoot()}"
                            process="@this"
                            update=":containerIndex:v2CopyBetweenThesoToRootForm :messageIndex"/>
                <p:menuitem rendered="#{v2ConceptCopyBetweenThesaurusBean.copyOn}"
                            value="#{v2LocaleBean.getMsg('rightbody.concept.cancel_copy')}"
                            icon="fas fa-undo"
                            actionListener="#{v2ConceptCopyBetweenThesaurusBean.cancelCopy()}"
                            process="@this"
                            update=":containerIndex:formLeftTab :containerIndex:formRightTab :messageIndex"/>
                <p:separator rendered="#{v2ConceptTreeDragDropBean.cutOn or v2ConceptTreeDragDropBean.pasteAtRootAvailable or v2ConceptCopyBetweenThesaurusBean.copyOn}"
                             style="border-bottom:2px solid #d8d8dc; margin-bottom:5px;"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('conceptsview.view_theso_as_graph')}"
                            icon="fa-solid fa-diagram-project"
                            url="#{request.contextPath}/v2/graph/visualize/thesaurus?idtheso=#{v2ThesaurusBrowseBean.thesaurusId}"
                            target="_blank"
                            title="#{v2LocaleBean.getMsg('conceptsview.view_theso_as_graph_tooltip')}"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('conceptsview.view_branch_as_graph')}"
                            icon="fa-solid fa-folder-tree"
                            url="#{request.contextPath}/v2/graph/visualize/branch?idtheso=#{v2ThesaurusBrowseBean.thesaurusId}&amp;idc=#{v2ThesaurusBrowseBean.branchGraphConceptId}"
                            target="_blank"
                            disabled="#{not v2ThesaurusBrowseBean.branchGraphEnabled}"
                            title="#{v2LocaleBean.getMsg('conceptsview.view_branch_as_graph_tooltip')}"/>
                <p:separator style="border-bottom:2px solid #d8d8dc; margin-bottom:5px;"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.alphabetic_sort')}"
                            actionListener="#{v2ThesaurusBrowseBean.setAlphabeticSort()}"
                            ajax="true" process="@this"
                            disabled="#{not v2ThesaurusBrowseBean.sortByNotation}"
                            update=":containerIndex:formLeftTab"
                            icon="fas fa-sort-alpha-down"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.notation_sort')}"
                            actionListener="#{v2ThesaurusBrowseBean.setNotationSort()}"
                            ajax="true" process="@this"
                            disabled="#{v2ThesaurusBrowseBean.sortByNotation}"
                            update=":containerIndex:formLeftTab"
                            icon="fas fa-sort-numeric-down"/>
            </p:menuButton>
        </div>
    </div>
    <p:separator style="color:#F47B2A"/>
</ui:fragment>
