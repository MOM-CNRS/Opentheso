services:
  opentheso-db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?missing docker/.env - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - opentheso-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10

  opentheso:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: opentheso:local
    depends_on:
      opentheso-db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8099" # le container écoute toujours sur 8099 (application-prod.yaml)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CRYPTO_KEY: ${CRYPTO_KEY:?set CRYPTO_KEY in docker/.env}
      CRYPTO_OPENARK_KEY: ${CRYPTO_OPENARK_KEY:?set CRYPTO_OPENARK_KEY in docker/.env}

volumes:
  opentheso-data:
