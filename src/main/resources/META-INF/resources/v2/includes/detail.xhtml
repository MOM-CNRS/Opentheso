<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:form id="previewOpenForm" styleClass="preview-open-form">
    <h:inputHidden id="openId" value="#{v2ThesaurusViewBean.openId}"/>
    <h:inputHidden id="openType" value="#{v2ThesaurusViewBean.openType}"/>
    <h:commandButton id="openBtn" value="Ouvrir" styleClass="preview-open-btn"
                     action="#{v2ThesaurusViewBean.openSelectedNode}">
      <f:ajax execute="@form" render=":previewDetailForm:previewDetail"/>
    </h:commandButton>
  </h:form>
  <h:form id="previewTreeDropForm" styleClass="preview-open-form">
    <h:inputHidden id="htmlDragId" value="#{v2ConceptTreeDragDropBean.htmlDragId}"/>
    <h:inputHidden id="htmlDropId" value="#{v2ConceptTreeDragDropBean.htmlDropId}"/>
    <h:inputHidden id="htmlDragType" value="#{v2ConceptTreeDragDropBean.htmlDragType}"/>
    <h:inputHidden id="htmlDropType" value="#{v2ConceptTreeDragDropBean.htmlDropType}"/>
    <h:inputHidden id="htmlParentId" value="#{v2ConceptTreeDragDropBean.htmlParentId}"/>
    <h:inputHidden id="htmlDropRoot" value="#{v2ConceptTreeDragDropBean.htmlDropRoot}"/>
    <h:commandButton id="dropBtn" value="Déposer" styleClass="preview-open-btn"
                     action="#{v2ConceptFicheMenuBean.dropFromTree}">
      <f:ajax execute="@form" render=":previewDetailForm:previewDetail :previewTree" onevent="onCvMenuAjax"/>
    </h:commandButton>
  </h:form>

  <div class="view-panel" id="viewLive">
    <div class="cv-progress" id="liveProgress" aria-hidden="true"></div>
    <a class="cv-back-graph" id="liveBackList" hidden="hidden"
       href="candidat/candidats.xhtml" data-act="back-cand-list"
       title="Retour à la liste des candidats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Retour à la liste
    </a>
    <button type="button" class="cv-back-graph" id="liveBackGraph" hidden="hidden"
            data-act="back-graph" title="Retour au graphe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Retour au graphe
    </button>
    <h:form id="previewDetailForm" enctype="multipart/form-data">
      <h:panelGroup id="previewDetail" layout="block">
        <div id="previewDetailState"
             data-open="#{v2ThesaurusViewBean.detailVisible ? '1' : '0'}"
             data-requested="#{v2ThesaurusViewBean.detailRequested ? '1' : '0'}"
             data-id="#{v2ThesaurusViewBean.selectedId}"
             data-kind="#{v2ThesaurusViewBean.selectedKind}"
             data-flash-dnd="#{v2ConceptTreeDragDropBean.flashMessage}"
             data-flash-dnd-token="#{v2ConceptTreeDragDropBean.flashToken}"
             data-cut-id="#{v2ConceptTreeDragDropBean.cutOn ? v2ConceptTreeDragDropBean.cutConceptId : ''}">
          <ui:fragment rendered="#{v2ThesaurusViewBean.conceptSelected or v2ThesaurusViewBean.candidateSelected}">
            <ui:include src="concept-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{v2ThesaurusViewBean.facetSelected}">
            <ui:include src="facet-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{v2ThesaurusViewBean.detailRequested and not v2ThesaurusViewBean.detailVisible}">
            <div class="empty">
              <div class="empty-ico">◆</div>
              <p class="empty-t">Élément introuvable</p>
              <p class="empty-s">Ce concept, candidat ou cette facette n'est pas disponible dans la langue courante.</p>
            </div>
          </ui:fragment>
        </div>
      </h:panelGroup>
    </h:form>
  </div>
</ui:composition>
