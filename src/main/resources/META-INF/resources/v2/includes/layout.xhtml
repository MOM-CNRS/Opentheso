<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      lang="#{v2LocaleBean.idLangue}">
<f:metadata>
  <f:viewAction action="#{v2LocaleBean.applyToView}"/>
  <f:viewAction action="#{v2ThesaurusViewBean.ensureSessionThesaurus}"/>
  <ui:insert name="viewActions"/>
</f:metadata>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title><ui:insert name="title">OpenTheso</ui:insert></title>
  <base href="#{request.contextPath}/v2/"/>
  <link rel="icon" href="#{request.contextPath}/resources/img/icon_opentheso2.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2-prototype-recherche.css?v=cv-res36"/>
  <link rel="stylesheet" href="#{request.contextPath}/resources/css/v2.css?v=cv-res36"/>
</head>
<body data-page="#{v2Page}" data-ctx="#{request.contextPath}"
      data-logged-in="#{v2UserSession.loggedIn ? '1' : '0'}"
      data-card-layout="#{v2ConceptBlockLayoutBean.layoutJson}"
      data-msg-copied="#{v2LocaleBean.getMsg('v2.copied')}"
      data-msg-link="#{v2LocaleBean.getMsg('v2.home.linkPrompt')}"
      data-leaflet-js="#{resource['webjars:leaflet/1.8.0/leaflet.js']}"
      data-leaflet-css="#{resource['webjars:leaflet/1.8.0/leaflet.css']}">
<div class="app" id="app">
  <ui:include src="thesaurus.xhtml"/>
  <div class="main">
    <div class="panes">
      <ui:insert name="sidebar">
        <ui:include src="sidebar.xhtml"/>
      </ui:insert>
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
           title="Glisser pour redimensionner · double-clic pour réinitialiser">
        <span class="resizer-grip"></span>
      </div>
      <main class="content">
        <div class="view" id="previewView">
          <h:panelGroup id="previewWorkLangRefresh" layout="block" styleClass="view-lang-refresh">
            <ui:insert name="main"/>
            <ui:insert name="detail">
              <ui:include src="detail.xhtml"/>
            </ui:insert>
          </h:panelGroup>
        </div>
        <div class="view-rail" id="previewRail" aria-hidden="true">
          <span class="view-rail-thumb" id="previewRailThumb"></span>
        </div>
        <button type="button" class="go-top is-off" id="previewGoTop" data-act="go-top"
                title="Haut de page" aria-label="Haut de page" aria-hidden="true" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
          <span>Haut</span>
        </button>
      </main>
    </div>
  </div>
</div>
<div class="app-toast" id="appToast" hidden="hidden" role="status" aria-live="polite">
  <svg class="app-toast-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <span class="app-toast-txt"></span>
</div>
<h:outputScript library="jakarta.faces" name="faces.js"/>
<script src="#{request.contextPath}/resources/js/v2/core.js?v=bo-align1"></script>
<script src="#{request.contextPath}/resources/js/v2/settings.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/shell.js?v=cv-res33"></script>
<script src="#{request.contextPath}/resources/js/v2/search.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/tree.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/table.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/globe-ui.js?v=globe-lazy1"></script>
<script src="#{request.contextPath}/resources/js/v2/collections.js?v=coll-nonota"></script>
<script src="#{request.contextPath}/resources/js/v2/selection.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/export.js?v=split1"></script>
<script src="#{request.contextPath}/resources/js/v2/about.js?v=cv-res19"></script>
<script src="#{request.contextPath}/resources/js/v2/stats.js?v=cv-scroll1"></script>
<script src="#{request.contextPath}/resources/js/v2/app.js?v=cv-res29"></script>
</body>
</html>
