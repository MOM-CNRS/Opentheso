<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <style>
        .v2-alignment-hidden-row { display: none; }
    </style>

    <div class="card mb-4 py-3 border-left-success" style="margin:20px;">
        <p:dataTable var="alignement" value="#{v2ConceptAlignmentAdminBean.summaryRows}"
                     filteredValue="#{v2ConceptAlignmentAdminBean.filteredRows}"
                     size="small"
                     paginator="true"
                     paginatorPosition="bottom"
                     rows="10"
                     rowsPerPageTemplate="5,10,50"
                     currentPageReportTemplate="{startRecord}-{endRecord} / {totalRecords}"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     style="margin-bottom:-17px; margin-top:-16px; font-size:13px;"
                     lazy="false"
                     rowStyleClass="#{alignement.placeholder ? 'v2-alignment-hidden-row' : null}">

            <p:headerRow field="conceptId" expandable="true" expanded="true">
                <p:column colspan="2"
                          style="border-top:1px solid #43B572; border-bottom:1px solid #43B572; color:#143a1e;">
                    <h:outputText value="#{alignement.conceptLabel} (#{alignement.conceptId})"/>
                </p:column>
                <p:column colspan="2"
                          style="border-top:1px solid #43B572; border-bottom:1px solid #43B572; color:#143a1e; text-align:right;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('alignment.check_url')}"
                                     process="@this"
                                     actionListener="#{v2ConceptAlignmentAdminBean.checkUrls(alignement.conceptId)}"
                                     update=":containerIndex:formRightTab :messageIndex"
                                     styleClass="rounded-button ui-button-outlined"
                                     style="color:#f47b2a; margin-right:10px;"/>
                    <p:commandButton value="#{v2LocaleBean.getMsg('rightbody.concept.alignment')}"
                                     title="#{v2LocaleBean.getMsg('rightbody.concept.add_alignment_auto')}"
                                     icon="fa-solid fa-plus"
                                     process="@this"
                                     actionListener="#{v2ConceptAlignmentAdminBean.prepareAddForConcept(alignement)}"
                                     update=":containerIndex:v2ConceptSearchAlignementDlg"
                                     oncomplete="PF('v2ConceptSearchAlignement').show();"
                                     styleClass="ui-button-secondary rounded-button"
                                     style="font-size:0.8rem; padding:0.3rem 0.8rem; background:transparent; color:#f47b2a;"/>
                </p:column>
            </p:headerRow>

            <p:column headerText="URI" style="width:40%; word-wrap:break-word;">
                <h:panelGroup rendered="#{not alignement.placeholder}">
                    <h:outputLink value="#{alignement.targetUri}" target="_blank">
                        <h:outputText value="#{alignement.targetUri}"/>
                    </h:outputLink>
                    <h:panelGroup rendered="#{alignement.urlAvailable}">
                        <i class="pi pi-check-circle" style="font-size:1rem; color:green; margin-left:6px;"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{not alignement.urlAvailable}">
                        <i class="pi pi-times-circle" style="font-size:1rem; color:red; margin-left:6px;"/>
                    </h:panelGroup>
                </h:panelGroup>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('alignment.source')}" style="width:15%;">
                <h:outputText rendered="#{not alignement.placeholder}" value="#{alignement.sourceName}"/>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_of_alignmnent')}" style="width:15%;">
                <h:outputText rendered="#{not alignement.placeholder}" value="#{alignement.typeLabel}"/>
            </p:column>

            <p:column headerText="Actions" style="text-align:center; width:10%;">
                <h:panelGroup rendered="#{not alignement.placeholder}">
                    <p:commandButton icon="pi pi-pencil"
                                     process="@this"
                                     actionListener="#{v2ConceptAlignmentAdminBean.prepareEdit(alignement)}"
                                     update=":v2EditAlignmentDlg"
                                     oncomplete="PF('v2EditAlignment').show();"
                                     styleClass="rounded-button ui-button-outlined"
                                     style="height:30px; width:30px; color:#43B572;"/>
                    <p:commandButton icon="pi pi-trash"
                                     process="@this"
                                     actionListener="#{v2ConceptAlignmentAdminBean.prepareDelete(alignement)}"
                                     update=":v2DeleteAlignmentDlg"
                                     oncomplete="PF('v2DeleteAlignment').show();"
                                     styleClass="rounded-button ui-button-danger ui-button-outlined"
                                     style="height:30px; width:30px; margin-left:10px;"/>
                </h:panelGroup>
            </p:column>

            <p:summaryRow>
                <p:column colspan="4"
                          style="text-align:right; background-color:#ecf8f1; border-top:1px solid #43B572; border-bottom:1px solid #43B572; color:#143a1e;">
                    <h:outputText value="#{v2LocaleBean.getMsg('alignment.totalAlignmentFor')} (#{alignement.conceptLabel}) : #{v2ConceptAlignmentAdminBean.getTotalAlignmentsForConcept(alignement.conceptId)}"/>
                </p:column>
            </p:summaryRow>

            <f:facet name="footer">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.alignmentNumber')} : " style="font-size:14px;"/>
                <h:outputText value="#{v2ConceptAlignmentAdminBean.totalAlignments}" style="font-size:16px; color:#f47b2a;"/>
            </f:facet>
        </p:dataTable>
    </div>
</ui:fragment>
