<ui:fragment xmlns="http://www.w3.org/1999/xhtml"  
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="idAddImage" header="#{v2LocaleBean.getMsg('rightbody.conceptdialog.add_image')}" widgetVar="addImage"
              width="650" showEffect="fade" modal="true" resizable="false" position="top" style="margin-top: 30px" >

        <h:form>
            <p:defaultCommand target="addImageBtn" />

            <div class="row" style="margin-top: 10px; text-align: right">
                <div class="col-3" >
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.uri_image')} *" />
                </div>
                <div class="col-9">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.type_uri')} ..."
                                 value="#{v2ImageCandidatBean.uri}" style="width: 100%;"/>
                </div>
            </div>

            <!-- Name -->
            <div class="row" style="margin-top: 10px; text-align: right">
                <div class="col-3" >
                    <h:outputText value="#{v2LocaleBean.getMsg('statistique.label')}" />
                </div>
                <div class="col-9">
                    <p:inputText placeholder="..."
                                 value="#{v2ImageCandidatBean.name}" style="width: 100%;"/>
                </div>
            </div>

            <!-- creator -->
            <div class="row" style="margin-top: 10px; text-align: right">
                <div class="col-3" >
                    <h:outputText value="#{v2LocaleBean.getMsg('dublincore.creator')}" />
                </div>
                <div class="col-9">
                    <p:inputText placeholder="..."
                                 value="#{v2ImageCandidatBean.creator}" style="width: 100%;"/>
                </div>
            </div>

            <div class="row" style="margin-top: 10px; text-align: right">
                <div class="col-3" >
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.copyright')}" />
                </div>
                <div class="col-9">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('rightbody.conceptdialog.copyright')} ..."
                                 value="#{v2ImageCandidatBean.copyright}" style="width: 100%;"/>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 actionListener="PF('addImage').hide();" update="tabViewCandidat"/>

                <p:commandButton id="addImageBtn" value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 update="tabViewCandidat messageIndex"
                                 oncomplete="PF('addImage').hide();"
                                 icon="pi pi-check" styleClass="ui-button-success" ajax="true" process="@form"
                                 actionListener="#{v2ImageCandidatBean.addNewImage(v2UserSession.currentUserId)}" />
            </div>
            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
        </h:form>
    </p:dialog>
</ui:fragment>
