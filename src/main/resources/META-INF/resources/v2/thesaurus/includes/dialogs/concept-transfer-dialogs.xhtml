<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="v2MoveToAnotherThesoDlg" header="#{v2LocaleBean.getMsg('concept.moveToAnotherThesoTooltip')}"
              widgetVar="v2MoveToAnotherThesoDlg" width="650" modal="true" resizable="true" position="top">
        <h:form id="v2MoveToAnotherThesoForm">
            <p:scrollPanel mode="native" style="max-height:100px; margin-bottom:10px;">
                <div class="row">
                    <div class="col-4 text-right">
                        <h:outputText value="#{v2LocaleBean.getMsg('concept.conceptsToMove')} : "/>
                    </div>
                    <div class="col-8" style="font-weight:bold;">
                        <ui:repeat value="#{v2ConceptTransferEditorBean.branchConceptIds}" var="conceptToMove" varStatus="status">
                            <h:outputText value="#{conceptToMove}"/>
                            <h:outputText rendered="#{not status.last}" value="; "/>
                        </ui:repeat>
                    </div>
                </div>
            </p:scrollPanel>
            <div class="row mb-2">
                <div class="col-4 text-right" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('concept.fromTheso')} : "/>
                </div>
                <div class="col-8" style="font-weight:bold; margin-top:3px;">
                    <h:outputText value="#{v2ThesaurusBrowseBean.thesaurusTitle} (#{v2ThesaurusContext.currentThesaurusId})"/>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right" style="margin-top:3px;">
                    <h:outputText value="#{v2LocaleBean.getMsg('concept.toTheso')} : "/>
                </div>
                <div class="col-8">
                    <p:selectOneMenu value="#{v2ConceptTransferEditorBean.targetThesaurusId}" style="width:100%;">
                        <f:selectItem itemLabel="(#{v2LocaleBean.getMsg('menu.select_thesaurus')})" itemValue=""/>
                        <f:selectItems value="#{v2ConceptTransferEditorBean.availableThesauri}" var="thesaurusOption"
                                       itemLabel="#{thesaurusOption.title} (#{thesaurusOption.id})" itemValue="#{thesaurusOption.id}"/>
                        <p:ajax event="valueChange" listener="#{v2ConceptTransferEditorBean.onTargetThesaurusChange()}"
                                update="v2MoveToAnotherThesoForm"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right">
                    <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.parent_concept')} : "
                                  title="#{v2LocaleBean.getMsg('concept.toConceptTooltip')}"/>
                </div>
                <div class="col-8">
                    <p:autoComplete value="#{v2ConceptTransferEditorBean.parentSearchSelected}"
                                    completeMethod="#{v2ConceptTransferEditorBean.autocompleteParentConcept}"
                                    var="suggestion" itemLabel="#{suggestion.preferredLabel}" itemValue="#{suggestion}"
                                    converter="v2ConceptSearchConverter" forceSelection="true"
                                    minQueryLength="1" scrollHeight="400" style="width:100%;">
                        <p:column rendered="#{suggestion.altLabelMatch}" style="font-size:12px;">
                            <h:outputText value="#{suggestion.altLabel}" style="font-style:italic;"/>
                            <h:outputText value=" -&gt; #{suggestion.preferredLabel}" style="color:blue;"/>
                        </p:column>
                        <p:column rendered="#{not suggestion.altLabelMatch}" style="font-size:12px;">
                            <h:outputText value="#{suggestion.preferredLabel}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}" styleClass="ui-button-secondary"
                                 type="button" onclick="PF('v2MoveToAnotherThesoDlg').hide();" style="margin-right:8px;"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptTransferEditorBean.submitMoveToAnotherThesaurus()}"
                                 update="v2MoveToAnotherThesoForm :containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                                 process="@form"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
