<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:defaultCommand target="v2GlobalApplySearch"/>

    <div class="container" style="margin-top:-25px; z-index:9;">
        <div class="row">
            <div class="col-lg-12 card-margin">
                <div class="card search-form">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-12">
                                <div class="row no-gutters">
                                    <div style="width:30%; z-index:100;">
                                        <p:selectOneMenu id="v2GlobalSearchLanguage"
                                                         value="#{v2GlobalConceptSearchBean.searchLang}"
                                                         title="#{v2LocaleBean.getMsg('search.change_thesaurus_language')}"
                                                         style="background:transparent; border-color:transparent; font-size:12px; padding-top:2px; width:100%; padding-left:5px; height:33px;">
                                            <f:selectItem itemLabel="Français" itemValue="fr"/>
                                            <f:selectItem itemLabel="English" itemValue="en"/>
                                            <f:selectItem itemLabel="Español" itemValue="es"/>
                                            <f:selectItem itemLabel="Deutsch" itemValue="de"/>
                                            <f:selectItem itemLabel="العربية" itemValue="ar"/>
                                            <f:selectItem itemLabel="#{v2LocaleBean.getMsg('search.any_language')}" itemValue="all"/>
                                        </p:selectOneMenu>
                                    </div>

                                    <div style="width:55%; z-index:100;">
                                        <p:autoComplete id="v2GlobalSearchAutocomplete"
                                                        value="#{v2GlobalConceptSearchBean.selectedSuggestion}"
                                                        var="suggestion"
                                                        placeholder="#{v2LocaleBean.getMsg('candidat.search')}..."
                                                        delay="400"
                                                        minQueryLength="1"
                                                        completeMethod="#{v2GlobalConceptSearchBean.complete}"
                                                        itemLabel="#{suggestion.preferredLabel}"
                                                        itemValue="#{suggestion}"
                                                        converter="v2ConceptSearchSuggestionConverter"
                                                        scrollHeight="600"
                                                        emptyMessage=" "
                                                        inputStyle="font-size:14px; width:100%; height:100%; box-shadow:none; padding-top:10px;"
                                                        style="background-color:transparent; border-color:transparent; width:100%; font-size:12px;">
                                            <p:column rendered="#{suggestion.concept}">
                                                <h:outputText value="#{suggestion.preferredLabel}" style="font-size:12px;"/>
                                            </p:column>
                                            <p:column rendered="#{suggestion.altLabelMatch}">
                                                <h:outputText value="#{suggestion.altLabelValue} -&gt; #{suggestion.preferredLabel}"
                                                              style="font-style:italic; font-size:12px; color:blue;"/>
                                            </p:column>
                                            <p:ajax event="itemSelect"
                                                    listener="#{v2GlobalConceptSearchBean.onSuggestionSelect}"
                                                    process="@this"/>
                                        </p:autoComplete>
                                    </div>

                                    <div style="width:15%; text-align:right; z-index:100;">
                                        <p:commandButton id="v2GlobalApplySearch"
                                                         icon="fas fa-search fa-1x"
                                                         style="color:#f47b2a; background:transparent; border:none; box-shadow:none; font-size:14px;"
                                                         actionListener="#{v2GlobalConceptSearchBean.applySearch()}"
                                                         process="containerIndex:v2GlobalSearchAutocomplete @this"
                                                         update="messageIndex resultSearchBar"
                                                         ajax="false"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-auto researchAdvanceClass"
         style="display:flex; flex-direction:row; justify-content:center; align-items:center; visibility:visible;">
        <h:panelGroup style="background-color:#ECF8F1; padding:10px 20px 5px 20px; border-radius:0 0 7px 7px; margin-top:-28px;">
            <p:selectBooleanCheckbox itemLabel="#{v2LocaleBean.getMsg('search.startWith')}"
                                     value="#{v2GlobalConceptSearchBean.startWithMatch}"
                                     style="color:#143a1e; font-size:12px;">
                <p:ajax listener="#{v2GlobalConceptSearchBean.activateStartWithMatch()}"/>
            </p:selectBooleanCheckbox>
            <p:selectBooleanCheckbox itemLabel="#{v2LocaleBean.getMsg('search.exact')}"
                                     value="#{v2GlobalConceptSearchBean.exactMatch}"
                                     style="color:#143a1e; font-size:12px;">
                <p:ajax listener="#{v2GlobalConceptSearchBean.activateExactMatch()}"/>
            </p:selectBooleanCheckbox>
            <p:selectBooleanCheckbox itemLabel="#{v2LocaleBean.getMsg('search.note')}"
                                     value="#{v2GlobalConceptSearchBean.noteMatch}"
                                     style="color:#143a1e; font-size:12px;">
                <p:ajax listener="#{v2GlobalConceptSearchBean.activateNoteMatch()}"/>
            </p:selectBooleanCheckbox>
            <p:selectBooleanCheckbox itemLabel="#{v2LocaleBean.getMsg('search.identifier')}"
                                     value="#{v2GlobalConceptSearchBean.identifierMatch}"
                                     style="color:#143a1e; font-size:12px;">
                <p:ajax listener="#{v2GlobalConceptSearchBean.activateIdentifierMatch()}"/>
            </p:selectBooleanCheckbox>
        </h:panelGroup>
    </div>
</ui:fragment>
