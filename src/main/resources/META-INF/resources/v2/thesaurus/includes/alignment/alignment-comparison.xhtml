<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <div class="card mb-4 py-3 border-left-success" style="margin:20px;">
        <div style="margin:0 12px 10px 12px; font-weight:bold;">
            <h:outputText value="#{v2LocaleBean.getMsg('alignment.selected_source')} #{v2ConceptAlignmentAdminBean.selectedSourceName}"/>
        </div>
        <p:dataTable var="alignement"
                     value="#{v2ConceptAlignmentAdminBean.propositions}"
                     style="font-size:13px;"
                     lazy="false">

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.concept.alignement.local-label')}"
                      style="width:15%; text-align:center;" groupRow="true">
                <h:outputText value="#{alignement.localLabel}"/>
                <h:panelGroup rendered="#{alignement.alreadyAligned}">
                    <br/>
                    <i class="pi pi-link" style="font-size:1rem; color:green;"/>
                </h:panelGroup>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.concept.alignement.local-definition')}"
                      style="width:30%;" groupRow="true">
                <h:outputText value="#{alignement.localDefinition}" escape="false"/>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.concept.alignement.remote-label')}"
                      style="width:15%;">
                <h:outputText value="#{alignement.targetLabel}"
                              style="color:#{alignement.alreadyAligned ? 'orange' : 'black'};"/>
                <h:outputLink value="#{alignement.targetUri}" target="_blank" style="margin-left:4px;">
                    <i class="pi pi-link" style="font-size:1rem; color:green;"/>
                </h:outputLink>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('rightbody.concept.alignement.remote-label')}"
                      style="width:30%;">
                <h:outputText value="#{alignement.targetDefinition}" escape="false"
                              style="color:#{alignement.alreadyAligned ? 'orange' : 'black'};"/>
            </p:column>

            <p:column headerText="#{v2LocaleBean.getMsg('profile.action')}" style="width:10%; text-align:center;">
                <p:commandButton icon="pi pi-check"
                                 process="@this"
                                 actionListener="#{v2ConceptAlignmentAdminBean.replaceWithProposition(alignement)}"
                                 update=":containerIndex:formRightTab :messageIndex"
                                 styleClass="rounded-button"
                                 style="background:green; border-color:green;"
                                 title="#{v2LocaleBean.getMsg('alignment.remplace')}"/>
                <p:commandButton icon="pi pi-times"
                                 process="@this"
                                 actionListener="#{v2ConceptAlignmentAdminBean.discardProposition(alignement)}"
                                 update=":containerIndex:formRightTab"
                                 styleClass="rounded-button ui-button-danger"
                                 style="margin-left:5px;"
                                 title="#{v2LocaleBean.getMsg('alignment.delete')}">
                    <p:confirm type="popup" icon="pi pi-info-circle"
                               message="#{v2LocaleBean.getMsg('rightbody.concept.alignement.delete-confirmation-msg')}"/>
                </p:commandButton>
                <p:confirmPopup global="true">
                    <p:commandButton value="#{v2LocaleBean.getMsg('no')}" type="button"
                                     styleClass="ui-confirm-popup-no ui-button-flat"/>
                    <p:commandButton value="#{v2LocaleBean.getMsg('yes')}" type="button"
                                     styleClass="ui-confirm-popup-yes"/>
                </p:confirmPopup>
            </p:column>
        </p:dataTable>

        <div style="text-align:right; margin-top:20px;">
            <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}"
                             icon="fas fa-undo-alt"
                             styleClass="ui-button-secondary"
                             process="@this"
                             actionListener="#{v2ConceptAlignmentAdminBean.backToSummary()}"
                             update=":containerIndex:formRightTab"/>
        </div>
    </div>
</ui:fragment>
