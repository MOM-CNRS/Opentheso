<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="v2CopyBetweenThesoDlg" header="Validation copier/coller"
              widgetVar="v2CopyBetweenThesoDlg" modal="true" resizable="false"
              position="top" width="550" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2CopyBetweenThesoForm">
            <div class="row">
                <div class="col-3"><h:outputText value="Copier : "/></div>
                <div class="col-8">
                    <h:outputText value="#{v2ConceptCopyBetweenThesaurusBean.sourceLabel} (#{v2ConceptCopyBetweenThesaurusBean.sourceConceptId})"/>
                </div>
            </div>
            <div class="row">
                <div class="col-3"><h:outputText value="du thésaurus : "/></div>
                <div class="col-8">
                    <h:outputText value="#{v2ConceptCopyBetweenThesaurusBean.sourceThesaurusId}"/>
                </div>
            </div>
            <div class="row">
                <div class="col-3"><h:outputText value="vers : "/></div>
                <div class="col-8">
                    <h:outputText value="#{v2ThesaurusBrowseBean.selectedConcept.summary.preferredLabel}"/>
                </div>
            </div>
            <p:spacer height="10"/>
            <div class="row">
                <div class="col-3"><h:outputText value="récupérer les identifiants : "/></div>
                <div class="col-4">
                    <p:selectOneMenu value="#{v2ConceptCopyBetweenThesaurusBean.identifierType}">
                        <f:selectItem itemLabel="Non" itemValue="sans"/>
                        <f:selectItem itemLabel="Ark" itemValue="ark"/>
                        <f:selectItem itemLabel="Handle" itemValue="handle"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <p:spacer height="10"/>
            <div class="row">
                <div class="col-12">
                    <h:outputText value="Attention : si vous récupérez l'identifiant Ark, l'id Ark de l'ancien concept sera supprimé et le nouveau concept récupèrera cet Ark id"
                                  style="color:#8A3B05;"/>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:20px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary"
                                 style="margin-right:10px;"
                                 process="@this"
                                 onclick="PF('v2CopyBetweenThesoDlg').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptCopyBetweenThesaurusBean.paste()}"
                                 process="@form"
                                 update=":containerIndex:formLeftTab :containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog id="v2CopyBetweenThesoToRootDlg" header="Validation copier/coller (racine)"
              widgetVar="v2CopyBetweenThesoToRootDlg" modal="true" resizable="false"
              position="top" width="550" style="margin-top:30px;" appendTo="@(body)">
        <h:form id="v2CopyBetweenThesoToRootForm">
            <div class="row">
                <div class="col-3"><h:outputText value="Copier : "/></div>
                <div class="col-8">
                    <h:outputText value="#{v2ConceptCopyBetweenThesaurusBean.sourceLabel} (#{v2ConceptCopyBetweenThesaurusBean.sourceConceptId})"/>
                </div>
            </div>
            <div class="row">
                <div class="col-3"><h:outputText value="du thésaurus : "/></div>
                <div class="col-8">
                    <h:outputText value="#{v2ConceptCopyBetweenThesaurusBean.sourceThesaurusId}"/>
                </div>
            </div>
            <div class="row">
                <div class="col-3"><h:outputText value="vers : "/></div>
                <div class="col-8"><h:outputText value="Root"/></div>
            </div>
            <p:spacer height="10"/>
            <div class="row">
                <div class="col-3"><h:outputText value="récupérer les identifiants : "/></div>
                <div class="col-4">
                    <p:selectOneMenu value="#{v2ConceptCopyBetweenThesaurusBean.identifierType}">
                        <f:selectItem itemLabel="Non" itemValue="sans"/>
                        <f:selectItem itemLabel="Ark" itemValue="ark"/>
                        <f:selectItem itemLabel="Handle" itemValue="handle"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:20px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary"
                                 style="margin-right:10px;"
                                 process="@this"
                                 onclick="PF('v2CopyBetweenThesoToRootDlg').hide();"/>
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 icon="pi pi-check" styleClass="ui-button-success"
                                 actionListener="#{v2ConceptCopyBetweenThesaurusBean.paste()}"
                                 process="@form"
                                 update=":containerIndex:formLeftTab :containerIndex:formRightTab :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
