<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
        <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
            <div class="list-group-item list-group-item-action">
                <div class="row" style="margin-left:0;">
                    <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5">
                        <p:selectBooleanCheckbox value="#{v2PropositionBean.traductionAccepted}"
                                                 title="Accepter cette proposition"
                                                 rendered="#{v2PropositionBean.showButtonDecision and v2PropositionBean.canMakeAction}"/>
                        <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.traduction')}"
                                      style="font-size:14px; font-weight:bold; color:#8f8f8f; margin-left:5px;"/>
                    </div>
                    <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                        <h:panelGroup rendered="#{empty v2PropositionBean.selectedDraft.translationChanges}">
                            <h:outputText value="....."/>
                        </h:panelGroup>
                        <ui:repeat var="change" value="#{v2PropositionBean.selectedDraft.translationChanges}">
                            <img src="#{v2ThesaurusBrowseBean.getFlagImageUrl(change.lang)}"
                                 width="20" height="15" style="margin-right:10px;" alt=""/>
                            <h:outputText value="#{change.value}" rendered="#{change.add}"
                                          style="font-size:14px; color:green;"/>
                            <h:panelGroup rendered="#{change.update}">
                                <h:outputText value="#{change.value} " style="font-size:14px; color:blue;"/>
                                <h:outputText value="(#{change.oldValue})"
                                              style="font-size:14px; color:blue; text-decoration:line-through;"/>
                            </h:panelGroup>
                            <h:outputText value="#{change.value}" rendered="#{change.delete}"
                                          style="font-size:14px; color:red; text-decoration:line-through;"/>
                            <br/>
                        </ui:repeat>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ui:fragment>
