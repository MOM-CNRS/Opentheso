<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idV2AddExistingMember" header="#{langueBean.getMsg('profile.tooltip_add_existing_user')}"
              widgetVar="v2AddExistingMember"
              width="450" showEffect="fade" modal="true" resizable="false" position="top"
              style="margin-top: 30px">

        <h:form id="v2AddExistingMemberForm">
            <div class="row">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('profile.project')} : " style="font-size: 12px;"/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2MyProjectsBean.selectedProjectName}"
                                  style="font-size: 13px; color: #43B572;"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('profile.user')} : " style="font-size: 12px;"/>
                </div>
                <div class="col-7">
                    <p:autoComplete value="#{v2MyProjectsBean.selectedExistingUser}" var="user"
                                    forceSelection="true"
                                    completeMethod="#{v2MyProjectsBean.searchExistingUsers}"
                                    minQueryLength="1" itemLabel="#{user.username()}" itemValue="#{user}"
                                    converter="userSearchResultConverter"
                                    scrollHeight="600"
                                    inputStyle="font-size: 12px; width: 100%; height: 25px;box-shadow: none;border-color: #43B572"
                                    style="font-size: 12px; width: 100%">
                        <p:column style="font-size: 12px;">
                            <h:outputText title="#{user.userId()}" value="#{user.username()}"/>
                        </p:column>
                    </p:autoComplete>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('profile.role')} : " style="font-size: 12px;"/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2MyProjectsBean.existingMemberRoleId}"
                                     styleClass="selectOneMenu_custom"
                                     panelStyleClass="selectOneMenu_panelStyle_custom"
                                     style="width: 100%; background: none; box-shadow: none;"
                                     panelStyle="border: none; box-shadow: none; max-width: 300px">
                        <f:selectItems value="#{v2MyProjectsBean.assignableRoles}" var="role"
                                       itemLabel="#{role.name()}" itemValue="#{role.id()}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <p:spacer/>
            <div style="width: 100%; text-align: right; margin-top: 5px; margin-bottom: 5px;">
                <p:commandButton value="#{langueBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 oncomplete="PF('v2AddExistingMember').hide();"
                                 update="idV2AddExistingMember"/>

                <p:commandButton value="#{langueBean.getMsg('btnAdd')}" styleClass="ui-button-success"
                                 update="containerIndex messageIndex" icon="pi pi-check"
                                 action="#{v2MyProjectsBean.addExistingMember()}"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
