<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:f="http://xmlns.jcp.org/jsf/core"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui">

    <p:dialog id="idV2MoveProjectThesaurus"
              header="#{v2LocaleBean.getMsg('profile.move_thesaurus_to_another_project')}"
              widgetVar="v2MoveProjectThesaurus"
              width="500" showEffect="fade" modal="true"
              resizable="false" position="top" style="margin-top: 30px">

        <h:form id="v2MoveProjectThesaurusForm">
            <div class="row">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('menu.thesaurus')} : "/>
                </div>
                <div class="col-7">
                    <h:outputText value="#{v2MyProjectsBean.thesaurusToMoveTitle} (#{v2MyProjectsBean.thesaurusToMoveId})"
                                  style="font-weight: bold"/>
                </div>
            </div>
            <div class="row" style="margin-top: 5px;">
                <div class="col-5" style="text-align: right">
                    <h:outputText value="#{v2LocaleBean.getMsg('profile.project')} : "/>
                </div>
                <div class="col-7">
                    <p:selectOneMenu value="#{v2MyProjectsBean.moveTargetProjectId}" style="width: 100%">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2MyProjectsBean.moveTargetProjects}" var="project"
                                       itemLabel="#{project.name()} (#{project.id()})" itemValue="#{project.id()}"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 15px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}" style="margin-right: 10px"
                                 icon="fas fa-undo-alt" styleClass="ui-button-secondary button"
                                 ajax="true" oncomplete="PF('v2MoveProjectThesaurus').hide();" update="idV2MoveProjectThesaurus"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 icon="pi pi-check"
                                 styleClass="ui-button-success"
                                 update="messageIndex v2MoveProjectThesaurusForm containerIndex"
                                 action="#{v2MyProjectsBean.submitMoveThesaurus()}"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
