<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  <div class="searchbox" id="searchBox"
       data-msg-via-note="#{v2LocaleBean.getMsg('v2.search.viaNote')}"
       data-msg-via-syn="#{v2LocaleBean.getMsg('v2.search.viaSyn')}"
       data-msg-results="#{v2LocaleBean.getMsg('search.result_found')}"
       data-msg-none="#{v2LocaleBean.getMsg('search.noResult')}"
       data-hint-full="#{v2LocaleBean.getMsg('search.elastic')}"
       data-hint-exact="#{v2LocaleBean.getMsg('search.exact')}"
       data-hint-id="#{v2LocaleBean.getMsg('search.identifier')}"
       data-hint-note="#{v2LocaleBean.getMsg('search.note')}"
       data-hint-start="#{v2LocaleBean.getMsg('search.startWith')}"
       data-hint-start-offer="#{v2LocaleBean.getMsg('v2.search.startOffer')}"
       data-placeholder="#{v2LocaleBean.getMsg('search.search')}…"
       data-placeholder-note="#{v2LocaleBean.getMsg('search.search_only_note')}">
    <div class="search-field" id="searchField">
      <input type="text" class="search-input" id="searchInput" autocomplete="off" spellcheck="false"
             placeholder="#{v2LocaleBean.getMsg('search.search')}…"
             aria-label="#{v2LocaleBean.getMsg('search.search')}"
             aria-autocomplete="list" aria-controls="ac"/>
      <button type="button" class="search-clear" id="searchClear" hidden="hidden"
              title="#{v2LocaleBean.getMsg('v2.search.clear')}"
              aria-label="#{v2LocaleBean.getMsg('v2.search.clear')}">×</button>
      <button type="button" class="search-go" id="searchGo">#{v2LocaleBean.getMsg('search.search')}</button>
    </div>
    <div class="search-assist" id="searchAssist">
      <span class="search-hint" id="searchModeHint">#{v2LocaleBean.getMsg('search.elastic')}</span>
      <button type="button" class="search-chip" id="searchNoteToggle" aria-pressed="false">
        #{v2LocaleBean.getMsg('search.note')}
      </button>
      <button type="button" class="search-chip" id="searchAllLang" aria-pressed="false">
        #{v2LocaleBean.getMsg('search.any_language')}
      </button>
    </div>
    <div class="ac" id="ac" role="listbox">
      <ui:fragment rendered="#{v2UserSession.loggedIn}">
        <div class="ac-programs" id="acPrograms" hidden="hidden">
          <div class="smm-h">#{v2LocaleBean.getMsg('search.preprogrammedSearch')}</div>
          <button type="button" class="smm-item" data-search-programmed="deprecated">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.deprecated')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_deprecated')}</span>
          </button>
          <button type="button" class="smm-item" data-search-programmed="polyhierarchy">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.polyhierarchy')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_polyhierarchy')}</span>
          </button>
          <button type="button" class="smm-item" data-search-programmed="multi-groups">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.multiGroups')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_multiGroups')}</span>
          </button>
          <button type="button" class="smm-item" data-search-programmed="without-groups">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.withoutGroups')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_withoutGroups')}</span>
          </button>
          <button type="button" class="smm-item" data-search-programmed="duplicates">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.duplicates')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_duplicates')}</span>
          </button>
          <button type="button" class="smm-item" data-search-programmed="forbidden">
            <span class="smm-l">#{v2LocaleBean.getMsg('search.forbiddenRelationships')}</span>
            <span class="smm-d">#{v2LocaleBean.getMsg('search.tooltip_forbiddenRrelationships')}</span>
          </button>
        </div>
      </ui:fragment>
      <div class="ac-empty">#{v2LocaleBean.getMsg('search.noResult')} « <span id="acQuery"></span> »</div>
      <button type="button" class="ac-start" id="acStartWith" hidden="hidden">
        <span id="acStartWithLabel">#{v2LocaleBean.getMsg('v2.search.startOffer')}</span>
        « <span id="acStartWithQ"></span> »
      </button>
      <div id="acList"></div>
      <button type="button" class="ac-footer" id="acSeeAll" hidden="hidden">
        #{v2LocaleBean.getMsg('v2.search.seeAll')} <strong id="acSeeAllN"></strong>
        <span class="ac-enter">↵</span>
      </button>
    </div>
  </div>
</ui:composition>
