<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://java.sun.com/jsf/html"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <f:metadata>
        <f:viewAction action="#{v2ConceptSkosImportBean.init()}"/>
    </f:metadata>

    <div class="card shadow mb-4" style="padding: 15px; margin: 20px">
        <div class="row" style="margin-top: 10px;">
            <div class="col-12">
                <h:outputText value="#{v2LocaleBean.getMsg('import.skosFormat')}" styleClass="h5 mb-3 text-gray-800"/>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"/>
            </div>
            <div class="col-5">
                <p:selectOneMenu value="#{v2ConceptSkosImportBean.selectedLang}" style="width: 100%;">
                    <f:selectItems value="#{v2ConceptSkosImportBean.allLangs}" var="lang"
                                   itemLabel="#{lang.iso6391} _ #{lang.frenchName}" itemValue="#{lang.iso6391}"/>
                </p:selectOneMenu>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="Format"/>
            </div>
            <div class="col-5">
                <p:selectOneMenu value="#{v2ConceptSkosImportBean.typeImport}" style="width: 100%;">
                    <f:selectItem itemLabel="Rdf" itemValue="0"/>
                    <f:selectItem itemLabel="Json-ld" itemValue="1"/>
                    <f:selectItem itemLabel="Turtle" itemValue="2"/>
                    <f:selectItem itemLabel="Json" itemValue="3"/>
                </p:selectOneMenu>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="Fichier"/>
            </div>
            <div class="col-8">
                <p:fileUpload listener="#{v2ConceptSkosImportBean.loadFileSkos}"
                              label="#{v2LocaleBean.getMsg('candidat.parcourir')}"
                              mode="advanced" auto="true" update="importResume"
                              onstart="PF('waitDialog').show();" allowTypes="/(\.|\/)(rdf|xml|ttl|json|jsonld)$/"/>
            </div>
        </div>

        <h:panelGroup id="importResume" rendered="#{v2ConceptSkosImportBean.loadDone}">
            <div class="row mb-2">
                <div class="col-3 text-right"><h:outputText value="URI"/></div>
                <div class="col-8"><h:outputText value="#{v2ConceptSkosImportBean.uri}"/></div>
            </div>
            <div class="row mb-3">
                <div class="col-3 text-right"><h:outputText value="Nombre de concepts"/></div>
                <div class="col-8"><h:outputText value="#{v2ConceptSkosImportBean.total}"/></div>
            </div>
            <div class="row mb-3" rendered="#{v2ConceptSkosImportBean.total > 0}">
                <div class="col-12 text-center">
                    <p:commandButton value="Importer"
                                     icon="fas fa-file-import"
                                     actionListener="#{v2ConceptSkosImportBean.importConcepts()}"
                                     update="importResume importProgress"/>
                </div>
            </div>
            <div class="row" rendered="#{v2ConceptSkosImportBean.progressValue > 0}">
                <div class="col-12">
                    <p:progressBar id="importProgress" value="#{v2ConceptSkosImportBean.progressValue}" labelTemplate="{value}%"/>
                </div>
            </div>
        </h:panelGroup>

        <div class="row" style="margin-top: 30px;">
            <div class="col-12 text-center">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}" styleClass="ui-button-secondary button"
                                 icon="fas fa-undo-alt" update="containerIndex"
                                 action="#{v2EditionBean.showList()}"/>
            </div>
        </div>
    </div>
</ui:fragment>
