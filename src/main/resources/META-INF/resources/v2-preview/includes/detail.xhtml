<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:form id="previewOpenForm" styleClass="preview-open-form">
    <h:inputHidden id="openId" value="#{v2PreviewThesaurusBean.openId}"/>
    <h:inputHidden id="openType" value="#{v2PreviewThesaurusBean.openType}"/>
    <h:commandButton id="openBtn" value="Ouvrir" styleClass="preview-open-btn"
                     action="#{v2PreviewThesaurusBean.openSelectedNode}">
      <f:ajax execute="@form" render=":previewDetailForm:previewDetail"/>
    </h:commandButton>
  </h:form>

  <div class="view-panel" id="viewLive">
    <h:form id="previewDetailForm">
      <h:panelGroup id="previewDetail" layout="block">
        <div id="previewDetailState"
             data-open="#{v2PreviewThesaurusBean.detailVisible ? '1' : '0'}"
             data-requested="#{v2PreviewThesaurusBean.detailRequested ? '1' : '0'}"
             data-id="#{v2PreviewThesaurusBean.selectedId}"
             data-kind="#{v2PreviewThesaurusBean.selectedKind}">
          <ui:fragment rendered="#{v2PreviewThesaurusBean.conceptSelected}">
            <ui:include src="concept-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{v2PreviewThesaurusBean.candidateSelected}">
            <ui:include src="candidate-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{v2PreviewThesaurusBean.facetSelected}">
            <ui:include src="facet-form.xhtml"/>
          </ui:fragment>
          <ui:fragment rendered="#{v2PreviewThesaurusBean.detailRequested and not v2PreviewThesaurusBean.detailVisible}">
            <div class="empty">
              <div class="empty-ico">◆</div>
              <p class="empty-t">Élément introuvable</p>
              <p class="empty-s">Ce concept, candidat ou cette facette n'est pas disponible dans la langue courante.</p>
            </div>
          </ui:fragment>
        </div>
      </h:panelGroup>
    </h:form>
  </div>
</ui:composition>
