<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idLogin" header="#{v2LocaleBean.getMsg('menu.login')}" widgetVar="login"
              showEffect="fade" modal="true" resizable="false" width="400" position="top"
              appendTo="@(body)"
              style="margin-top: 50px; font-size: 14px;">

        <h:form>
            <div class="row" style="text-align: left; margin-bottom: 5px;">
                <div class="col-10 offset-1">
                    <h:outputText value="#{v2LocaleBean.getMsg('statistique.user')}" style="width: 100%"/>
                </div>
            </div>
            <div class="row" style="text-align: left; margin-bottom: 20px;">
                <div class="col-10 offset-1">
                    <p:inputText placeholder="#{v2LocaleBean.getMsg('statistique.user')}"
                                 value="#{v2LoginBean.username}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="text-align: left; margin-bottom: 5px;">
                <div class="col-10 offset-1">
                    <h:outputText value="#{v2LocaleBean.getMsg('menu.password')}" style="width: 100%"/>
                </div>
            </div>
            <div class="row" style="text-align: left; margin-bottom: 20px;">
                <div class="col-10 offset-1">
                    <p:inputText type="password" placeholder="#{v2LocaleBean.getMsg('menu.password')}"
                                 value="#{v2LoginBean.password}" style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="text-align: center;">
                <div class="col-10 offset-1">
                    <p:commandButton value="#{v2LocaleBean.getMsg('menu.connect')}"
                                     styleClass="ui-button-success" icon="fa-solid fa-key"
                                     actionListener="#{v2LoginBean.login()}"
                                     update="containerIndex menuBar messageIndex"
                                     oncomplete="PF('login').hide();"
                                     style="width: 100%"/>
                </div>
            </div>

            <div class="row" style="text-align: center; margin-top: 10px;">
                <div class="col-12">
                    <p:commandLink update="idForgetPass forgetPassForm" oncomplete="PF('forgetPass').show();"
                                   value="#{v2LocaleBean.getMsg('menu.forgotten_pass')}" style="font-size: 12px;"/>
                </div>
            </div>

            <p:separator style="margin-top: 0px;"/>

            <h:panelGroup rendered="#{v2LoginBean.keycloakEnabled}">
                <div class="row" style="text-align: center;">
                    <div class="col-10 offset-1">
                        <img src="#{request.contextPath}/resources/img/logo-keycloak.png"
                             style="height: 30px; margin-right: 10px;" alt="Keycloak"/>
                        <p:commandButton value="SSO..." styleClass="ui-button-secondary" icon="fa-solid fa-key"
                                         style="font-size: 12px;"
                                         onclick="window.location.href='/oauth2/authorization/keycloak'; return false;"/>
                    </div>
                </div>
            </h:panelGroup>

            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
