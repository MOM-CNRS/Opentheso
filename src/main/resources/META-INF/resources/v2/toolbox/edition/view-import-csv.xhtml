<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://java.sun.com/jsf/html"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <f:metadata>
        <f:viewAction action="#{v2ThesaurusEditionCsvImportBean.init()}"/>
    </f:metadata>

    <div class="card shadow mb-4" style="padding: 15px; margin: 20px">
        <div class="row" style="margin-top: 10px;">
            <div class="col-12">
                <h:outputText value="#{v2LocaleBean.getMsg('csvImport.formatCsv')}" styleClass="h5 mb-3 text-gray-800"/>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('statistique.thesaurus.name')}"/>
            </div>
            <div class="col-5">
                <p:inputText value="#{v2ThesaurusEditionCsvImportBean.thesaurusName}" style="width: 100%;"/>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.language')}"/>
            </div>
            <div class="col-5">
                <p:selectOneMenu value="#{v2ThesaurusEditionCsvImportBean.selectedLang}" style="width: 100%;">
                    <f:selectItems value="#{v2ThesaurusEditionCsvImportBean.allLangs}" var="lang"
                                   itemLabel="#{lang.code} _ #{lang.frenchName}" itemValue="#{lang.code}"/>
                </p:selectOneMenu>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('csvExport.delimiter')}"/>
            </div>
            <div class="col-5">
                <p:selectOneMenu value="#{v2ThesaurusEditionCsvImportBean.choiceDelimiter}" style="width: 100%;">
                    <f:selectItem itemLabel="," itemValue="0"/>
                    <f:selectItem itemLabel=";" itemValue="1"/>
                    <f:selectItem itemLabel="Tab" itemValue="2"/>
                </p:selectOneMenu>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('csvExport.dateFormat')}"/>
            </div>
            <div class="col-5">
                <p:inputText placeholder="yyyy-MM-dd" value="#{v2ThesaurusEditionCsvImportBean.formatDate}" style="width: 100%;"/>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="#{v2LocaleBean.getMsg('profile.project')}"/>
            </div>
            <div class="col-5">
                <p:selectOneMenu value="#{v2ThesaurusEditionCsvImportBean.selectedProjectId}"
                                 rendered="#{v2ThesaurusEditionCsvImportBean.superAdmin}"
                                 style="width: 100%;">
                    <f:selectItem itemLabel="..." itemValue=""/>
                    <f:selectItems value="#{v2ThesaurusEditionCsvImportBean.projects}" var="project"
                                   itemLabel="#{project.name}" itemValue="#{project.id}"/>
                </p:selectOneMenu>
                <p:selectOneMenu value="#{v2ThesaurusEditionCsvImportBean.selectedProjectId}"
                                 rendered="#{not v2ThesaurusEditionCsvImportBean.superAdmin}"
                                 style="width: 100%;">
                    <f:selectItems value="#{v2ThesaurusEditionCsvImportBean.projects}" var="project"
                                   itemLabel="#{project.name}" itemValue="#{project.id}"/>
                </p:selectOneMenu>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-3 text-right">
                <h:outputText value="Fichier"/>
            </div>
            <div class="col-8">
                <p:fileUpload listener="#{v2ThesaurusEditionCsvImportBean.loadFileCsv}"
                              label="#{v2LocaleBean.getMsg('candidat.parcourir')}"
                              mode="advanced" auto="true" update="importCsvResume"
                              onstart="PF('waitDialog').show();" allowTypes="/(\.|\/)(csv|txt)$/"/>
            </div>
        </div>

        <h:panelGroup id="importCsvResume" rendered="#{v2ThesaurusEditionCsvImportBean.loadDone}">
            <div class="row mb-2">
                <div class="col-3 text-right"><h:outputText value="Nombre de lignes"/></div>
                <div class="col-8"><h:outputText value="#{v2ThesaurusEditionCsvImportBean.total}"/></div>
            </div>
            <div class="row mb-3" rendered="#{not empty v2ThesaurusEditionCsvImportBean.warning}">
                <div class="col-3 text-right"><h:outputText value="Avertissement"/></div>
                <div class="col-8"><h:outputText value="#{v2ThesaurusEditionCsvImportBean.warning}"/></div>
            </div>
            <div class="row mb-3" rendered="#{v2ThesaurusEditionCsvImportBean.total > 0}">
                <div class="col-12 text-center">
                    <p:commandButton value="Importer"
                                     icon="fas fa-file-import"
                                     actionListener="#{v2ThesaurusEditionCsvImportBean.importThesaurus()}"
                                     update="importCsvResume containerIndex messageIndex"/>
                </div>
            </div>
        </h:panelGroup>

        <div class="row" style="margin-top: 30px;">
            <div class="col-12 text-center">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnBack')}" styleClass="ui-button-secondary button"
                                 icon="fas fa-undo-alt" update="containerIndex"
                                 action="#{v2EditionBean.showList()}"/>
            </div>
        </div>
    </div>
</ui:fragment>
