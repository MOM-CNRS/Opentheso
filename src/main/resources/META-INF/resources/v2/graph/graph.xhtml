<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pe="http://primefaces.org/ui/extensions">

    <f:view>
        <f:metadata>
    <f:viewAction action="#{v2ConsultationShellBean.load()}"/>
            <f:viewAction action="#{v2GraphViewBean.load()}"/>
        </f:metadata>
    </f:view>

    <h:head>
        <title>Opentheso</title>

        <link href="../../resources/img/icon_opentheso2.png" rel="icon" />

        <link rel="stylesheet" type="text/css" href="../../resources/css/all.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css" />
        <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css" />

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/>
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/v4-shims.css"/>
    </h:head>

    <h:body id="page-top" onload="initMenu()">

        <style>
            .ui-dataview .ui-dataview-header {
                border-bottom: 0 none;
                display: none;
            }
        </style>

        <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>

        <h:panelGroup rendered="#{v2UserSession.isLoggedIn() and v2GraphViewBean.screenAvailable}" id="wrapper" style="height: 100vh;" >

            <ui:include src="../thesaurus/includes/layout/menu.xhtml" />

            <div id="content-wrapper" style="width: 100%; height:100%; position:relative; overflow: hidden;">

                <h:panelGroup id="header">
                    <ui:include src="../thesaurus/includes/layout/header.xhtml"/>
                </h:panelGroup>

                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin: 20px; display: flex; justify-content: space-between">
                        <h1 class="h3 mb-0 text-gray-800">
                            <span style="color: #f47b2a">
                                <p:graphicImage value="/resources/img/graph.png" style="width: 42px; margin-right: 5px;"/>
                                #{v2LocaleBean.getMsg('graph')}
                            </span> (v2)
                        </h1>

                        <h:form id="graph-toolbar-form">
                            <p:commandButton update="graph-form"
                                             icon="fas fa-sync" styleClass="rounded-button ui-button-outlined"
                                             style="color: #F47B2A"
                                             title="recharger la page"
                                             actionListener="#{v2GraphViewBean.refreshViews()}"/>
                            <p:commandButton value="#{v2LocaleBean.getMsg('graphdialog.manage_view.NewView')}" styleClass="ui-button-success" icon="fa fa-plus"
                                             update="idManageView" oncomplete="PF('manageView').show();" actionListener="#{v2GraphViewBean.initNewViewDialog()}"/>
                            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
                        </h:form>
                    </div>

                    <p:scrollPanel mode="native" style="height: 82vh">
                        <h:form id="graph-form">
                            <p:dataView var="graph_view" value="#{v2GraphViewBean.graphViews}" rows="6" paginator="true"
                                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}" rowsPerPageTemplate="6,12,16"
                                        emptyMessage="#{v2LocaleBean.getMsg('rightbody.conceptdialog.noRecordFound')}"
                                        layout="grid" gridRowStyleClass="sm:col-2 lg:col-4 xl:col-6">

                                <p:dataViewGridItem>
                                    <div class="row" style="margin-right: 1px; ">
                                        <div class="col-1 offset-11" >
                                            <p:menuButton icon="pi pi-align-justify" >
                                                <p:menuitem value="#{v2LocaleBean.getMsg('graphdialog.manage_view.modify')}"
                                                            icon="fa fa-pen"
                                                            update="idManageView manageViewForm"
                                                            oncomplete="PF('manageView').show();"
                                                            actionListener="#{v2GraphViewBean.initEditViewDialog(graph_view.id)}"/>
                                                <p:menuitem value="#{v2LocaleBean.getMsg('graphdialog.manage_view.delete')}"
                                                            icon="fa fa-trash" update="graph-form"
                                                            actionListener="#{v2GraphViewBean.removeView(graph_view.id)}">
                                                    <p:confirm header="#{v2LocaleBean.getMsg('profile.confirmation')}"
                                                               message="#{v2LocaleBean.getMsg('graphdialog.manage_view.deleteconfirm')} ?"
                                                               icon="pi pi-info-circle"/>
                                                </p:menuitem>
                                            </p:menuButton>
                                        </div>
                                    </div>

                                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                                        <p:commandButton value="#{v2LocaleBean.getMsg('no')}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                                        <p:commandButton value="#{v2LocaleBean.getMsg('yes')}" type="button" styleClass="ui-confirmdialog-yes" />
                                    </p:confirmDialog>

                                    <div class="card border-1" style="padding: 10px; margin: 1px">
                                        <div style="height: 150px;">
                                            <p style="font-weight: bold; font-size: 1.15rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; text-overflow: ellipsis;">#{graph_view.name}</p>
                                            <p style="text-overflow: ellipsis; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;">#{graph_view.description}</p>
                                        </div>

                                        <div style="height: 10px; text-align: right;">
                                            <p:commandButton id="btnAjaxCopy" icon="fa-solid fa-copy fa-2xl" styleClass="rounded-button ui-button-flat" style="font-size: 2rem; color: #f47b2a; background-color: transparent;"
                                                             onclick="return false;" />
                                            <pe:clipboard id="clipAjax" trigger="btnAjaxCopy" action="copy" text="#{v2GraphViewBean.generateGraphVisualizationUrl(graph_view.id)}&amp;title=#{graph_view.name}" >
                                                <p:ajax event="success" listener="#{clipboardFeedbackBean.onSuccess}" update="messageIndex"/>
                                                <p:ajax event="error" listener="#{clipboardFeedbackBean.onError}" update="messageIndex" />
                                            </pe:clipboard>
                                            <p:tooltip for="btnAjaxCopy" value="#{v2LocaleBean.getMsg('graph.urlCopy')}" />
                                        </div>
                                        <div >
                                            <p:dataList emptyMessage="#{v2LocaleBean.getMsg('rightbody.conceptdialog.noRecordFound')}" value="#{graph_view.exports}" var="export" type="none" style="height: 100px;">
                                                <p:chip rendered="#{empty export.conceptId()}" label="#{export.thesaurusId()}" styleClass="mr-2" style="color:#601e18; background-color:#ECF8F1 ">
                                                    <p:ajax listener="#{v2GraphViewBean.onSelectThesaurus}" update="messageIndex"/>
                                                </p:chip>
                                                <p:chip rendered="#{not empty export.conceptId()}" label="#{export.thesaurusId()}, #{export.conceptId()}" styleClass="mr-2" style="color:#601e18; background-color:#FAEDE5">
                                                    <p:ajax listener="#{v2GraphViewBean.onSelectThesaurusConcept}" update="messageIndex"/>
                                                </p:chip>
                                            </p:dataList>
                                        </div>
                                        <div class="row">
                                            <div class="col-6">
                                                <p:commandButton value="#{v2LocaleBean.getMsg('graphdialog.manage_view.DisplayWithD3')}"
                                                                 styleClass="ui-button-success"
                                                                 icon="fa fa-diagram-project"
                                                                 style="margin-left: 0px;" ajax="true" process="@this"
                                                                 rendered="#{not empty graph_view.exports}"
                                                                 onclick="openInNewTab('#{v2GraphViewBean.generateGraphVisualizationUrl(graph_view.id)}', '#{graph_view.name}'); return false;" />
                                            </div>

                                            <div class="col-6" style="text-align: right">
                                                <p:commandButton value="#{v2LocaleBean.getMsg('graphdialog.manage_view.ExportToNeo4j')}"
                                                                 styleClass="ui-button-secondary"
                                                                 icon="fa fa-paper-plane"
                                                                 rendered="#{not empty graph_view.exports}"
                                                                 actionListener="#{v2GraphViewBean.exportToNeo4J(graph_view.id)}"
                                                                 update="messageIndex graph-form" />
                                            </div>
                                        </div>
                                    </div>
                                </p:dataViewGridItem>
                            </p:dataView>
                            <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}" />
                        </h:form>
                    </p:scrollPanel>
                </div>
                <ui:include src="../thesaurus/includes/layout/footer.xhtml" />
                <ui:include src="../thesaurus/includes/layout/logout-dialog.xhtml"/>
                <ui:include src="../thesaurus/includes/layout/login-dialog.xhtml"/>
                <ui:include src="../thesaurus/includes/layout/forget-password-dialog.xhtml"/>
                <ui:include src="dialog/manageView.xhtml" />
            </div>
        </h:panelGroup>

        <h:outputScript target="body">
            function openInNewTab(url, name) {
                if (url) {
                    const encodedName = encodeURIComponent(name);
                    window.open(url + '&amp;title=' + encodedName, '_blank');
                } else {
                    alert('URL introuvable.');
                }
            }
        </h:outputScript>
    </h:body>
</html>
