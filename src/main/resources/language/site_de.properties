gps.help1=GPS-Koordinaten müssen in Dezimalgraden direkt in das entsprechende Feld eingegeben werden, in Klammern und mit einem Leerzeichen zwischen dem Breiten- und dem Längengrad. Behalten Sie weder ein trennendes Komma noch das Gradzeichen (°) bei.
gps.help2=Beispiel für einen GPS-Punkt: (45.783571 4.846484).
gps.help3=Um eine Polyline zu definieren, trennen Sie die verschiedenen Gruppen von Werten durch ein Komma. Beispiel: (48.816314 2.229950, 48.812595 2.438535, 48.913862 2.343806, 49.028064 2.431248).
gps.help4=Um ein Polygon zu definieren, gehen Sie wie bei einer Polyline vor und wiederholen zum Schluss den 1. GPS-Punkt, um die Figur zu schließen. Beispiel: (48.816314 2.229950, 48.812595 2.438535, 48.913862 2.343806, 48.816314 2.229950).
gps.help5=Um die GPS-Koordinaten zu löschen, müssen Sie den Inhalt leeren und bestätigen.
gps.help6=Am Ende muss man auf das Lokalisierungssymbol rechts neben dem Feld klicken, um die Änderung zu übernehmen. 
gps.help7=(Von Patricia Moitrel).

