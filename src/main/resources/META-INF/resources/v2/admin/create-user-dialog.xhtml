<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idV2CreateUser" header="#{v2LocaleBean.getMsg('profile.new_user')}" widgetVar="v2CreateUser"
              width="550" modal="true" resizable="false" position="top">
        <h:form id="v2CreateUserForm">
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.pseudo')} *"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.newUsername}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.email')} *"/></div>
                <div class="col-8"><p:inputText value="#{v2AllUsersBean.newEmail}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('menu.password')} *"/></div>
                <div class="col-8"><p:password value="#{v2AllUsersBean.newPassword}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.confirmation')}"/></div>
                <div class="col-8"><p:password value="#{v2AllUsersBean.newPasswordConfirmation}" style="width:100%"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.alert_by_email')}"/></div>
                <div class="col-8"><p:toggleSwitch value="#{v2AllUsersBean.newAlertMail}"/></div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.role')}"/></div>
                <div class="col-8">
                    <p:selectOneMenu value="#{v2AllUsersBean.newRoleId}" style="width:100%">
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2AllUsersBean.roles}" var="role" itemLabel="#{role.name()}" itemValue="#{role.id()}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.project')}"/></div>
                <div class="col-8">
                    <p:selectOneMenu value="#{v2AllUsersBean.newProjectId}" style="width:100%">
                        <p:ajax event="change" listener="#{v2AllUsersBean.onNewProjectChange()}" update="newThesaurusLimit"/>
                        <f:selectItem itemLabel="..." itemValue=""/>
                        <f:selectItems value="#{v2AllUsersBean.projects}" var="project" itemLabel="#{project.name()}" itemValue="#{project.id()}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <h:panelGroup id="newThesaurusLimit">
                <h:panelGroup rendered="#{v2AllUsersBean.newProjectId != null}">
                    <div class="row mb-2">
                        <div class="col-4 text-right">
                            <h:outputText value="#{v2LocaleBean.getMsg('profile.limitRoleOnTheso')}"
                                          title="#{v2LocaleBean.getMsg('profile.limitRoleOnThesoTooltip')}"/>
                        </div>
                        <div class="col-8">
                            <p:toggleSwitch value="#{v2AllUsersBean.newLimitedOnThesaurus}">
                                <p:ajax update="newThesaurusLimit"/>
                            </p:toggleSwitch>
                        </div>
                    </div>
                    <h:panelGroup rendered="#{v2AllUsersBean.newLimitedOnThesaurus}">
                        <div class="row mb-2">
                            <div class="col-4 text-right"><h:outputText value="#{v2LocaleBean.getMsg('profile.list_of_thesauri')}"/></div>
                            <div class="col-8">
                                <p:selectManyMenu value="#{v2AllUsersBean.newSelectedThesaurusIds}"
                                                  showCheckbox="true" style="width:100%">
                                    <f:selectItems value="#{v2AllUsersBean.newProjectThesauri}" var="theso"
                                                   itemLabel="#{theso.title()} (#{theso.id()})" itemValue="#{theso.id()}"/>
                                </p:selectManyMenu>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>
            <div class="text-right mt-3">
                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}" icon="pi pi-check"
                                 action="#{v2AllUsersBean.createUser()}" update=":containerIndex :messageIndex"/>
            </div>
        </h:form>
    </p:dialog>
</ui:fragment>
