<ui:fragment xmlns="http://www.w3.org/1999/xhtml"  
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="idV2ConfirmDeleteCorpus" header="Confirmer la suppression" widgetVar="v2ConfirmDeleteCorpus" 
              width="450" showEffect="fade" modal="true" resizable="false" position="top" style="margin-top: 30px" >

        <h:form id="v2ConfirmDeleteCorpusForm">
            <div class="row">
                <div class="col-12">
                    <h:outputText value="Voulez-vous supprimer le lien vers ce corpus "
                                  style="font-size: 13px; color: black;"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px; font-size: 12px;">
                <div class="col-12">
                    <h:outputText value="#{v2CorpusSettingsBean.corpusEditor.corpusName}"
                                  style="font-size: 13px; color: #C63632;"/>
                </div>
            </div>

            <div style="width: 100%; text-align: right; margin-top: 5px; margin-bottom: 5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 styleClass="ui-button-secondary button" icon="fas fa-undo-alt"
                                 style="margin-right: 10px"
                                 oncomplete="PF('v2ConfirmDeleteCorpus').hide();" update="idV2ConfirmDeleteCorpus"/>

                <p:commandButton value="Supprimer" styleClass="ui-button-success" icon="pi pi-check"
                                 update="containerIndex messageIndex" process="@this"
                                 action="#{v2CorpusSettingsBean.delete()}"/>
            </div>
        </h:form>
    </p:dialog>     
</ui:fragment>
