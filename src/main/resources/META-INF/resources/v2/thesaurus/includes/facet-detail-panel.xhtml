<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui">

  <h:panelGroup rendered="#{v2ThesaurusBrowseBean.selectedFacet != null}" styleClass="textOpentheso" style="margin:30px;">

    <div class="row" style="margin-left:0;">
      <div class="col-12" style="text-align:left;">
        <h:outputText value="#{v2LocaleBean.getMsg('leftbody.facet')}"
                      style="font-size:14px; font-weight:bold; font-style:italic;"/>
      </div>
    </div>

    <div class="card mb-4 py-3 border-left-success" style="margin:20px;">
      <div class="list-group">

        <!-- Libellé -->
        <div class="list-group-item list-group-item-action">
          <div class="row" style="margin-left:0;">
            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
              <h:outputText value="#{v2LocaleBean.getMsg('statistique.label')}"
                            style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
              <p:menuButton rendered="#{v2FacetDetailEditorBean.managerActionsAvailable}"
                            icon="fas fa-cog"
                            style="background:none; border:none; color:#000; box-shadow:none;">
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.renamefacet')}"
                            icon="fas fa-pencil-alt"
                            actionListener="#{v2FacetDetailEditorBean.prepareModify()}"
                            oncomplete="PF('v2ModifyFacetDlg').show();"
                            update=":containerIndex:v2ModifyFacetDlg"/>
              </p:menuButton>
              <h:outputText value="#{v2ThesaurusBrowseBean.selectedFacet.label} (#{v2ThesaurusBrowseBean.selectedFacet.lang})"
                            title="#{v2ThesaurusBrowseBean.selectedFacet.facetId}"
                            style="font-size:14px;"/>
            </div>
          </div>
        </div>

        <!-- Concept parent -->
        <div class="list-group-item list-group-item-action">
          <div class="row" style="margin-left:0; margin-top:10px;">
            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
              <h:outputText value="#{v2LocaleBean.getMsg('rightbody.facetdialog.parent_concept')}"
                            style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
              <p:menuButton rendered="#{v2FacetDetailEditorBean.managerActionsAvailable}"
                            icon="fas fa-cog"
                            style="background:none; border:none; color:#000; box-shadow:none;">
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.modify_ParentConcept')}"
                            icon="fas fa-pencil-alt"
                            actionListener="#{v2FacetDetailEditorBean.prepareChangeParent()}"
                            oncomplete="PF('v2ChangeFacetParentDlg').show();"
                            update=":containerIndex:v2ChangeFacetParentForm"/>
              </p:menuButton>
              <p:commandLink value="#{empty v2ThesaurusBrowseBean.selectedFacet.parentConceptLabel
                                      ? '('.concat(v2ThesaurusBrowseBean.selectedFacet.parentConceptId).concat(')')
                                      : v2ThesaurusBrowseBean.selectedFacet.parentConceptLabel}"
                             title="#{v2ThesaurusBrowseBean.selectedFacet.parentConceptId}"
                             action="#{v2ThesaurusBrowseBean.openConcept(v2ThesaurusBrowseBean.selectedFacet.parentConceptId)}"
                             process="@this"
                             update=":containerIndex:formRightTab :containerIndex:formLeftTab"
                             style="color:#601e18; font-size:14px;"/>
            </div>
          </div>
        </div>

        <!-- Membres -->
        <div class="list-group-item list-group-item-action">
          <div class="row" style="margin-left:0; margin-top:10px;">
            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
              <h:outputText value="#{v2LocaleBean.getMsg('group.members')}"
                            title="#{v2LocaleBean.getMsg('group.members')}"
                            style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
              <p:menuButton rendered="#{v2FacetDetailEditorBean.managerActionsAvailable}"
                            icon="fas fa-cog"
                            style="color:#F7A269; background:none; border:none; box-shadow:none; font-size:12px;">
                <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.new_concept')}"
                            icon="fas fa-file-alt"
                            actionListener="#{v2FacetDetailEditorBean.prepareAddChildUnderFacet()}"
                            oncomplete="PF('v2AddChildUnderFacetDlg').show();"
                            update=":containerIndex:v2AddChildUnderFacetDlg"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.addExistingConcepts')}"
                            icon="far fa-file-alt"
                            actionListener="#{v2FacetDetailEditorBean.prepareAddMember()}"
                            oncomplete="PF('v2AddMemberToFacetDlg').show();"
                            update=":containerIndex:v2AddMemberToFacetForm"/>
                <p:menuitem value="#{v2LocaleBean.getMsg('leftbody.removeFacetMembers')}"
                            icon="far fa-trash-alt"
                            oncomplete="PF('v2RemoveMembersFromFacetDlg').show();"
                            update=":containerIndex:v2RemoveMembersFromFacetDlg"/>
              </p:menuButton>

              <h:panelGroup rendered="#{empty v2ThesaurusBrowseBean.selectedFacet.members}">
                <h:outputText value="....."
                              title="#{v2LocaleBean.getMsg('rightbody.concept.no_value')}"
                              style="color:grey; font-style:italic;"/>
              </h:panelGroup>
              <h:panelGroup rendered="#{not empty v2ThesaurusBrowseBean.selectedFacet.members}">
                <ui:repeat value="#{v2ThesaurusBrowseBean.selectedFacet.members}" var="member" varStatus="status">
                  <p:commandLink value="#{empty member.label ? '('.concat(member.conceptId).concat(')') : member.label}"
                                 title="#{member.conceptId}"
                                 action="#{v2ThesaurusBrowseBean.openConcept(member.conceptId)}"
                                 process="@this"
                                 update=":containerIndex:formRightTab :containerIndex:formLeftTab"
                                 style="color:#601e18; font-size:14px;"/>
                  <h:outputText value=" , " rendered="#{not status.last}" style="color:#FF7979;"/>
                </ui:repeat>
              </h:panelGroup>
            </div>
          </div>
        </div>

        <!-- Traductions (visible si connecté ou si traductions présentes) -->
        <h:panelGroup rendered="#{v2ThesaurusBrowseBean.loggedIn or not empty v2ThesaurusBrowseBean.selectedFacet.translations}">
          <div class="list-group-item list-group-item-action">
            <div class="row" style="margin-left:0; margin-top:10px;">
              <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
                <h:outputText value="#{v2LocaleBean.getMsg('candidat.traduction')}"
                              style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
              </div>
              <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
                <p:menuButton rendered="#{v2FacetDetailEditorBean.managerActionsAvailable}"
                              icon="fas fa-cog"
                              style="color:#F7A269; background:none; border:none; box-shadow:none; font-size:12px;">
                  <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.add_traduction')}"
                              icon="fas fa-plus"
                              actionListener="#{v2FacetDetailEditorBean.prepareAddTranslation()}"
                              oncomplete="PF('v2AddFacetTranslationDlg').show();"
                              update=":containerIndex:v2AddFacetTranslationDlg"/>
                  <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.edit_traduction')}"
                              icon="fas fa-pencil-alt"
                              actionListener="#{v2FacetDetailEditorBean.prepareEditTranslations()}"
                              oncomplete="PF('v2EditFacetTranslationsDlg').show();"
                              update=":containerIndex:v2EditFacetTranslationsDlg"/>
                  <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.delete_traduction')}"
                              icon="far fa-trash-alt"
                              actionListener="#{v2FacetDetailEditorBean.prepareDeleteTranslation()}"
                              oncomplete="PF('v2DeleteFacetTranslationDlg').show();"
                              update=":containerIndex:v2DeleteFacetTranslationDlg"/>
                </p:menuButton>

                <h:panelGroup rendered="#{empty v2ThesaurusBrowseBean.selectedFacet.translations}">
                  <h:outputText value="....."
                                title="#{v2LocaleBean.getMsg('rightbody.concept.no_value')}"
                                style="color:grey; font-style:italic;"/>
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty v2ThesaurusBrowseBean.selectedFacet.translations}">
                  <ui:repeat value="#{v2ThesaurusBrowseBean.selectedFacet.translations}" var="translation">
                    <h:outputText value="[#{translation.lang}] #{translation.value}"
                                  style="color:#43B572; font-size:14px;"/>
                    <br/>
                  </ui:repeat>
                </h:panelGroup>
              </div>
            </div>
          </div>
        </h:panelGroup>

        <p:spacer height="20px"/>
        <p:spacer height="2px" width="98%" style="margin-left:10px; background-color:#CBD1DC; font-weight:100;"/>

        <!-- Commandes notes -->
        <h:panelGroup rendered="#{v2FacetNoteEditorBean.noteActionsAvailable}">
          <div class="row" style="margin-left:10px; margin-bottom:5px; margin-top:5px;">
            <h:outputText value="#{v2LocaleBean.getMsg('rightbody.concept.notes')}"
                          style="color:#78261f; font-size:14px; font-weight:bold; margin-right:5px;"/>
            <p:menuButton icon="pi pi-cog"
                          style="background:none; border:none; color:#000; box-shadow:none;">
              <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.add_note')}"
                          icon="fas fa-plus"
                          actionListener="#{v2FacetNoteEditorBean.prepareManageNote()}"
                          update=":containerIndex:v2FacetManageNoteForm"
                          oncomplete="PF('v2FacetManageNoteDlg').show();"/>
              <p:menuitem value="#{v2LocaleBean.getMsg('rightbody.concept.delete_note')}"
                          icon="fas fa-minus"
                          actionListener="#{v2FacetNoteEditorBean.prepareDeleteNotes()}"
                          update=":containerIndex:v2FacetDeleteNoteForm"
                          oncomplete="PF('v2FacetDeleteNoteDlg').show();"/>
            </p:menuButton>
          </div>
        </h:panelGroup>

        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="note"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.note"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="changeNote"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.change_note"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="definition"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.definition"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="editorialNote"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.editorial_note"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="example"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.example_note"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="historyNote"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.history_note"/>
        </ui:include>
        <ui:include src="facet-detail-note-row.xhtml">
          <ui:param name="noteType" value="scopeNote"/>
          <ui:param name="noteMessageKey" value="rightbody.concept.scope_note"/>
        </ui:include>

        <p:spacer height="20px"/>
        <p:spacer height="2px" width="98%"
                  style="margin-left:10px; margin-bottom:10px; background-color:#CBD1DC; font-weight:100;"/>

        <!-- Identifiant -->
        <div class="list-group-item list-group-item-action">
          <div class="row" style="margin-left:0;">
            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-5" style="text-align:left;">
              <h:outputText value="#{v2LocaleBean.getMsg('search.identifier')}"
                            style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
            </div>
            <div class="col-xl-9 col-lg-8 col-md-7 col-sm-7" style="margin-left:-10px;">
              <h:outputText value="#{v2ThesaurusBrowseBean.selectedFacet.facetId}" style="color:#601e18;"/>
            </div>
          </div>
        </div>

      </div>
    </div>

    <h:panelGroup rendered="#{v2FacetDetailEditorBean.managerActionsAvailable}">
      <div class="mb-4" style="margin-right:30px;">
        <div class="row">
          <div class="col-12" style="text-align:right;">
            <p:commandButton title="#{v2LocaleBean.getMsg('facet.deleteFacet')}"
                             value="#{v2LocaleBean.getMsg('facet.deleteFacet')}"
                             styleClass="ui-button-danger"
                             actionListener="#{v2FacetDetailEditorBean.submitDelete()}"
                             update=":containerIndex:formRightTab :containerIndex:formLeftTab :messageIndex"
                             process="@this">
              <p:confirm header="#{v2LocaleBean.getMsg('profile.confirmation')}"
                         message="#{v2LocaleBean.getMsg('facet.confirmDelete')}"
                         icon="pi pi-info-circle"/>
            </p:commandButton>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
              <p:commandButton value="#{v2LocaleBean.getMsg('no')}" type="button"
                               icon="fas fa-undo-alt" styleClass="ui-confirmdialog-no ui-button-secondary"/>
              <p:commandButton value="#{v2LocaleBean.getMsg('yes')}" type="button"
                               icon="pi pi-times" styleClass="ui-confirmdialog-yes ui-button-success"/>
            </p:confirmDialog>
          </div>
        </div>
      </div>
    </h:panelGroup>

    <ui:include src="dialogs/facet-note-dialogs.xhtml"/>
  </h:panelGroup>
</ui:fragment>
