<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
             xmlns:p="http://primefaces.org/ui"
             xmlns:h="http://xmlns.jcp.org/jsf/html">

    <h:panelGroup id="v2PropositionReviewPanel" styleClass="textOpentheso" style="margin:0;">

        <div class="row">
            <div class="col-11" style="margin-top:-10px;">
                <p:staticMessage severity="warn" summary="Info"
                                 detail="#{v2LocaleBean.getMsg('rightbody.proposal.info1')}"
                                 style="width:100%;"/>
            </div>
        </div>

        <ui:include src="proposition/review-term.xhtml"/>
        <ui:include src="proposition/review-traduction.xhtml"/>
        <ui:include src="proposition/review-note.xhtml"/>

        <h:panelGroup rendered="#{v2PropositionBean.sameUser}">
            <div class="row" style="margin-left:15px; margin-right:15px;">
                <div class="col-12">
                    <h:outputText value="#{v2LocaleBean.getMsg('proposition.alertSameUser')} !! "
                                  style="font-size:14px; font-weight:bold; color:#D32F2F;"/>
                </div>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{v2PropositionBean.canMakeAction}">
            <div class="card mb-4 py-3 border-left-success" style="margin:10px;">
                <div class="list-group" style="margin-top:-10px; margin-bottom:-10px;">
                    <div class="row" style="margin-left:15px; margin-right:15px;">
                        <div class="col-3">
                            <h:outputText value="#{v2LocaleBean.getMsg('rightbody.conceptdialog.name')} : "
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                        <div class="col-9">
                            <h:outputText value="#{v2PropositionBean.selectedProposition.authorName}"
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                    </div>

                    <div class="row" style="margin-left:15px; margin-right:15px; margin-top:10px;">
                        <div class="col-3">
                            <h:outputText value="#{v2LocaleBean.getMsg('profile.email')} : "
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                        <div class="col-9">
                            <h:outputText value="#{v2PropositionBean.selectedProposition.authorEmail}"
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                    </div>

                    <h:panelGroup rendered="#{not empty v2PropositionBean.selectedProposition.comment}">
                        <div class="row" style="margin-left:15px; margin-right:15px; margin-top:10px;">
                            <div class="col-12">
                                <h:outputText value="#{v2LocaleBean.getMsg('proposition.commentaire')} : "
                                              style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                            </div>
                        </div>
                        <div class="row" style="margin-left:15px; margin-right:15px;">
                            <div class="col-12">
                                <h:outputText escape="false"
                                              value="#{v2PropositionBean.selectedProposition.comment}"/>
                            </div>
                        </div>
                    </h:panelGroup>

                    <div class="row" style="margin-left:15px; margin-right:15px; margin-top:20px;">
                        <div class="col-12">
                            <h:outputText value="Commentaire de l'administrateur : "
                                          style="font-size:14px; font-weight:bold; color:#8f8f8f;"/>
                        </div>
                    </div>
                    <div class="row" style="margin-left:15px; margin-right:15px;">
                        <div class="col-12">
                            <p:textEditor readonly="#{not v2PropositionBean.showButtonDecision}"
                                          value="#{v2PropositionBean.reviewComment}"
                                          secure="false" height="150"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" style="margin-top:15px; margin-left:10px; margin-right:10px;">
                <div class="col-3">
                    <p:commandButton value="#{v2LocaleBean.getMsg('btnCancel')}"
                                     rendered="#{v2PropositionBean.showButtonDecision}"
                                     style="margin-right:10px; background-color:#8f8f8f; border-color:#8f8f8f;"
                                     icon="fas fa-undo-alt"
                                     styleClass="ui-button-secondary"
                                     process="@this"
                                     actionListener="#{v2ThesaurusBrowseBean.closeProposition()}"
                                     update=":containerIndex:formRightTab"/>
                </div>
                <div class="col-9" style="text-align:right;">
                    <p:commandButton value="#{v2LocaleBean.getMsg('candidat.remove')}"
                                     style="margin-right:10px;"
                                     styleClass="ui-button-secondary"
                                     icon="fa fa-regular fa-trash"
                                     process="@this"
                                     actionListener="#{v2PropositionBean.prepareConfirm('supprimerProposition')}"
                                     update=":messageIndex v2PropositionConfirmDialog"/>

                    <p:commandButton value="#{v2LocaleBean.getMsg('proposition.refuser')}"
                                     rendered="#{v2PropositionBean.showButtonDecision}"
                                     style="margin-right:10px; background-color:red; border-color:red;"
                                     styleClass="ui-button-secondary"
                                     icon="pi pi-times-circle"
                                     process="@form"
                                     actionListener="#{v2PropositionBean.prepareConfirm('refuserProposition')}"
                                     update=":messageIndex v2PropositionConfirmDialog"/>

                    <p:commandButton value="#{v2LocaleBean.getMsg('proposition.approuver')}"
                                     rendered="#{v2PropositionBean.showButtonDecision}"
                                     style="background-color:#43B572; border-color:#43B572;"
                                     styleClass="ui-button-success"
                                     icon="pi pi-check-circle"
                                     process="@form"
                                     actionListener="#{v2PropositionBean.prepareConfirm('approuverProposition')}"
                                     update=":messageIndex v2PropositionConfirmDialog"/>
                </div>
            </div>
        </h:panelGroup>

        <p:dialog id="v2PropositionConfirmDialog"
                  header="#{v2LocaleBean.getMsg('profile.confirmation')}"
                  widgetVar="v2PropositionConfirmDialog"
                  width="450" showEffect="fade" modal="true"
                  resizable="false" position="top" style="margin-top:30px;">
            <div class="row">
                <div class="col-12">
                    <h:outputText value="#{v2PropositionBean.confirmMessage}"/>
                </div>
            </div>
            <div style="width:100%; text-align:right; margin-top:25px; margin-bottom:5px;">
                <p:commandButton value="#{v2LocaleBean.getMsg('candidat.close')}"
                                 icon="fas fa-undo-alt"
                                 styleClass="ui-button-secondary"
                                 style="margin-right:10px;"
                                 process="@this"
                                 update="v2PropositionConfirmDialog"
                                 oncomplete="PF('v2PropositionConfirmDialog').hide();"/>

                <p:commandButton value="#{v2LocaleBean.getMsg('btnValidate')}"
                                 styleClass="ui-button-success"
                                 icon="pi pi-check"
                                 process="@this"
                                 actionListener="#{v2ThesaurusBrowseBean.executePropositionDecision()}"
                                 update=":containerIndex:formRightTab :messageIndex @([id$=v2NotificationProp]) :v2ListPropositionsPanel"
                                 oncomplete="PF('v2PropositionConfirmDialog').hide();"/>
            </div>
        </p:dialog>
    </h:panelGroup>
</ui:fragment>
