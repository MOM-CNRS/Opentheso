<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
             xmlns:ui="http://java.sun.com/jsf/facelets"
             xmlns:h="http://xmlns.jcp.org/jsf/html"
             xmlns:p="http://primefaces.org/ui"
             xmlns:f="http://xmlns.jcp.org/jsf/core">

    <p:dialog id="idV2ModifyPassword" header="#{langueBean.getMsg('password.reset')}" widgetVar="v2ModifyPassword"
              width="550" showEffect="fade" modal="true" resizable="false" position="top" style="margin-top: 30px">
        <h:form id="v2ModifyPasswordForm">

            <div class="row" style="margin-top: 30px">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('profile.new_password')} : "/>
                </div>
                <div class="col-7">
                    <p:password id="v2PasswordUpdate1" value="#{v2ModifyPasswordBean.password}"
                                style="width:100%" autocomplete="off" redisplay="true"
                                feedback="true"
                                promptLabel="#{langueBean.getMsg('password.prompt')}"
                                weakLabel="#{langueBean.getMsg('password.weak')}"
                                goodLabel="#{langueBean.getMsg('password.good')}"
                                strongLabel="#{langueBean.getMsg('password.strong')}">
                        <f:validator validatorId="passwordValidator"/>
                    </p:password>
                    <p:tooltip for="v2PasswordUpdate1"
                               value="#{langueBean.getMsg('password.prompt')}"
                               position="top"
                               showEffect="fade"
                               hideEffect="fade"/>
                    <p:message for="v2PasswordUpdate1"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-5">
                    <h:outputText value="#{langueBean.getMsg('profile.confirmation')} : "/>
                </div>
                <div class="col-7">
                    <p:password value="#{v2ModifyPasswordBean.confirmation}" style="width: 100%" redisplay="true"/>
                </div>
            </div>

            <div class="row" style="margin-top: 5px;">
                <div class="col-12" style="text-align: right">
                    <p:commandButton value="#{langueBean.getMsg('apply')}"
                                     update="v2ModifyPasswordForm containerIndex messageIndex"
                                     process="@form"
                                     icon="fa-regular fa-floppy-disk"
                                     styleClass="ui-button-success"
                                     action="#{v2ModifyPasswordBean.apply()}">
                        <p:tooltip value="#{langueBean.getMsg('profile.changeUserPassTooltip')}" showDelay="1000"/>
                    </p:commandButton>
                </div>
            </div>

            <input type="hidden" name="csrfToken" value="#{sessionScope.CSRF_TOKEN}"/>
        </h:form>
    </p:dialog>
</ui:fragment>
