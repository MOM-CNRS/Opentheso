sync.guide=How it works
sync.guide.1=Enter the original thesaurus: the address of its site, its identifier, and the secret key provided by that site.
sync.guide.2=Save these details, then choose the direction: send your changes, or receive those of the original.
sync.guide.3=Start. Nothing is written on its own: a known concept becomes a proposal to review, a new concept can become a candidate.
