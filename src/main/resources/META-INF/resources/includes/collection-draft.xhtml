<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
  <div class="view-panel" id="viewCollectionDraft">
    <h:form id="previewCreateCollForm" prependId="false" styleClass="cand-draft-form" acceptcharset="UTF-8">
      <div class="cv is-on is-draft">
        <div class="cv-head df-head">
          <div class="df-title-row">
            <h1 class="cv-pref">
              <h:inputText id="createCollName" styleClass="cv-draft-input"
                           value="#{collectionDetailEditorBean.label}"
                           pt:placeholder="#{localeBean.getMsg('create.collection.namePh')}"
                           pt:aria-label="#{localeBean.getMsg('create.collection.name')}"
                           pt:autocomplete="off"/>
            </h1>
          </div>
          <p class="df-err" id="createCollErr" hidden="hidden" role="alert"
             data-need="#{localeBean.getMsg('create.collection.needName')}"></p>
          <div class="df-meta">
            <p class="cv-draft-loc" id="createCollectionSub"
               data-root="#{localeBean.getMsg('create.collection.sub')}"
               data-under="#{localeBean.getMsg('create.collection.under')}">#{localeBean.getMsg('create.collection.sub')}</p>
          </div>
        </div>
        <div class="cv-blocks">
          <section class="cblock">
            <div class="cblock-head">#{localeBean.getMsg('create.collection.notation')}</div>
            <div class="cblock-body">
              <div class="crow">
                <div class="crow-lbl">#{localeBean.getMsg('create.collection.notation')}</div>
                <div class="crow-val">
                  <h:inputText id="createCollNotation" styleClass="st-input"
                               value="#{collectionDetailEditorBean.notation}"
                               pt:placeholder="#{localeBean.getMsg('create.collection.notationPh')}"
                               pt:aria-label="#{localeBean.getMsg('create.collection.notation')}"
                               pt:autocomplete="off"/>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
      <div class="fsave">
        <button type="button" class="bo-btn ghost" data-act="create-coll-dismiss">#{localeBean.getMsg('cancel')}</button>
        <button type="button" class="bo-btn primary" data-act="create-coll-go" data-kind="create">#{localeBean.getMsg('create.collection.submit')}</button>
      </div>
      <div class="preview-open-form">
        <h:inputHidden id="previewCreateCollParent" value="#{collectionDetailEditorBean.parentCollectionId}"/>
        <h:commandButton id="previewCreateCollGo" value="#{localeBean.getMsg('create.collection.submit')}"
                         styleClass="preview-open-btn"
                         action="#{collectionDetailEditorBean.submitCreateFromView}">
          <f:ajax execute="@form" render="previewCreateCollStatus" onevent="onCreateCollAjax"/>
        </h:commandButton>
        <h:panelGroup id="previewCreateCollStatus" layout="block"
                      styleClass="bap-coll-status#{collectionDetailEditorBean.createOk ? ' is-ok' : ''}"
                      pt:data-id="#{collectionDetailEditorBean.createdGroupId}">
          <h:outputText value="#{collectionDetailEditorBean.createMessage}"/>
        </h:panelGroup>
      </div>
    </h:form>
  </div>
</ui:composition>
