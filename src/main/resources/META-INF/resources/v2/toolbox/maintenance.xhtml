<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <f:view>
        <f:metadata>
            <f:viewAction action="#{v2MaintenanceBean.load()}"/>
            <f:viewParam name="idc" value="#{v2ThesaurusContext.idConceptFromUri}"/>
            <f:viewParam name="idg" value="#{v2ThesaurusContext.idGroupFromUri}"/>
            <f:viewParam name="idt" value="#{v2ThesaurusContext.idThesoFromUri}"/>
        </f:metadata>
    </f:view>
    <h:head>
        <title>Opentheso</title>
        <link href="../../resources/img/icon_opentheso2.png" rel="icon"/>
        <link rel="stylesheet" type="text/css" href="../../resources/css/all.css"/>
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_general.css"/>
        <link rel="stylesheet" type="text/css" href="../../resources/css/theme_opentheso.css"/>
        <link rel="stylesheet" type="text/css" href="../../resources/css/composants_opentheso.css"/>
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/all.css"/>
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.0/css/v4-shims.css"/>
    </h:head>

    <h:body id="page-top" onload="initMenu()">
        <p:growl id="messageIndex" globalOnly="true" showDetail="true"/>
        <h:panelGroup rendered="#{menuBean.checkIfUserIsConnected() and v2MaintenanceBean.screenAvailable}" id="wrapper" style="height: 100%">
            <ui:include src="../../commun/menu.xhtml"/>
            <div id="content-wrapper" style="width: 100%; min-height:100%; position:relative;">
                <h:form id="containerIndex">
                    <h:panelGroup id="header">
                        <ui:include src="../../commun/header.xhtml"/>
                    </h:panelGroup>
                    <div class="container-fluid">
                        <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin: 20px">
                            <h1 class="h3 mb-0 text-gray-800">#{langueBean.getMsg('menu.toolbox')} / <span style="color: #f47b2a">#{langueBean.getMsg('menu.service')}</span></h1>
                        </div>
                        <div class="card shadow mb-4">
                            <div class="card mb-4 py-3 border-left-success" style="margin: 30px">
                                <div class="row" style="margin-left: 30px; margin-right: 30px;">
                                    <div class="col-12">
                                        <h:outputText style="font-size: 16px;" value="#{langueBean.getMsg('service.selectedThesaurus')}: #{v2MaintenanceBean.thesaurusTitle} (#{v2MaintenanceBean.thesaurusId})"/>
                                    </div>
                                    <p:accordionPanel widgetVar="v2MaintenancePanel" style="width: 100%; margin-top: 10px">
                                        <p:tab title="Corriger l'affichage des faux top termes">
                                            <p:commandButton value="#{langueBean.getMsg('service.launchCorrection')}" icon="pi pi-check"
                                                             action="#{v2MaintenanceBean.correctDisplayTopTerm()}" update="containerIndex messageIndex"/>
                                        </p:tab>
                                        <p:tab title="Correction 1 - Restructuration">
                                            <p:commandButton value="#{langueBean.getMsg('service.launchCorrection')}" icon="pi pi-check"
                                                             action="#{v2MaintenanceBean.reorganizeHierarchy()}" update="containerIndex messageIndex"/>
                                        </p:tab>
                                        <p:tab title="Correction 2 - Collections">
                                            <p:commandButton rendered="#{v2MaintenanceBean.superAdmin}" value="#{langueBean.getMsg('service.launchCorrection')}"
                                                             icon="pi pi-check" action="#{v2MaintenanceBean.reorganizeConceptsAndCollections()}"
                                                             update="containerIndex messageIndex"/>
                                        </p:tab>
                                        <p:tab title="Correction 3 - Créateur/contributeur">
                                            <p:commandButton value="#{langueBean.getMsg('service.launchCorrection')}" icon="pi pi-check"
                                                             action="#{v2MaintenanceBean.switchRolesFromTermToConcept()}" update="containerIndex messageIndex"/>
                                        </p:tab>
                                        <p:tab title="Correction 4 - Les identifiants Ark">
                                            <div class="row" style="color: black; margin-top: 10px">
                                                <div class="col-3">
                                                    <h:outputText value="*Naan: "/>
                                                    <p:inputText value="#{v2MaintenanceBean.arkEditor.naan}" style="height: 22px;"/>
                                                </div>
                                                <div class="col-3">
                                                    <h:outputText value="Prefixe: "/>
                                                    <p:inputText value="#{v2MaintenanceBean.arkEditor.prefix}" style="height: 22px;"/>
                                                </div>
                                                <div class="col-5">
                                                    <h:outputText value="!!!! Ecraser les Ark Existants? " style="color: red; font-weight: bold"/>
                                                    <p:toggleSwitch value="#{v2MaintenanceBean.arkEditor.overwrite}" style="height: 22px;"/>
                                                </div>
                                            </div>
                                            <p:commandButton value="#{langueBean.getMsg('service.generate')}" icon="pi pi-check"
                                                             action="#{v2MaintenanceBean.generateArkFromConceptId()}" update="containerIndex messageIndex"
                                                             style="margin-top: 10px"/>
                                            <div class="row" style="margin-top: 20px; color: black">
                                                <div class="col-6">
                                                    <h:outputText value="Naan: "/>
                                                    <h:outputText value="#{v2MaintenanceBean.localArkSettings.naan}" style="font-weight: bold; color: #f47b2a"/>
                                                    <h:outputText value=" / Prefixe: "/>
                                                    <h:outputText value="#{v2MaintenanceBean.localArkSettings.prefix}" style="font-weight: bold; color: #f47b2a"/>
                                                    <h:outputText value=" / taille Id: "/>
                                                    <h:outputText value="#{v2MaintenanceBean.localArkSettings.size}" style="font-weight: bold; color: #f47b2a"/>
                                                </div>
                                                <div class="col-6">
                                                    <h:outputText value="!!!! Ecraser les Ark Existants? " style="color: red; font-weight: bold"/>
                                                    <p:toggleSwitch value="#{v2MaintenanceBean.arkEditor.overwriteLocalArk}" style="height: 22px;"/>
                                                </div>
                                            </div>
                                            <p:commandButton value="Générer" icon="pi pi-check" action="#{v2MaintenanceBean.generateLocalArk()}"
                                                             update="containerIndex messageIndex" style="margin-top: 10px"/>
                                        </p:tab>
                                        <p:tab title="Générer le sitemap.xml pour le thésaurus en cours">
                                            <p:commandButton disabled="true" value="#{langueBean.getMsg('service.generate')}" icon="pi pi-check"
                                                             action="#{v2MaintenanceBean.generateSitemap()}" update="containerIndex messageIndex"/>
                                        </p:tab>
                                    </p:accordionPanel>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="csrfToken" value="${sessionScope.CSRF_TOKEN}"/>
                </h:form>
                <ui:include src="../../commun/footer.xhtml"/>
                <ui:include src="../../dialog/login/logout.xhtml"/>
            </div>
        </h:panelGroup>
    </h:body>
</html>
