#######################
# Server Configuration
#######################

server:
  port: 8099
  max-http-request-header-size: 256KB
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      cookie:
        name: ${random.value}
      timeout: 30m
  error:
    path: /errorPages/error500.xhtml
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.web.servlet.resource: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

primefaces:
  uploader: native

app:
  security:
    keycloak-enabled: true  # ou false pour désactiver
  neo4j:
    enabled: false

management:
  health:
    neo4j:
      enabled: false

spring:
  application:
    name: opentheso

  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB  # Définit la taille max d'un fichier
      max-request-size: 100MB  # Taille totale max de la requête
  datasource:
    url: jdbc:postgresql://localhost:5432/opentheso6
    password: postgres
    username: postgres
  jpa:
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/changelog/db.changelog.xml

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
      endpoint: /graphql

  mail:
    host: ${smpt.hostname}
    port: ${smpt.portNumber}
    protocol: ${smpt.protocol}
    properties:
      mail.smtp.auth: ${smpt.authorization}
      mail.smtp.starttls.enable: false
    default-encoding: UTF-8

  # Connexion de KeyCloak
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: opentheso
            client-secret: kUNAPoxYcnpj7XAYIHcjLYN5kWJ0KJr5
            provider: keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: https://login.espadon.net/realms/espadon

settings:
  workLanguage: fr

opentheso:
  concept-write:
    native-persistence-enabled: true
  auth:
    # Durée de vie du cache des droits. 0s = pas d'expiration auto (invalidation manuelle seulement).
    rights-cache-ttl: 5m
    rights-cache-max-size: 10000

crypto:
  key: 12345678901234567890123456789012 # 32 caractères exactement pour la clé d'API locale Opentheso
  openark:
    key: 12345678901234567890123456789012 # 32 caractères exactement pour la clé d'API pour OpenArk

ai:
  default-provider: ollama

  providers:
    ollama:
      enabled: true
      base-url: https://ollama.com/api/generate
      api-key: ${OLLAMA_API_KEY}
      model: gpt-oss:120b
      response-path: response
      timeout-ms: 30000
      max-tokens: 800

    openai:
      enabled: false
      base-url: https://api.openai.com/v1/chat/completions
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
      response-path: choices[0].message.content
      timeout-ms: 30000
      max-tokens: 800

certificats:
  admpriv: ./certificats/admpriv.bin
  cacerts2: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/cacerts2
  key: /Users/miledrousset/NetBeansProjects22/Opentheso/src/main/resources/certificats/key.p12

smpt:
  mailFrom: opentheso@mom.fr
  hostname: smtprelay.cnrs.fr
  portNumber: 25
  protocol: smtp
  authorization: false

neo4j:
  serverName: localhost
  serverPort: 7687
  databaseName: neo4j
  user: neo4j
  password: neo4j1234



