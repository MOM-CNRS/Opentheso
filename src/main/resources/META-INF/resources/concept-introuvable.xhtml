<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/includes/layout.xhtml">
  <ui:param name="page" value="accueil"/>
  <ui:define name="viewActions">
    <f:viewParam name="theso" value="#{conceptMissingBean.theso}"/>
    <f:viewParam name="concept" value="#{conceptMissingBean.concept}"/>
  </ui:define>
  <ui:define name="title">OpenTheso — #{localeBean.getMsg('concept.missing.title')}</ui:define>
  <ui:define name="detail"/>
  <ui:define name="main">
    <h:form id="conceptMissingForm" prependId="false">
      <div class="bo bo-solo ia-denied">
        <section class="ia-denied-panel" aria-labelledby="conceptMissingTitle">
          <div class="ia-denied-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.2-3.2"/>
              <path d="M8 11h6"/>
            </svg>
          </div>
          <p class="ia-denied-kicker">#{localeBean.getMsg('concept.missing.kicker')}</p>
          <h1 class="ia-denied-title" id="conceptMissingTitle">#{localeBean.getMsg('concept.missing.title')}</h1>
          <p class="ia-denied-sub">#{conceptMissingBean.detail}</p>
          <div class="ia-denied-actions">
            <h:commandLink styleClass="bo-btn primary"
                           action="#{navigationBean.redirectToThesaurusPicker}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
              <h:outputText value="#{localeBean.getMsg('concept.missing.back')}"/>
            </h:commandLink>
          </div>
        </section>
      </div>
    </h:form>
  </ui:define>
</ui:composition>
